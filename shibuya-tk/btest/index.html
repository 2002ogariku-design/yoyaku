<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ブランドテスト対策</title>
<style>
:root{
  --ink:#16161a; --paper:#fbfaf7; --line:#e4e1da;
  --mute:#8b8880; --sub:#55524c;
  --accent:#1c4b8a; --accent2:#e8eef7;
  --ok:#1f7a4d; --ng:#b8323c; --warm:#a8710f;
  --f:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--f);
  font-size:16px;line-height:1.6;padding-bottom:76px;}
.wrap{max-width:720px;margin:0 auto;padding:18px 16px 0;}

header{border-bottom:2px solid var(--ink);padding-bottom:12px;margin-bottom:18px;}
h1{font-size:21px;font-weight:800;margin:0;letter-spacing:-.01em;}
.dday{font-size:12.5px;color:var(--sub);margin-top:4px;font-variant-numeric:tabular-nums;}

.card{background:#fff;border:1px solid var(--line);border-radius:4px;padding:18px;margin-bottom:14px;}
.card.flat{background:none;border:none;padding:0;}
h2{font-size:13px;font-weight:800;margin:0 0 12px;letter-spacing:.02em;}

/* 出題 */
.meta{display:flex;justify-content:space-between;align-items:baseline;gap:10px;
  font-size:11.5px;color:var(--mute);margin-bottom:14px;}
.tagline{font-weight:700;color:var(--accent);}
.qtext{font-size:19px;font-weight:700;line-height:1.55;white-space:pre-wrap;margin-bottom:16px;}
.qtext.small{font-size:16.5px;font-weight:600;}
input[type=text],textarea,select{width:100%;padding:12px;border:1px solid var(--line);
  border-radius:3px;font-size:16px;font-family:var(--f);background:#fff;color:var(--ink);}
input:focus,textarea:focus{outline:none;border-color:var(--accent);}
.btn{border:none;border-radius:3px;padding:13px 18px;font-family:var(--f);font-size:15px;
  font-weight:700;cursor:pointer;background:var(--ink);color:#fff;}
.btn.sub{background:#fff;color:var(--ink);border:1px solid var(--line);}
.btn.wide{width:100%;}
.row{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap;}
.row>*{flex:1;min-width:120px;}

.answer{border-left:3px solid var(--accent);padding:12px 14px;background:var(--accent2);
  margin-top:14px;border-radius:0 3px 3px 0;}
.answer .lab{font-size:11px;font-weight:800;color:var(--accent);margin-bottom:4px;}
.answer .val{font-size:18px;font-weight:800;line-height:1.5;}
.answer .alt{font-size:13.5px;color:var(--sub);margin-top:6px;}
.answer .note{font-size:13px;color:var(--sub);margin-top:9px;padding-top:9px;
  border-top:1px solid #cfdcee;line-height:1.65;}
.verdict{display:flex;gap:8px;margin-top:14px;}
.verdict button{flex:1;padding:14px;border:1px solid var(--line);background:#fff;
  border-radius:3px;font-family:var(--f);font-size:15px;font-weight:800;cursor:pointer;}
.verdict .yes{border-color:var(--ok);color:var(--ok);}
.verdict .no{border-color:var(--ng);color:var(--ng);}
.yourans{font-size:13.5px;color:var(--sub);margin-top:10px;}
.yourans b{color:var(--ink);}

/* 選択肢 */
.choices{display:flex;flex-direction:column;gap:8px;}
.choices button{text-align:left;padding:13px 15px;border:1px solid var(--line);background:#fff;
  border-radius:3px;font-family:var(--f);font-size:15.5px;cursor:pointer;line-height:1.5;}
.choices button:disabled{cursor:default;}
.choices button.correct{border-color:var(--ok);background:#f0f8f3;color:var(--ok);font-weight:700;}
.choices button.wrong{border-color:var(--ng);background:#fdf2f3;color:var(--ng);}

/* 進捗 */
.bar{height:5px;background:var(--line);border-radius:3px;overflow:hidden;}
.bar>div{height:100%;background:var(--accent);transition:width .3s;}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);
  border:1px solid var(--line);margin-bottom:14px;}
.stats div{background:#fff;padding:12px 10px;text-align:center;}
.stats .n{font-size:22px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.2;}
.stats .l{font-size:10.5px;color:var(--mute);font-weight:700;margin-top:2px;}

/* 一覧 */
.catrow{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);cursor:pointer;}
.catrow:last-child{border-bottom:none;}
.catrow .nm{flex:1;min-width:0;font-size:14.5px;font-weight:700;}
.catrow .pct{font-size:13px;font-weight:800;font-variant-numeric:tabular-nums;width:46px;text-align:right;}
.catrow .mini{width:70px;}
.chip{display:inline-block;padding:7px 13px;margin:0 5px 6px 0;border:1px solid var(--line);
  background:#fff;border-radius:3px;font-size:13px;font-weight:700;cursor:pointer;}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink);}
.muted{color:var(--mute);}
.empty{text-align:center;color:var(--mute);padding:38px 12px;font-size:14.5px;}

/* タブ */
nav{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);
  display:flex;z-index:40;padding-bottom:env(safe-area-inset-bottom);}
nav button{flex:1;border:none;background:none;font-family:var(--f);font-size:10.5px;
  font-weight:700;color:var(--mute);padding:10px 2px 8px;cursor:pointer;}
nav button.on{color:var(--accent);box-shadow:inset 0 2px 0 var(--accent);}
nav .ic{display:block;font-size:17px;margin-bottom:2px;}
.view{display:none;} .view.on{display:block;}
#ver{position:fixed;right:8px;bottom:70px;background:rgba(0,0,0,.55);color:#fff;
  font-size:9.5px;padding:3px 8px;border-radius:10px;z-index:50;cursor:pointer;}
@media(max-width:480px){ .wrap{padding:14px 12px 0;} .qtext{font-size:17.5px;} }
</style>
</head>
<body>
<div class="wrap">
<header>
  <h1>ブランドテスト対策</h1>
  <div class="dday" id="dday"></div>
</header>

<!-- 学習 -->
<div class="view on" id="v-study">
  <div class="card" id="quizCard">
    <div class="meta">
      <span class="tagline" id="qCat"></span>
      <span id="qProg"></span>
    </div>
    <div class="qtext" id="qText"></div>
    <div id="qInput"></div>
    <div id="qResult"></div>
  </div>
  <div class="card flat">
    <div class="bar"><div id="sessBar" style="width:0%"></div></div>
    <div class="meta" style="margin:8px 0 0;">
      <span id="sessInfo"></span>
      <span><button class="btn sub" id="skipBtn" style="padding:6px 12px;font-size:12px;">スキップ</button></span>
    </div>
  </div>
</div>

<!-- 出題設定 -->
<div class="view" id="v-set">
  <div class="card">
    <h2>出題範囲</h2>
    <div id="catChips"></div>
    <h2 style="margin-top:18px;">出題のしかた</h2>
    <div id="modeChips"></div>
    <h2 style="margin-top:18px;">答え方</h2>
    <div id="inputChips"></div>
    <div class="row" style="margin-top:16px;">
      <button class="btn wide" id="startBtn">この設定で始める</button>
    </div>
  </div>
  <div class="card">
    <h2>本番形式の模試</h2>
    <p class="muted" style="font-size:13.5px;margin:0 0 12px;">
      60分・50問で通しで解きます。途中で答えは見えません。終わったら採点と復習ができます。
    </p>
    <button class="btn sub wide" id="mockBtn">模試を始める</button>
  </div>
</div>

<!-- 到達度 -->
<div class="view" id="v-prog">
  <div class="stats">
    <div><div class="n" id="stMastered">0</div><div class="l">覚えた</div></div>
    <div><div class="n" id="stLearning">0</div><div class="l">練習中</div></div>
    <div><div class="n" id="stNew">0</div><div class="l">未着手</div></div>
  </div>
  <div class="card">
    <h2>範囲ごとの到達度</h2>
    <div id="catProg"></div>
  </div>
  <div class="card">
    <h2>苦手な問題</h2>
    <div id="weakList"></div>
  </div>
  <div class="card">
    <h2>学習の記録</h2>
    <div id="histList"></div>
    <div class="row"><button class="btn sub" id="resetBtn">進捗をリセット</button></div>
  </div>
</div>

<!-- 教材 -->
<div class="view" id="v-read">
  <div class="card">
    <h2>マニュアルを読む</h2>
    <input type="text" id="readQ" placeholder="ブランド名・用語で検索">
    <div id="readList" style="margin-top:14px;"></div>
  </div>
</div>
</div>

<nav>
  <button data-v="study" class="on"><span class="ic">✎</span>学習</button>
  <button data-v="set"><span class="ic">⚙</span>出題設定</button>
  <button data-v="prog"><span class="ic">▤</span>到達度</button>
  <button data-v="read"><span class="ic">▥</span>教材</button>
</nav>

te": ""}, {"id": "q640d305394", "cat": "ジュエリー", "sub": "ヴァンクリーフ／素材", "k": "desc2name", "q": "【ヴァンクリーフ】次の特徴にあてはまる素材は？\n\nレッドタイガーズアイとも言われ、タイガーズアイが酸化し赤味が強くなったものを指す エネルギーと情熱を高める石とされており、またタイガーズアイより邪悪なものを祓う魔除けの効果が高いと言われている ヴァンクリーフでは明暗の帯が均等で調和のとれた最高品質のブルズアイだけを採用している 比較的硬度が高く、メンテナンスが簡単 モース硬度：6.5～7", "a": "ブルズアイ", "hint": "ヴァンクリーフ", "note": ""}, {"id": "q6e96cc998c", "cat": "ジュエリー", "sub": "ヴァンクリーフ／素材", "k": "desc2name", "q": "【ヴァンクリーフ】次の特徴にあてはまる素材は？\n\n主に南米にあるガイアナ共和国、スリナム共和国の奥深いジャングルで育てられている木で、不規則な黒色の斑模様が文字に似ている為、レターウッドと名付けられている 欧米では幸運を呼ぶ木として知られており、硬度の高さと木目の美しさから「木のダイヤモンド」「木の宝石」とも呼ばれている モース硬度：-", "a": "レターウッド", "hint": "ヴァンクリーフ", "note": ""}, {"id": "qfc54b9be50", "cat": "ジュエリー", "sub": "ヴァンクリーフ／素材", "k": "desc2name", "q": "【ヴァンクリーフ】次の特徴にあてはまる素材は？\n\nフランス国立セーヴル磁器製作所とメゾンがコラボレーションし、セレスティアルブルーのセーヴル焼（磁器）を制作 石英、長石、カオリンを混ぜ合わせて原料を作り、手作業により数週間もの時間をかけて、カット、着色、乾燥、焼成、そして最終的な研磨を経てサテンのような光沢感が生まれ完成する 他カラーでセランドングリーン、ピンクもある モース硬度：-", "a": "セーヴル磁器", "hint": "ヴァンクリーフ", "note": ""}, {"id": "qfc4ef1b95a", "cat": "ジュエリー", "sub": "ヴァンクリーフ／素材", "k": "desc2name", "q": "【ヴァンクリーフ】次の特徴にあてはまる素材は？\n\n主成分であるラズライトの存在により、深い青色をしたものが大多数を占める、さまざまな成分を含む不透明のオーナメンタルストーン その名はラテン語のlapis（石）とアラビア語のazul（ブルー）に由来する。ヴァン クリーフでは純度が高く色の鮮やかさが強く、黄鉄鉱による斑点が美しいものを採用している モース硬度：5～5.5", "a": "ラピスラズリ", "hint": "ヴァンクリーフ", "note": ""}, {"id": "qd04f60545e", "cat": "ジュエリー", "sub": "ヴァンクリーフ／素材", "k": "desc2name", "q": "【ヴァンクリーフ】次の特徴にあてはまる素材は？\n\n美しい青色が特徴で、石英（クォーツ）の微細な結晶が集まってできた鉱物 “成功”や“芸術性”の石言葉を持ち、秘めた才能を開花させると言われるパワーストーンとされている 経年変化で石の不透明度がわずかに変化していく特徴がある モース硬度：6.5～7", "a": "ブルーアゲート", "hint": "ヴァンクリーフ", "note": ""}, {"id": "q2c53d778ac", "cat": "ジュエリー", "sub": "ヴァンクリーフ／素材", "k": "desc2name", "q": "【ヴァンクリーフ】次の特徴にあてはまる素材は？\n\n青みがかった黒や褐色が特徴で、地表の地殻変動によって細かく砕けたものが石英（クォーツ）によって再び固まってできた鉱物を指す ピーターサイトという名前は、発見者であるシド・ピーターズ氏の名前から付けられた。また表面のマーブル模様が嵐のように見えるため「テンペストストーン」と呼ばれることもある 比較的硬度が高く、メンテナンスが簡単 モース硬度：6.5～7", "a": "ピーターサイト", "hint": "ヴァンクリーフ", "note": ""}, {"id": "q084e619ab2", "cat": "ジュエリー", "sub": "ヴァンクリーフ／アルハンブラ", "k": "desc2name", "q": "【ヴァ ークシャドウ）\nリック・オウエンスのディフュージョンライン（セカンドライン）\nメインラインに比べて価格が抑えられており、カジュアル寄りのデザインが多いのが特徴です\nただし、一般的なブランドと比較すると依然として高価格帯の位置付けとなります\n● ■Rick Owens Lilies（リック・オウエンス・リリーズ）\nレディース向けライン\n無駄な要素を削ぎ落としたミニマルで洗練されたデザインが特徴です\n● ■Drops（ドロップス）\nジュエリーライン\n「涙の粒」をモチーフとしたデザインが特徴で、ブランドの世界観をアクセサリーとして表現したラインです\n■ デザインの特徴\nリック・オウエンスのデザインは、ラグジュアリーと反骨精神（パンク的思想）の融合が大きな特徴です\n代表的な特徴として：\nハードな素材と流れるようなドレープ\n大胆で前衛的なカッティング\n生地を重ね、ねじり、寄せて作る曲線\nミニマルかつダークトーン中心のカラー\n特に、Madame Grès（マダム・グレ）、Madeleine Vionnet（マドレーヌ・ヴィオネ）といったデザイナーへの敬意が強く、ドレープ技術や立体裁断にはその影響が色濃く見られます\nまた、鮮やかなカラーはほとんど使用せず、\nダストカラー（くすんだ灰色系カラー）\nブラック\nグレー\nアースカラー\nなどを中心とした色使いも特徴の一つです\nこのカラーリングは、パンクカルチャーの若者が軍物古着を染色したような色味をイメージしているとも言われています"}, {"path": "アパレル > Rick Owens > 各デザイナーによる名作", "text": "① 基本のモデル名を覚えよう\n② 素材名を覚えよう\n🔹トミーTEE\n（画像）\n🔹カーゴベスト\n（画像）\n🔹アウターシャツ\n（画像）\n🔹ラリーシャツ\n（画像）\n🔹ハンフーディー\n（画像）\n🔹インターシャ\n（画像）\n🔹フライトボンバー\n（画像）\n🔹ジョガーボンバー\n（画像）\n🔹クロップドボンバー\n（画像）\n🔹バウハウスフライトジャケット\n（画像）\n🔹フライトダウンジャケット\n（画像）\n🔹ギンプジャケット\n（画像）\n🔹ボクサーショーツ\n（画像）\n🔹ポッズショーツ\n（画像）\n🔹カーゴポッズ\n（画像）\n🔹カーゴベラショーツ\n（画像）\n🔹ベラポッズ\n（画像）\n🔹バウハウスベラ\n（画像）\n🔹ドローストリングアステア\n（画像）\n🔹ワイドベラ\n（画像）\n🔹カーゴベラ\n（画像）\n🔹マストドンカーゴ\n（画像）\n🔹バウハウスカーゴ\n（画像）\n🔹クリーチカーゴ\n（画像）\nダークシャドウのみ\n🔹パニエ\n（画像）\n🔹ボランバナナ\n（画像）\n🔹ボランブーツカット\n（画像）\n🔹ゲスジーンズ\n（画像）\n🔹プッシャーパンツ\n（画像）\nダークシャドウのみ\n🔹サイドストライプスウェットパンツ\n（画像）\n🔹ステファンカーゴ\n（画像）\n🔹メンフィス\n（画像）"}, {"path": "アパレル > Rick Owens > 定番シューズ", "text": "① スニーカーの形を覚えよう\n② ソールの名前を覚えよう\n🔹GEO BASKET（ジオバスケット）\n（画像）\n🔹GEO DUNK（ジオダンク）\n（画像）\n🔹GEO THRASHER（ジオスラッシャー）\n（画像）\n🔹CARGO BASKET（カーゴバスケット）\n（画像）\n🔹GETH RUNNER（ゲスランナー）\n（画像）\n🔹SNEAKS LOW（スニークス）/RAMONS LOW（ラモーンズ）\n\n（画像）\n🔹SNEAKS HIGH（スニークス）/RAMONS HIGH（ラモーンズ）\n（画像）\n🔹SOX SNEAKERS（ソックススニーカー）\n（画像）\n🔹VINTAGE SNEAKER LOW（ヴィンテージスニーカー）\n（画像）\n🔹VINTAGE SNEAKER HIGH（ヴィンテージスニーカー）\n（画像）\n🔹MEGA BUMPER LOW SNEAKS（メガバンパーロー）\n（画像）\n🔹MEGA BUMPER HIGH SNEAKS（メガバンパー）\n（画像）\n🔹DOUBLE BUMPER SNEAKS LOW（ダブルバンパー）\n（画像）\nダークシャドウ\n🔹DOUBLE BUMPER SNEAKS HIGH（ダブルバンパー）\n（画像）\nダークシャドウ\n🔹ABSTRACT SNEAKS LOW（アブストラクト）\n（画像）\nダークシャドウ\n🔹ABSTRACT SNEAKS HIGH（アブストラクト）\n（画像）\nダークシャドウ\n🔹ISLAND DUNK（アイランドダンク）\n（画像）\n🔹BEATLE BOGUN（ビートルボーガン）\n（画像）\n🔹BEATLE BOZO TRACTOR（ビートルボゾトラクター）\n（画像）\n🔹BEATLE MEGA TRACTOR（ビートルメガトラクター）\n（画像）\n🔹BEATLE TURBO CYCLOPS（ビートルターボサイクロプス）\n（画像）\n🔹GRILLED WEDGE BEATLE（グリルドウェッジビートル）\n（画像）\n🔹KISS BOOTS（キスブーツ）\n（画像）\n🔹RUNNER（ランナー）\n（画像）\n×アディダス\n🔹MASTODON PRO（マストドンプロ）\n（画像）\n×アディダス\n🔹1460 BEX DS RO（ベックス ディーエス）\n（画像）\n×ドクターマーチン\n🔹1460 Quad Sole Megalace Boot Black（メガレースブーツ）\n（画像）\n×ドクターマーチン"}, {"path": "アパレル > Rick Owens > タグ豆知識", "text": "（画像）"}, {"path": "アパレル > VETEMENTS > 歴史", "text": "・■ ブランド誕生\nVETEMENTS（ヴェトモン）は、2014年にデザイナーのデムナ・ヴァザリア（Demna Gvasalia）と、弟のグラム・ヴァザリア（Guram Gvasalia）によって設立されたブランド。\nブランド名の「VETEMENTS」はフランス語で「服」を意味し、ストリートを背景にした過剰さ（オーバーサイズ、誇張されたシルエット）や、大胆なグラフィック、パンクや皮肉を効かせたデザインを特徴としている。\n・■ ブランドの特徴と評価\n極端なオーバーサイズシルエット\nロゴやメッセージ性の強いグラフィック\n既存のファッションルールへのアンチテーゼ\nこれらの要素によって、ラグジュアリーとストリートの境界を曖昧にする存在として注目を集めた。\n同時期に活躍していたヴァージル・アブローらと並び、ラグジュアリーストリートの潮流を象徴するブランドの一つとなる。\n・■ コラボレーション・取り組み\nReebok（リーボック）\nChampion（チャンピオン）\nDHL など\nファッションブランドに限らず、あえて異業種・日常的な企業とコラボレーションを行う姿勢も話題となった。\n・■ デザイナー：デムナ・ヴァザリアについて\n・◯ 生い立ち・背景\nジョージア（旧グルジア）出身\n幼少期に内戦を経験\n難民として多国籍な環境で生活\n多様性や違和感、アウトサイダー的視点は、後のデザイン思想に大きな影響を与えている。\nデムナ自身も、\n「文化の過渡期のような感覚の中で育った」\nと語っており、\nその経験が既存の価値観を疑うデザインアプローチにつながっている。\n・■ デザイン思想\n服を「装飾」ではなく「日常のリアル」から捉える\nオーバーサイズは、幼少期に大人の服を着ていた体験が原点\nサイズやバランスの違和感を“デザイン”として昇華\n結果として、VETEMENTSはオーバーサイズブームの象徴的存在となった。\n・■ キャリアの歩み（デムナ）\n2006年\nアントワープ王立芸術アカデミー ファッション科 卒業\n2009年\nマルタン・マルジェラ（現メゾン マルジェラ）にてウィメンズコレクションのデザインを担当\n2013年\nルイ・ヴィトン メンズのシニア・デザイナーを務める\n2014年\nVETEMENTS 設立（デムナ：デザイン、グラム：CEO）\n2015年\nVETEMENTSとして初のコレクションを発表\n2016年\nバレンシアガのアーティスティック・ディレクターに就任\n2019年\nデムナがVETEMENTSを離れ、バレンシアガに専念（グラム・ヴァザリアがVETEMENTSを継続）\n※26SS以降、デムナはGUCCIのデザイナーに就任\n・■ ブランドとしての位置づけ\nVETEMENTSは、\nラグジュアリー\nストリート\nアンチファッション\nこれらを横断しながら、「ファッションの常識を疑う存在」として2010年代のファッションシーンに大きな影響を与えたブランドである。"}, {"path": "アパレル > VETEMENTS > タグ豆知識", "text": "（画像）\n（画像）"}, {"path": "アパレル > Supreme > 歴史", "text": "● ■ 概要\nSupreme（シュプリーム） は、\n1994年にニューヨークで誕生した、スケートカルチャーをルーツに持つストリートブランド。\n現在ではストリートを代表する存在となり、ファッション・アート・音楽・ラグジュアリーを横断する象徴的ブランドとして世界的な地位を確立している。\n● ■ ブランドの誕生（1994年）\n創業者：James Jebbia（ジェームス・ジェビア）\n設立：1994年4月\n場所：ニューヨーク・ラファイエット通り\n元々セレクトショップ「Union NYC」のオーナーで、\nStussyのNY展開にも関わっていた人物。\n最初のSupremeは：\nスケーターが入りやすい店づくり\n店内中央でスケボーが試せる設計\n高級ブティックのような白くて広い内装\nという、当時のスケートショップとは真逆のコンセプトでスタート。\n最初はセレクトショップだったが、\nオリジナルTシャツが爆発的に人気 → オリジナルブランドへ本格化。\n「自分が着たいと思うものしか作らない」という思想が、今もSupremeの根幹。\n● ■ ブランド名・ロゴの由来\nSupreme =「最高」「至高」という意味\n名前は「響きが良い」というかなり直感的な決め方\nロゴは：\nアーティスト バーバラ・クルーガー の作品が元ネタ\n赤地に白文字・Futuraフォント\n“反消費主義アートのパロディ” という皮肉の効いた背景を持つ\n● ■ 一気に有名になったきっかけ\n・● ステッカーゲリラ（1994年）\nカルバン・クラインの広告にSupremeのステッカーを勝手に貼る\nニューヨーク中に1万枚以上ばらまく\nNY Timesに取り上げられ、一気に知名度爆発\n以降も：\nルイ・ヴィトン風\nNCAA / NHL風\nなど、ギリギリのパロディ表現で常に話題を作り続ける。\n● ■ 日本での広がり\n最初は原宿のスケートショップ「STORMY」で取り扱い\nその後、日本法人が設立され本格展開\n日本で広がった理由：\nNIGO、SKATE THING、裏原宿カルチャーとの強い結びつき\n窪塚洋介が雑誌で着用 → 一気に若者に浸透\n→ 日本はSupremeの最重要市場のひとつ\n● ■ 販売スタイル（Supreme方式）\n新作は 毎週リリース\n日本：土曜 11:00\n欧米：木曜\n人気週は 事前抽選制\n「並ぶ」「買えない」「希少性」がブランド価値の一部\n※2025年現在はブーム落ち着き、以前ほどの争奪戦ではない。\n● ■ コラボとブランド戦略\n2017年：Louis Vuitton と公式コラボ（ストリート史に残る事件）\nそれ以前から：\nThe North Face\nNike\nComme des Garçons\netc…\nただし近年は：\nコラボより「レギュラーアイテム」の評価が高い\nシャツ：Brooks Brothers製\nコート：Loro Piana生地など\n→ 実は中身はかなり本格派でコスパが良い\n● ■ 企業としての転換点\n2020年：VF Corporation（VANS / The North Faceの親会社）に約2100億円で買収\n→ ストリートブランドから、グローバルファッション企業の一員へ\n● ■ 店舗展開（抜粋・重要年表）\n1994：NY本店\n1998：代官山（日本1号店）\n2006：原宿\n2011：大阪 / ロンドン\n2016：パリ\n2017：ブルックリン\n2021：ミラノ / ベルリン\n2023：ソウル\n2024：上海\n※ 新店舗オープン時は記念Tシャツが必ず発売される。"}, {"path": "アパレル > Supreme > タグ豆知識", "text": "■～2005SS\n（画像）\n■2005AW～2012AW\n（画像）\n■2013SS～2017AW\n（画像）\n■2018SS～2021SS\n（画像）\n■2021AW～現在\n（画像）"}, {"path": "アパレル > Louis Vuitton > 歴史", "text": "・■ 創業と原点（19世紀前半〜中盤）\n1821年2月2日、ルイ・ヴィトンはフランス東部フランシュ・コンテ地方、ジュラ山脈のアンシェ村に生まれました。製材所を営む家庭の三男として育ち、数々の困難を乗り越えながら荷造り用木箱製造職人となります。その技術と誠実な仕事ぶりが評価され、やがてナポレオン三世の妃ウジェニーの信頼を得て、彼女の荷造りを一任される存在となりました。\n1854年、ルイ・ヴィトンはパリのカプシーヌ通りに、世界初の旅行用トランク専門店を開設します。防水性に優れた「グリ・トリアン」キャンバスを用いたトランクは高く評価され、ブランドの歴史が本格的に動き出しました。\n・■ 革新のトランクと評価の拡大\n当時主流だった馬車旅行に代わり、船や鉄道による移動が増える未来を見据え、ルイ・ヴィトンは従来の「蓋が丸いトランク」ではなく、室内で積み重ねられる「平らなトランク」を考案します。\n軽量で丈夫、さらにトレーや仕切りを備えた使いやすい構造は、機能性と実用性を徹底的に追求したものでした。\nこうして誕生したトランクは上流階級を中心に評判を呼び、その名声はフランス国内にとどまらず海外へと広がっていきます。1885年には、海外初となるロンドン・オックスフォード通り店をオープンしました。\n・■ 偽造品対策とアイコン誕生\n1870年代以降、人気の高まりとともに偽造品が市場に出回るようになります。これに対抗するため、1888年に息子ジョルジュの考案により、市松模様の「ダミエ」を発表。これがダミエ・ラインの始まりです。\n1892年にはハンドバッグの販売を開始し、初の全製品カタログを出版。さらに偽造品対策として、「LV」のイニシャルに星や花を組み合わせたモノグラム・モチーフを開発・商標登録します。このモノグラムは現在に至るまで、ブランドを象徴する存在となっています。\nモノグラムは、当時ヨーロッパで流行していたジャポニズムの影響を受け、日本の家紋などから着想を得たとされています。初期のモノグラムは職人による手描きで施され、その徹底したものづくりが偽造品の抑制にもつながりました。\n・■ 世界展開と技術革新\n19世紀末から20世紀初頭にかけて、パリ・オートショーへの出展や、1900年パリ万国博覧会での評価を経て、ルイ・ヴィトンは国際的な評価を確立します。1901年以降はアメリカをはじめとする海外市場でも積極的に展開しました。\n自動車や飛行機の発展に合わせ、防水性を高めた車載用トランクなど、時代に即した製品を次々に開発。1914年には本店をパリ・シャンゼリゼ通りへ移転し、トラベル・グッズ専門の路面店をオープンします。\n1959年には、3代目ガストン・ヴィトンがPVC加工を施した現在のモノグラム・キャンバスを発表。これによりソフトバッグの製造が可能となり、「スピーディ」や「キーポル」といった名作が誕生しました。\n・■ 現代への進化\n1978年、日本初のルイ・ヴィトンストアが東京・大阪を皮切りに誕生。\n1987年にはモエ・ヘネシーとの合併によりLVMHが誕生し、世界最大級のラグジュアリーグループへと成長します。その後、ベルナール・アルノーのもとでグループはさらに拡大しました。\n1998年、マーク・ジェイコブスを迎えアパレル分野へ本格参入。\n2003年には村上隆とのコラボレーションにより「モノグラム・マルチカラー」や「チェリーブラッサム」などを発表し、ブランドは伝統と革新を融合させながら進化を続けています。\n・■ ルイ・ヴィトン デザイナー変遷\n1997年〜2013年｜マーク・ジェイコブス（WOMENS）\n2006年〜2011年｜ポール・エルバース（MENS）\n2011年〜2018年｜キム・ジョーンズ（MENS）\n2013年〜現在｜ニコラ・ジェスキエール（WOMENS）\n2019年〜2022年｜ヴァージル・アブロー（MENS）\n2024年〜現在｜ファレル・ウィリアムス（MENS）"}, {"path": "アパレル > Louis Vuitton > 定番バッグ", "text": "🔹クリストファー\n（画像）\nサイズ：PM、MM、GM\n初期型はすべてベルトでの開け閉めだが人気は高い\n🔹キーポル　バンドリエール\n（画像）\nサイズ：45、50、55、60\n🔹ネヴァーフル\n（画像）\nサイズ：BB、PM、MM、GM\n🔹オンザゴー\n（画像）\nサイズ：BB、PM、MM、GM\n🔹ソフトトランク\n（画像）\n19SSのヴァージルのデビューコレクションで発表された名作\nオレンジのチェーンが付く\nサイズはミニと２展開\n🔹ソフトトランク・バックパック\n（画像）\nサイズ：MM、PM\nこちらはジップ劣化で異臭を放つことがある\n🔹スピーディ\n（画像）\nサイズ：ナノ20、25、30、35、40\n24SSからP9（高級レザー）も発売\n🔹ショッパートート\n（画像）\nサイズ：MINI、MM\n🔹カプシーヌ\n（画像）\nサイズ：MINI、BB、MM\n🔹ダヌーブ\n（画像）\nシュプリームとのコラボで人気のバック\n左がPPM、右がPM\n🔹バムバッグ\n（画像）\nシュプリームとのコラボで人気のバック"}, {"path": "アパレル > Louis Vuitton > 柄・モチーフ", "text": "【モノグラム系】\n🔹モノグラム\n（画像）\n🔹リバース\n（画像）\n🔹イディール\n（画像）\n🔹スイート\n（画像）\n🔹マカサー\n（画像）\n🔹アンプラント\n（画像）\n🔹エキゾチック\n（画像）\n🔹マヒナ\n（画像）\n🔹アンテイア\n（画像）\n🔹エクリプス\n（画像）\n🔹エクリプスフラッシュ\n（画像）\n🔹モノグラム・ギャラクシー\n（画像）\n🔹モノグラム・ジャイアント\n（画像）\n🔹モノグラム・ジャングル\n（画像）\n🔹モノグラム・レガシー\n（画像）\n【モノグラムの廃盤ラインや限定コレクション】\n🔹アイラブモノグラム\n（画像）\n🔹ウォーターカラー\n（画像）\n🔹オナタ\n（画像）\n🔹グラセ\n（画像）\n🔹グラフィティ\n（画像）\n🔹グルーム\n（画像）\n🔹サテン\n（画像）\n🔹シマー\n（画像）\n🔹シャイン\n（画像）\n🔹ジョークス\n（画像）\n🔹ストーン\n（画像）\n🔹セレブレーティング\n（画像）\n🔹ダンテェル\n（画像）\n🔹チェリー\n（画像）\n🔹チェリーブロッサム\n（画像）\n🔹チャーム\n（画像）\n🔹デニム\n（画像）\n🔹テュイルリー"}, {"path": "アパレル > Louis Vuitton > タグ豆知識", "text": "（画像）\n※ジャパンタグが付いている場合は上記の品番ではない品番が記載されている\n（画像）\n※上記画像の品名の上の6桁の品番"}, {"path": "アパレル > Prada > 歴史", "text": "・① 創業と初期の成功（1913年〜）\nプラダはマリオ・プラダが弟マルティーノとともにミラノで創業しました。\n欧米を旅して集めた上質で珍しい革素材を用い、職人技で仕立てたトランクや旅行鞄は、ミラノの上流階級から高い評価を受けます。\n1913年、ミラノ中心部のガレリア・ヴィットリオ・エマヌエーレ2世に店舗をオープン。\nクロコダイル、パイソン、象革、セイウチ革などを使った豪華なトランクは評判を呼び、1919年にはイタリア王室御用達ブランドとなりました。\n・② 成長と戦争による停滞（1920〜1950年代）\nガレリア店の成功を皮切りに、プラダは革製トランクを中心に急成長。\nマリオは当時主流だった重いスーツケースに疑問を持ち、軽量で防水性のある素材を用いたバッグを開発し、ビジネスマンや富裕層から支持を得ます。\nしかし、第一次・第二次世界大戦を経て状況は一変。\n高級革製品や派手な旅行スタイルは時代にそぐわなくなり、\n・新店舗計画の中止\n・本店の爆撃被害\n・マンゾーニ通りの2号店閉店\nなど、ブランドは大きな打撃を受けます。\n1958年、創業者マリオ・プラダが死去。\nその後、娘たちが事業を継ぎ、上流階級から中産階級へターゲットを転換しますが、ブランドは次第に勢いを失い、1970年代には低迷期を迎えます。\n・③ ミウッチャ・プラダによる再生と革新（1970年代後半〜）\n1970年代後半、創業者の孫である ミウッチャ・プラダ が事業を引き継ぎ、プラダは大きく変貌します。\n1979年には、当時ラグジュアリーとは結びつかなかったナイロン素材のバッグを発表。\nトライアングルロゴ付きナイロンバッグは大ヒットとなり、「知的で反骨的なラグジュアリー」というプラダ独自の立ち位置を確立しました。\n1988年にはレディースコレクションを発表し、世界的なプラダブームを巻き起こします。\n・④ ファッション×カルチャーの確立\nミウッチャはファッションをカルチャーの中心に据え、1995年にはプラダ財団を設立（1993年にその前身となるプラダ・ミラノ・アルテを立ち上げ）。\n現代アート支援、展覧会、映画への衣装提供など、プラダは単なるファッションブランドを超えた存在となりました。\n・⑤ ラフ・シモンズ加入とリブランディング（2021年〜）\n2020年、パンデミックの影響でプラダは大きく売上を落とします。\nこれを機にブランドは再び大改革を実施。\n2021年SSよりラフ・シモンズが共同クリエイティブ・ディレクターに就任し、\nプラダのリブランディングが本格化しました。\n2021SS：グラフィックデザイナーのピーター・デポッター起用で話題化\n2021AW：MA-1やビッグシルエットなど、ラフ・シモンズ色の強いコレクションを発表\nこれにより、新規層・若年層の支持を大きく獲得します。\n・⑥ 高級ラグジュアリー路線への転換とV字回復\n同時に、価格帯の大幅な引き上げを実施。\nナイロン製品は**Re-Nylon（再生ナイロン）**へ切り替え、品質も向上しました。\nこの戦略により、「手の届く高級ブランド」から、 明確なハイラグジュアリーブランドへとイメージを転換。\n売上はV字回復を遂げます。\n・⑦ 現在のPRADAグループ\n近年では、MIU MIUもジェンダーレスやファッショニスタの支持を受け再評価され、プラダグループの中でも重要な売上比率を占めています。"}, {"path": "アパレル > Prada > 定番バッグ", "text": "🔹V135\n（画像）\n🔹V136\n（画像）\n🔹2VZ135\n（画像）\n🔹2VZ019\n（画像）\n🔹2VL033\n（画像）\n🔹2VH113\n（画像）\n🔹2VH069\n（画像）\n🔹2VZ092\n（画像）\n🔹2VY007\n（画像）\n🔹1BH190\n（画像）\n🔹2VH194\n（画像）"}, {"path": "アパレル > Prada > 定番シューズ", "text": "🔹ポーチ付きモノリスブーツ\n（画像）\n🔹ダービーモノリスシューズ\n（画像）\n🔹サイドゴアモノリスブーツ\n（画像）\n🔹モノリスローファー\n（画像）\n🔹モノリスサンダル\n（画像）\n🔹×ADIDAS　SUPER STAR\n（画像）\n🔹×ADIDAS　ポーチ付きスニーカー\n（画像）\n🔹アメリカズカップ\n（画像）"}, {"path": "アパレル > Prada > タグ豆知識", "text": "（画像）"}, {"path": "アパレル > CELINE > 歴史", "text": "・1945年\n女性実業家のセリーヌ・ヴィピアナが夫のリチャードと共に創業\n当初はなんと皮革の子供靴専門店\nパリの革職人の技術を生かしたもので、上流階級を中心に大人気\n・1959年\n婦人靴の展開をスタート\n子供たちの靴を買いに来た婦人たちの受注が多かったため\n婦人用のモカシン（インカ）が大人気\n・1965年\n香水の展開スタート\n・1966年\nハンドバッグの展開スタート\n・1967年\nレディースのコレクション展開スタート\nパリの上流階級の（BC、BG）間で大人気\n※高品質かつ上品で着回しが利くため\n・1987年\nフィナンシェール・アガッシュ社（現LVMHグループ）に買収され、傘下に入る\n時代の変化についてこられず、セリーヌ＝高齢者向けのブランドのレッテルが貼られる\n1996年にベルナール・アルノーがLVMHを買収\n※LVMHグループに参入することで快進撃が始まる\n● デザイナー変遷\n・1977年\nマイケル・コースがデザイナーへ\nそれまでセリーヌ・ヴィピアナがデザイナーだった\n マイケル・コースは現在でも人気のあるブランド（※今だとバッグがメイン）\n▶︎ アメリカ出身でパリのブランドのデザイナーになることは当時珍しい\n▶︎ セリーヌの復活に大貢献\n▶︎ターゲットを明確にし、機能性、実用性を高めキャリアウーマンからの支持を得た\n・2004年\nロベルト・メニケッティがデザイナーへ\n・2005年\nイヴァナ・オマジックがデザイナーへ\nともに大きな成果なし\n・2008年\nフィービー・ファイロがデザイナー就任\nフィービー就任をきっかけにさらなる飛躍\n・2019年\nエディ・スリマンがデザイナー就任（2025SSまで）\n※マニュアルはディオール編参照\n● フィービー・ファイロに関して\nフィービーがデザイナーになり、世界中の女性だけではなくメンズのファッショニスタ達も彼女のデザインの虜になっていた\nデザイナー退任時には「フィービーロス」という言葉が生まれるぐらいのムーブメントを巻き起こす\n・経歴\nロンドンで育ち、名門ロンドン芸術大学セントラル・セント・マーチンズに入学\nそこでステラ・マッカートニーと出会い、親しくなる\nのちにクロエでデザイナーがステラ・マッカートニー、アシスタントがフィービーというゴールデンコンビで活躍\n・クロエ時代\nステラの後任のデザイナーとしてクロエのデザイナーに就任\nパディントンなどの大人気バッグをデザイン\n・セリーヌ時代\n2008年からセリーヌのデザイナーへ\n「服がすべてを語る」という信念を持ち、自身が着用したい服を一切の妥協をせずにデザインする職人肌タイプのデザイナー\nあまり公の場に姿をあらわすこともない\n当時のセリーヌの服は仕立てもよく非常に着やすい\n・代表作\n💎ラゲージ\n（画像）\nサイズ：ナノ、ミニ、マイクロ、ファントム\nファントムは男性にも大人気\n💎クロンビーコート\n（画像）\nカラーが違うものや様々なタイプが発売されているがこちらもメンズ人気も非常に高い\n2013～14年は予約しても買えなかった\n💎バイカーライダースジャケット\n（画像）\nこちらもメンズ人気が高いアイテム\n発売当時は人気で購入できなかった\n💎シルクスカーフシャツ\n（画像）\n2011年のSSに登場したアイテム\n当時はそこまで人気もなかったがカニエウエストやトラヴィススコットの着用により人気急上昇\n現在では60～100万で取引される\n当時はアウトレットにも残っていた\n💎スケータースニーカー\n（画像）\nスリッポンタイプのスニーカーも非常に人気が高く\nこちらのLOVELIFEも当時即完売のシリーズ\nAF1型など多くのパターンが発売されている\n💎バイカラーニット\n（画像）\n12年当時まだ流行ではなかったオーバーサイズの先駆け\nニットのタイプはメンズの着用も多く人気が高い\nニットの質も非常に良い\n💎スラックス\n（画像）\nフィービーの名作といえば毎シーズン発売されるスラックス、ワイドの物からタイトなものまで多くのバリエーションがある\n人気ではあるがベルトループがないものが多いので男性だと着用できないものが多い"}, {"path": "アパレル > CELINE > 定番バッグ", "text": "🔹バーティカルカバ\n（画像）\n🔹ロミー\n（画像）\n🔹ブザス\n（画像）\n🔹クロスボディ\n（画像）\n🔹ハリー\n（画像）\n🔹メッセンジャー\n（画像）\n🔹ミディアムカバ\n（画像）"}, {"path": "アパレル > CELINE > タグ豆知識", "text": "▼アパレルタグ\n（画像）\n内タグでシーズンはわからない\n▼デニムタグ\n（画像）\n▼デニムタイプ\nBF：ボーイフレンド\nRE：レギュラー\nFL：フレア\nST：ストレート\nSK：スキニー\nEL：エレファント"}, {"path": "アパレル > Dior > 歴史", "text": "● 歴代デザイナーまとめ\n・① クリスチャン・ディオール（1946–1957）\nブランド創業者\n1947年「ニュー・ルック」発表\n戦後モードを再定義\n強調されたウエスト／ボリュームスカート\nフェミニンなシルエットを確立\nディオール＝“エレガンスの象徴”を構築\nフランスモード復権の立役者\n・② イヴ・サンローラン（1957–1960）\n21歳で後継者に\n1958年「トラペーズライン」発表\n若々しい解釈で成功\n徴兵により退任\n・③ マルク・ボアン（1960–1989）\n約30年在籍\n「スリムルック」発表\nエレガントで保守的なスタイル\nブランドを安定成長させる\n・④ ジョン・ガリアーノ（1996–2011）\n演劇的・ドラマティックなデザイン\nクチュールの芸術性を最大化\nディオールを再び“話題の中心”へ\n■ メンズライン（Dior Homme）\nここがRINKAN的に最重要。\n・⑤ エディ・スリマン（2001–2007）\n最重要期\n特徴：\n極細シルエット\nブラック基調\nロックカルチャー融合\n世界のメンズシルエットを変えた存在\n代表：\nスキニースーツ\nデニム\nレザー\nメンズモードの革命\n・⑥ クリス・ヴァン・アッシュ（2007–2018）\nエレガント回帰\nクラシック×モード\nカルチャー性はやや弱まるが、完成度は高い\n・⑦ キム・ジョーンズ（2018–2025）\nラグジュアリー×ストリート融合\n代表コラボ：\nKAWS\nShawn Stussy\nTravis Scott\n若年層へ強烈に浸透\nコラボ戦略中心\n・⑧ ジョナサン・アンダーソン（2026–）\nロエベ成功後に就任\nアート性・構築性強化が予想"}, {"path": "アパレル > Dior > タグ豆知識", "text": "エディ期（〜07AW）のデニムパンツはフロント部分がフックだったがクリス（08SS〜）にデザイナーが変わった後は、フロントがボタンに変更された\nしかし、フロントのボタンが採用されていたのは09SSまでで、09AWからは再びフロントはフックの形式に戻った\n10AWから、内タグの仕様が変更になった\n旧タグは形が正方形に近く、国内タグの色は白だが、現行のタグは画像にもあるように、縦長でシルバーのタグになっている\n（画像）\nタグの1番最初の数字が年を表し、次に来るアルファベットが季節を表す\nEがSS（春夏）　HがAW（秋冬）\n2001AW〜2010AWまではこれで解読ができる\n2011SS以降はタグの仕様が異なり品番も解読ができなくなっているが、品番で検索すれば出てくるものもある\n国内代理店を通していない並行輸入商品などには品番が付いていない場合もある\nシューズには内側に「8E」のように内側に刻印されている。\n（例）\n7H310530589　→　2007年秋冬\n0E3351230192　→　2010年春夏"}, {"path": "アパレル > Maison Margiela > 歴史", "text": "■ デザイナー\n● Martin Margiela（マルタン・マルジェラ）\n1957年 ベルギー生まれ\n祖母がドレスメーカーで、幼少期から服に興味を持つ\nアントワープ王立美術アカデミー卒業\nJean Paul Gaultier（ゴルチエ）のもとで約3年修行\n1988年 ブランド設立\n※日本人デザイナー川久保玲・山本耀司の「黒の衝撃」の影響を強く受けている\n■ ブランド年表\n1988年\nMaison Martin Margiela 設立\n1989年\nパリコレデビュー\n→ オーバーサイズ・再構築で話題に\n2002年\nOTB（Diesel）傘下へ\n→ 商業化が進む転換点\n2009年\nマルタン・マルジェラ引退\n2009〜2014年\nデザインチーム体制\n2014年\nジョンガリアーノ 就任\n→ ブランド名がMaison Margiela に変更\n2026年〜\nグレンマーティンス 就任\n■ ブランド思想\nマルジェラ最大の特徴は\n「匿名性（Anonymity）」\n特徴：\nデザイナーが表に出ない\nブランド名を強調しない\nモデルの顔を隠す演出\n主語は「私」ではなく「私たち」\nつまり：\nブランドより作品が主役\nという思想。\n■ カレンダータグ\nマルジェラの象徴。\n● 4点ステッチ\nタグは\n4点の白い糸\nで縫われている。\n本来：\n外して着る前提\nで作られた。\n理由：\n→ ブランド主張をしないため。\n※古参ファンほどタグを外す文化がある。\n● 数字の意味\n（画像）"}, {"path": "アパレル > Maison Margiela > 定番バッグ", "text": "①モデル名を覚えてください\n※基本的にモデル名は一緒でバッグの形の種類が多いです\n②サイズは基本的にスモール、ミディアム、ラージ\n🔹グラムスラム\n（画像）\n現在のマルジェラで最も人気のあるモデル\n枕のようなデザインが男女ともに受け、大人気\n🔹5AC\n（画像）\n大きなバッグの中に小さなバッグがレイヤードされたデザインのバッグ\nこちらも種類豊富で大きいサイズはメンズに人気である\n🔹ジャパニーズ\n（画像）\nMM6で展開のバッグ\nレディースの幅広い層から人気\nMM6の為値段も抑えめで素材も多く存在する"}, {"path": "アパレル > Maison Margiela > 定番シューズ", "text": "🔹TABIブーツ\n（画像）\n言わずと知れたマルジェラといえばこちらのシューズ\n1989年SSのコレクションから発売されって現在でも人気のブーツ\nペンキ加工の物やフラットソールの物もあり\n🔹ジャーマントレーナー\n（画像）\nシンプルなデザインが人気でこちらも現在も人気のシューズ\n🔹×コンバース ペンキ加工スニーカー\n（画像）\nコンバースのチャックテーラーにペンキを塗ったアイテム\n履いていくうちにペンキがはがれていき、コンバースのもともとのカラーが出てきてそれが味になる\n🔹フューチャーハイ\n（画像）\nカニエウエストがライブで着用したことにより話題になり2014年頃に１度ブームを巻き起こし\n2025年に再販されサイド注目が集まり相場も向上している\n🔹フュージョン\n（画像）\nASAP BARIや2018年前後にファッショニスタとされていた人物が多く着用しており人気になったスニーカー"}, {"path": "アパレル > Maison Margiela > タグ豆知識", "text": "（画像）\n（画像）\nどの年代のタグにも基本的にシーズンの法則は一緒なので覚えやすい"}, {"path": "アパレル > LOEWE > 歴史", "text": "● 1. 創業と王室御用達まで\n1846年｜スペイン・マドリード\n数人の皮革職人が工房を設立\nレザーケース・バッグ・財布などの革製品を制作\n1872年｜エンリケ・ロエベ・ロスバーグ加入\nドイツ人職人エンリケが技術力に感銘を受けパートナーに\n自身の名を冠し「LOEWE」としてブランド化\n高いクラフト技術が評価され、上流階級に広がる\n1905年｜スペイン王室御用達に認定\nアルフォンソ13世より称号授与\nロエベ＝“スペイン最高峰レザー”の地位を確立\n● 2. スペイン国内での拡大\n1892年：店舗併設ブティック開設（当時は革新的）\n1910年：バルセロナ出店\n1939年：グラン・ビアに旗艦店\n1949年：自社工場建設\nこの時期の特徴：\nバッグ以外にもトラベル用品、靴などへ拡大\nクロエ、ディオールなど海外ブランドの販売も展開\n建築・ショーウィンドウデザインにも力を入れ、ラグジュアリーブランドとしての世界観を構築\n● 3. ブランドアイコン誕生\n1970年｜アナグラムロゴ発表\n4つのLを組み合わせたロゴ\n職人技術を象徴するシンボル\n1975年｜Amazona（アマソナ）発表\nロエベを代表するバッグ\n構築的で上品、今も定番\n● 4. LVMH傘下へ\n1996年｜LVMHグループ入り\nこれが大きな転機。\nプレタポルテ強化\n世界展開加速\nデザイナー主導のブランド再構築へ\n● 5. 歴代デザイナー\n1998年：ナルシソ・ロドリゲス\n2007年：スチュアート・ヴィヴァース\n2013年：ジョナサン・アンダーソン就任\n■ ジョナサン・アンダーソン時代（現在のロエベ）\n● 経歴\n1984年 北アイルランド生まれ\nロンドンカレッジオブファッション卒\n自身のブランド「JW Anderson」設立\n2013年 ロエベCD就任\n2025年 ディオールCD就任予定\n● 彼が変えたこと\n・① クラフト × コンセプチュアルの融合\nロエベ本来のレザー技術を残しつつ、\n大胆でアート性の高いデザインへ昇華。\n・② アイコンバッグのヒット\nPuzzle Bag\nHammock\nGate\nなどを発表し、ブランドを再浮上させる。\n・③ SNS戦略・広告戦略\n若年層への浸透に成功。\n“伝統ブランド”から“ファッション感度の高いブランド”へ転換。"}, {"path": "アパレル > LOEWE > 各デザイナーによる名作", "text": "🔹フィッシャーマンデニム\n（画像）\n🔹ボーダーカットソー\n（画像）\n🔹アシンメトリーシャツ\n（画像）\n🔹アナグラムTシャツ\n（画像）\n（画像）\n🔹アナグラムスウェット\n（画像）\n🔹アナグラムニット\n（画像）\n🔹アナグラムデニムジャケット\n（画像）\n🔹アナグラムデニムパンツ\n（画像）\n🔹ドレープデニム\n（画像）\n🔹ドレープジャケット\n（画像）\n🔹レイダースシリーズ\n（画像）\n🔹バルーンカーゴパンツ\n（画像）\n🔹ピクセルパーカー\n（画像）\n🔹ピクセルTシャツ\n（画像）\n🔹ボアブーツ\n（画像）\n🔹×ジブリ　となりのトトロ\n（画像）\nその他シリーズも人気\n🔹×ジブリ　千と千尋の神隠し\n（画像）\n🔹×ジブリ　ハウルの動く城\n（画像）\n🔹バンダナパッチワークシリーズ\n（画像）\n🔹I TOLD YA Tシャツ\n（画像）\n🔹パテッドボンバージャケット\n（画像）"}, {"path": "アパレル > LOEWE > 定番バック", "text": "🔹アマソナ\n（画像）\n🔹パズル\n（画像）\n🔹パセオ\n（画像）\n🔹フラメンコ\n（画像）\n🔹バスケット\n（画像）\n🔹ハンモック\n（画像）"}, {"path": "アパレル > LOEWE > 柄、モチーフ", "text": "🔹アナグラム\n（画像）\n🔹パウラズ イビザ\n（画像）\nパウラズ イビザとコラボのロゴ"}, {"path": "アパレル > LOEWE > タグ豆知識", "text": "（画像）"}, {"path": "アパレル > BALENCIAGA > 各デザイナーによる名作 > デムナ", "text": "🔹スウィングパーカー\n（画像）\n（画像）\n16AW\nブルーの出回りが多いがグリーンが非常に少なくまだ10万円以上で取引される\n🔹スウィングデニム\n（画像）\n（画像）\n16AW\n通年発売されているが初期モデルはシルバーチェーンがついている\nまたステッチの色が若干違う\nG-dragon、登坂、ヴァージル着\n🔹ロゴベースボールキャップ\n（画像）\nファーストシーズンでは非常に生産数が少なく、販売しては完売の繰り返しで定価以上の金額で取引されていた\n🔹Cシェイプダウン\n（画像）\n（画像）\n17AW\n当時には珍しいクロップドのダウン\n逆に今着ていてもサイズ感がいいと感じる\n🔹Cシェイプダウン\n（画像）\n（画像）\n17AW\n当時には珍しいクロップドのダウン\n逆に今着ていてもサイズ感がいいと感じる\n🔹パテッドチェックジャケット\n（画像）\n17AW\nバレンシアガの代名詞ともいえる中綿入りのチェックシャツのファーストアイテム\nトラビススコットの着用により今でも同カラーは人気が高い\nTRAVIS SCOTT着用\n🔹HOMMEスウェット\n（画像）\n（画像）\n17AW\nブリーチの方が定期店限定であり黒は通常販売していたが当時は定価以上で取引されていた\nASAP ROCKY着用\n🔹Cシェイプマウンテンパーカー\n（画像）\n17AW\n16AWのスキージャケットよりもオーバーサイズ\nG-DRAGONの着用もあり非常に人気が高かったアイテム\nG-DRAGON着用\n🔹3WAYパンツ\n（画像）\n18SS\n2025年現在相場向上中\nコレクション着用の多かったこのシリーズ\n当時の販売数が少なかったこと、ファッショニスタたちが最近目をつけて相場が向上してきている\n🔹ポプリントラックジャケット\n（画像）\n18SS\nバレンシアガといえばこのジャケット\nレッドが当時はブティック限定で人気であった\nロゴが取れるという問題があったが近年のモデルは刺繍に変わっている\n🔹スピードハンターズ\n（画像）\n18AW\nデムナが架空のバンドを想像してデザインしたスピードハンターシリーズ\n左はbackstreetboysのパロディ\n🔹スピードハンターズ\n（画像）\n18AW\nデムナが架空のバンドを想像してデザインしたスピードハンターシリーズ\n左はbackstreetboysのパロディ\n🔹バイカーレザージャケット\n（画像）\n19AW\nコレクションでも話題を呼んだがスポーティな感じが流行っている中でのバイカージャケットということもあり非常に人気\n🔹ラムシュタイン\n（画像）\n21SS\nドイツのバンドラムシュタインとのコラボレーションアイテム\nラムシュタインがバレンシアガの為に作成したプレイリストがApple Musicで公開されていた\n200着限定\n🔹デストロイパーカー\n（画像）\n21SS\n現在でも人気の同モデル\nTシャツ、ロングスリーブのカットソーなども発売\n一見ダメージ加工もありコーディネートが難しい肝したがどの色味もレイヤードのおかげで着用しやすい\n🔹カーゴパンツ\n（画像）"}, {"path": "アパレル > VETEMENTS > 各デザイナーによる名作 > グラム", "text": "🔹ワールドツアー\n（画像）\n（画像）\n20AW\n架空のツアーをモチーフにしたパーカー\n初期カラーのブラック×イエローが人気\n🔹ダブルアナーキー\n（画像）\nパンクの代名詞アナーキーのデザインを落とし込んだシリーズ\nこちらも通年販売され人気が高い"}, {"path": "アパレル > VETEMENTS > 各デザイナーによる名作 > デムナ", "text": "🔹メタルロゴパーカー\n（画像）\n15AW\n発売前からカニエウェスト着用して話題になった\n当時国内数店舗のみで予約のみで販売され、当時から入手困難であった\nアデライデでも数着のみの取り扱い\n現在でも300,000円前後で取引されている\nオーバーサイズの火付け役といっても過言ではない\n🔹再構築デニム\n（画像）\n15AW\nもともとコレクション発表当初から人気のアイテムであったがこのタイミングでG-DRAGONなどの着用もあり人気に火が付いた\nマルジェラのアーティザナルのデニムにも似ているがこちらのデニムはクロップドぐらい短い\nデムナ自身もマルジェラに在籍していたことがある\nあまり知られていないが14年にはディッキーズの再構築なども発売している\n🔹再構築MA-1\n（画像）\n15AW\nコレクション発表当時から若干の変更があり発売され続けているMA-1\n当時には珍しいオーバーサイズ\n当時からFAKEが多数存在していた\n🔹レタリングパーカー\n（画像）\n（画像）\n16SS\n🔹タイタニックパーカー\n（画像）\n16SS\n映画タイタニックプリントが大胆にプリントされたパーカーであるが公式コラボではない\nTシャツタイプとスウェットタイプがありスウェットタイプが人気\n発売当時はそこまで人気がなかったが、シーズンが終わるにつれて人気が高くなり現在では22万前後で取引されている\n🔹ゴシックロゴカットソー\n（画像）\n16SS\nレギュラーフィットとオーバーサイズがありオーバーサイズが人気\n当時ではなかなかなかった攻めたカラーリングでファッショニスタたちからの支持があり人気\n現在でもオーバーサイズの方は探している人が多い\n🔹チャンピオンロゴパロディ\n（画像）\n16SS\nチャンピオンのロゴもパロディしたロゴ刺繍のスウェット\nジェリーロレンゾの着用もあり非常に人気が高い\n今でも10万前後で取引される\n🔹SNOOPDOG（スヌープドッグ）\n（画像）\n16AW\nプリントがフロント、バックのタイプの2種類が発売さ 🔹23AW\n（画像）\n（画像）\nカモBOX発売\n🔹24AW\n（画像）\n🔹25AW\n（画像）\n🔹Arabic  Box Logo Hooded Sweatshirt\n（画像）\n1997\nグレー、ブラック、ネイビーの3色展開\nCrewneckは存在しない\n恐らく、Arabic Tee と同時リリース\n最初期のパーカーは首回りのVステッチが特徴的\n2000年代前半～2017年までのパーカーと比べるとサイズ感がハーフサイズ程大きいのも特徴\nまた、初期モデルだからなのか生地がしっかりしている\n色褪せていないブラック、ネイビーを探すのは残念ながら困難\nグレーボディのものでも首回り、袖先回りが変色しているものが多いので気を付けよう\n🔹Box Logo Pullover　反転　×COMME des GARCONS SHIRTS\n（画像）\n2012SS\n初のコラボーレション\n発売当初から非常に人気の高いアイテム\n当時はまだDOVERの在庫をバックドアできていた\n🔹Box Logo Pullover Hoodie ×COMME des GARCONS SHIRTS\n（画像）\n2014SS　\nブラック、レッドの2色展開\nギャルソンとの2nd Box Logo パーカー\nBox Logo が反転しているのが特徴\n🔹Box Logo Hooded Sweatshirt ×COMME des GARCONS\n（画像）\n2017SS　\nブラック、ホワイトの2色展開\nギャルソンとの3rd Box Logo パーカー\n2015年にリークがあったが発売はなく、2017年に発売\n🔹Split Box Logo Hooded Sweatshirt ×COMME des GARCONS"}, {"path": "アパレル > Supreme > 各デザイナーによる名作 > 名作オリジナル", "text": "🔹Faux Fur Bomber Jacket（フェイクファーボンバージャケット）\n（画像）\n17SS\nシュプリームのオリジナルの中でも一番の名作\n各店舗では10数着しか販売がなかったアイテムで人気が非常に高い\nコラボブランドなし、SS発売にも関わらず、1番高い時で50万円前後に\n🔹Flowers Pants（フラワーズパンツ）\n（画像）\n14AW\nイアンコナーやレオマンデラの着用により人気に火がついたパンツ\nレギュラーのパンツの中でも非常に高い人気を誇る\n🔹CANDY TEE（キャンディー）\n（画像）\n15AW\n不二家のパロディとして販売されたが商標権の問題で日本で発売されていない\n2015年の間はネットに出品していると不二家から注意喚起があったが現状はない\n🔹Alpaca wool coat（アルパカウールコート）\n（画像）\n21AW\nロロピアーナ製のアルパカコート\nキムタクの着用もあり人が高い\n質が非常に良い\n🔹Leopard Faux Fur Coat（レオパードフェイクファーコート）\n（画像）\n16SS\n🔹SNOW WHITE（スノーホワイト）\n（画像）\n白雪姫（SNOWWHITE系）に関しては発売ごとに人気が高い\n🔹AOI Quilted（アオイ産業）\n（画像）\n日本の刺繍ブランドのアオイ産業とのコラボレーション\nキャップなどは本来のアオイ産業の刺繍のクオリティはないが非常に人気\n🔹Dead Kennedys（デッドケネディーズ）\n（画像）\nアメリカのバンドのDead Kennedysとのコラボレーション\nワークブルゾンはキムタク、窪塚の着用もあり人気が高い\n🔹PCL（ピーシーエル）\n（画像）\nピーターザヴィルのPower,Corruption,Lies（PCL）権力の美学を総柄にプリントしたアイテム\nRAFSIMONSや有名ブランドで多数使用されるこちらの柄は非常に人気\n🔹スポンジボブ\n（画像）\nスポンジボブのデザイン\nキャラクターものは基本人気であるがスポンジボブは中でも人気\n🔹ベティ\n（画像）\nベティのデザイン\n黒の半袖シャツはキムタク着で人気が高い\n🔹COW PRINT CARDIGAN（カウプリントカーディガン）\n（画像）\nブラックは登坂着プラスして生産数が少なく非常に人気の1枚\n🔹Floral strip CARDIGAN　（フローラルプリントカーディガン）\n（画像）\n古着のようなカーディガンであるが様々なファッション層からの人気がある\n🔹CPFM （シーピーエフエムorカクタスプラントフリーマーケット）\n（画像）\nカクタスプラントフリーマーケットのシンシアルーによるデザインのアイテム\n右のスタジャンは人気で10万前後で売れる"}, {"path": "アパレル > Supreme > コラボブランド > NORTHFACE", "text": "・■The North Face（TNF）とは\n1968年にサンフランシスコで誕生した企業でアウトドアブランド\nNorth = 北　Face = 向き\n登山をする時に険しいとされる “山の北側” に由来している\n登山という過酷な環境下で人の体を保護するために研究・開発されてきた製品群は、街着のファッションとしても軽量性・保温性・耐久性などの機能性の高さに繋がり人気を集めている\n1stコラボは2007年～スタートしており、近年だと1シーズンで2回のリリースが定番になっていたが現在は発売がない\n・■加水分解\n加水分解しやすいモデルがあり、裏側がポロポロと白い粉が出てくる\n07SS SUMMIT\n08SS MOUNTAIN GUIDE\n10SS Expedition Pullover\n11SS Windbreaker Pullover\n12SS Venture Jacket\n13SS Reflective 3M Mountain Parka\n上記のモデルは要注意。特に13SS Reflective 3M Mountain Parkaは美品を探すのが困難・・・　\n・\n■タグ\n海外正規品と国内正規品で内タグが異なる。\n海外・・・海外タグ\n（画像）\n国内・・・ゴールドウィンタグ\n（画像）\n例：「このノース、ゴールドウィンタグですか？」などと聞かれます。\n海外タグは黒くて長い、ゴールドウィンタグは白くて日本語記載で覚えればOK\n1s tSUMMITが発売されたときには国内店舗は代官山、原宿の2店舗だったため、1stのゴールドウインモデルは激レア。おそらく50着以下だと思われる。\n・■サイズ感\n海外タグ、国内タグともにサイズ感は変わらない\nオリジナルのNORTHだとサイズ感が変わるモデルが複数存在するため、お客様でも勘違いしている人が一定数いるので教えてあげましょう\n・■型番/個体番号\nSUPREME × THE NORTH FACE　には全てシリアルナンバーが入っている\n（画像）\n17SS以降、（17AW～18SSだったかも）ホログラムが変更で型番の場所も変更された\n注意点として、\n①モデルによって英語、数字が異なる\n②同モデルでもカラーによって異なる\n例：14AWノースは数字の【1】から始まっているがFAKEはここの数字が7や9などと違う数字が使用されている。\n近年、相場の下落によってペーパーヌプシ以降のFAKEは少ないように感じるが、昔のノースコラボはめちゃくちゃFAKE多いので注意\n特に多いモデルが、\n07SS 1st GUIDE JAKET\n08SS 2nd Mountain Guide Jacket (昼/夜)\n10SS Expedition Pullover ※カモのみ\n14AW Bandana Mountain Parka\n15SS  Denim Dot Shot Jacket\n15AW Mountain Pullover\n15AW Nuptse Jacket\n17AW The North Face Mountain Baltoro Jacket\n17AW The North Face Mountain Parka\n🔹1st GUIDE JAKET (ガイド）\n（画像）\n2007SS\n🔹2nd Mountain Guide Jacket (昼/夜)\n（画像）\n2008SS\n🔹Denali Jacket (デナリ)\n（画像）\n08AW\n🔹 Expedition Jacket（エクスペディション)\n（画像）\n10SS\n🔹Waxed Cotton Parka（ワックスドコットン）\n（画像）\n10AW\n🔹Windbreaker Pullover（ウィンドブレーカー）\n（画像）\n11SS\n🔹Nuptse Down Jacket （ヌプシ）\n（画像）\n11AW\n🔹Venture Jacket（ベンチャー）\n（画像）\n12SS\n🔹Mountain Shell Jacket（マウンテンシェル）\n（画像）\n12AW\n🔹Reflective 3M Mountain Parka（リフレクティブ スリーエム）\n（画像）\n13SS\n🔹Fur Print Nuptse （ファープリントヌプシ）\n（画像）\n13AW\n🔹Expedition Coaches Jacket（エクスペディションコーチ）\n（画像 高騰している\nARIKAがアニメTeeの相場を上げたといっても過言ではない\n🔹MM6（エムエムシックス）\n（画像）\n2024SS\nインポートブランドMM6とのコラボレーション\nTシャツ、パーカーは常に人気\nTシャツのSサイズに関しては非常にレア（見たことない）\nファーコートなどは販売数が極めて少ない\n🔹MM6（エムエムシックス）\n（画像）\n2026SS\n2024年に続く2回目のコラボレーション\nジップアップパーカーは非常に人気が高い\nクラッシュのデニムシリーズなどは球数はそこまで多くなかったがあまり人気はなかった\n🔹×MM6 Box Logo Zip Up Hooded Sweatshirts\n（画像）\n2026SS\nMM6とのコラボレーションでBOXロゴパーカーで初のジップアップ\nネイビー、ブラック、ホワイトが発売されたがネイビーが一番人気\n🔹NUMBER（N)NIE（ナンバーナイン）\n（画像）\n2025\n2025AWのルックブックに登場して話題を呼んだコラボレーション\n宮下タカヒロ氏は自身はこのコラボレーションには参加していないことをSNSで発信するなど違った面でも話題を読んだ\nレッドのヴァーシティーはキムタクの着用もあり人気がある\n🔹JUNYA WATANABE（ジュンヤワタナベ）\n（画像）\n2021\nコムデギャルソンの流れで初めてJUNYAとのコラボ\n発売当初こそ人気であったが現在は人気はあまりない\n🔹VANS（ヴァンズ）\n（画像）\n毎シーズンコラボしている\n特に目立って人気のアイテムがあるわけではないがオールドのVANSのカラーリングしたり、懐かしのモデルの復刻をするのでVANSのファンからも人気\n🔹Martine ROSE（マーティンローズ）\n（画像）\n2023\nロンドンのマーティンローズとのコラボ\nパーカー、レザージャケット、キャップが人気がある\n日本での人気はあまりないが海外での人気が高い\nレザージャケットは登坂着で相場高い\n🔹THRASHER（スラッシャー）\n（画像）\nスケートブランドTHRASHERとのコラボ\nこちらも定期的にコラボレーションしているが人気はいまいち\nシュプリームの人気と連動して相場の変動がある\n🔹ANTI HERO（アンタイ　ヒーロー）\n（画像）\nスケートブランドANTI HEROとのコラボ\nこちらも定期的にコラボレーションしているが人気はいまいち\nシュプリームの人気と連動して相場の変動がある\n🔹Dr.MARTHINS（ドクターマーチン）\n（画像）\nイギリスのドクターマーチンとのコラボレーション\n基本的に毎年発売される\n近年だとシュプリームの後にドクターマーチンでの販売\n相場の傾向が面白く発売直後より１年～２年立つと非常に相場が上がる\n🔹Timberland（ティンバーランド）\n（画像）\nティンバーランドとのコラボは基本的に在庫数が非常に少なく、高額になることが多い\nSTUSSYでも同じ現象\nデザインも復刻等ではなくsupremeコラボオリジナルなので人気がある\n🔹LIMOWA（リモワ）\n（画像）\n高級キャリーケースブランドのリモワとのコラボレーション\n1stのSUPロゴのタイプが人気であるが、飛行機にも手持ちで持ち込めないサイズかつ、ロゴがすぐに剝げるため使用に関して注意がいる\n🔹Levis（リーバイス）\n（画像）\nキングオブデニムのリーバイスとのコラボレーション\n人気のあるヴィンテージのアイテムの復刻などではなく柄を駆使しているので人気が高い\n🔹TOM BROWN（トムブラウン）\n（画像）\nニューヨークのトムブラウンとのコラボレーション\nスケートブランドのシュプリームと一見合わないように見えるがトラッドに来てるアイテムも多いのでシュプリームとの相性も良い\nパッチにトムブラウンと記載があるのみ"}, {"path": "アパレル > Louis Vuitton > 各デザイナーによる名作 > キム・ジョーンズ", "text": "ポイント\n基本的にコラボ戦略中心の為、主要となるコラボを抑えておけば問題なし\n基本的にモノグラム（ロゴ）をうまく使いブランドの人気を高める傾向あり\n2025年現在は基本人気なし\n🔹マサイチェックシリーズ\n（画像）\n2012SS\nキムジョーンズのファーストシーズンの象徴的なアイテム\nマサイチェック→アフリカの伝統的なチェックであり、小説家のピータービアードからインスピレーションを受けたアイテムである\n発売当初から人気のアイテムでセットアップやスカーフなどアフリカのバティックの様に全身マサイチェックのスタイルなどが人気であった\n現在でも信者がいるアイテム\n🔹クリストファーネメス\n（画像）\n（画像）\n2015AW\nクリストファーネメスはキムジョーンズの中で永遠のヒーローであり、彼への尊敬の意をあらわしたコレクションである\nクリストファーネメスの代表的なモチーフであるロープ柄を多く使用した\nアマゾンやコート類が人気であったが現在はそこまで人気はない\nクリストファーネメスの人気がそこまでない為\n🔹フラグメント\n（画像）\n2016SS\n藤原ヒロシのフラグメントとコラボレーション\n当時非常に話題になり画像の３アイテムが非常に人気であった\nトートバッグに関しては藤原ヒロシがルイ・ヴィトンのバッグを買った際に保護用のカヴァーに自ら持ち手を取り付け「LOUIS VUITTON」というメゾンのロゴが入ったようなトートバッグに仕立たことを発端に生まれたもので藤原ヒロシファンからの人気が高い\nこの辺りからルイヴィトンの転売規制が強くなり、日本で購入している多国籍バイヤーは来店の度に購入した商品の着用をスタッフから依頼させることがあった\n🔹チャップマンブラザーズ\n（画像）\n（画像）\n2013AW、2017SS\nロンドン出身のディノスチャップマン、ジェイクチャップマンの兄弟のアーティスト\n戦争、政治、宗教、倫理観などのテーマを、英国流のユーモアで表象するアーティストである\n13AWと17SSでコラボしているがモノグラム総柄のアニマルシャツ以外は希少性のわりに人気は高くない\nコラボしていること抑えておけば問題ない\n🔹PUP UP限定モノグラム\n（画像）\n2018AW\nSUPREMEとのコラボの後で人気が非常に高い時期に発売されたので即完売したアイテム\nジャケット、パンツともに数が少なくRINKANでも非常に高いプレ値がついていた\n2018年4月20日から5月6日まで渋谷の旧GAPビルで開催されたイベント\n当時ほどではないが現在でも非常に人気が高く、こちらのアイテムをきっかけにモノグラム総柄のデニムの相場が向上した\nモノグラム中心のPOPであった\n🔹ピースアンドロゴシリーズ\n（画像）\n2018AW\nキムジョーンズのラストシーズンの象徴となるアイテム\nブルゾン、ニット、Tシャツと販売されたがすべて人気で特にブルゾンが当初人気であった\nこのころから3代目JSBの岩田さん（がんちゃん）の影響力が強くなる"}, {"path": "アパレル > Louis Vuitton > 各デザイナーによる名作 > ヴァージルアブロー", "text": "🔹ミリオネア\n（画像）\n（画像）\n（画像）\n19SS～\nもともとNIGOとファレルが世界1000個限定でデザインしたといわれるサングラスの復刻で当時から非常に話題になっていた\n2019年製のミリオネアは非常に割れやすく経年劣化で割れてしまうものもあるので注意\nカラーを変えて現在でも販売あり\n割れなどはLVでは対応してくれない（宮下実体験）\n噂ではアジアと海外向けでサイズが違う説も流れている\n1番下の画像は初期ミリオネア\n🔹LVトレーナー\n（画像）\n2019年～\nヴァージルファーストコレクションでの目玉商品\nSS19SSではブルーのハイカットのみポップアップでの販売なしで相場があったが夏場に世界的に再販して相場が落ちた\n現在でもカラーバリュエーションを増やして販売しているLVの人気商品\n🔹プリズム\n（画像）\n19SSのポップアップでキーポルは国内3つといわれていたが実際はめちゃくちゃ数が\nあるという伝説を作ったアイテム\nただその後再販がなかった為、近年では人気を取り戻してきている\n素材の経年劣化が著しくあるため2025年現在で状態のいいものはあまりなし\n🔹オズの魔法使い\n（画像）\n19SS\n映画オズの魔法使いにインスパイアを受けている商品\n特にヴァーシティージャケットはヴァージルの着用もありいまだに人気が高い\n基本的にヴィトンのヴァーシティージャケットは人気高い\nほかのアイテムに関しては落ち着いているが今後名作になる可能性が高い\n🔹モノグラムボーイフッドシリーズ\n（画像）\n（画像）\n19AW\n発売前からTravis　Scottの着用により話題になっていた\n発売当時はプレっていたが現在はそこまで高くはない\nおそらくシルエットが独特で着こなすことが困難である為\n特に偽物が多く出回っている\n🔹モノグラムアドミラルジャケット\n（画像）\n19AW\n🔹エンベリッシュカジュアルチェックシャツ\n（画像）\n19AW\nヴァージル本人が着用していてこちらは珍しく近年になって相場が ズ本人の着用により大人気"}, {"path": "アパレル > Prada > 各デザイナーによる名作 > 定番系", "text": "🔹UMB381\n（画像）\n🔹UMG165\n（画像）\n🔹UJL190\n（画像）\n🔹UJL26A\n（画像）"}, {"path": "アパレル > CELINE > 各デザイナーによる名作 > エディスリマン", "text": "🔹クラシックバイカー\n（画像）\n（画像）\n19SS\n🔹バイカラーダブルライダース\n（画像）\n19SS\n🔹×クリスチャンマークレー　モッズコート\n（画像）\n19SS\n🔹スタッズシングルライダース\n（画像）\n19SS\n🔹ルコ\n（画像）\n19SS\n🔹カマルグ\n（画像）\n19SS\n🔹ジャクノ\n（画像）\n19SS\n🔹テディジャケット\n（画像）\n（画像）\n19AW\n🔹アーガイルモヘアカーディガン\n（画像）\n19AW\n🔹テディカーディガン\n（画像）\n19AW\n🔹ダブルブレストオーバーコート\n（画像）\n19AW\n🔹マックコート\n（画像）\n19AW\n🔹フォールレザーブルゾン\n（画像）\n20SS\n🔹テディジャケット\n（画像）\n20SS\n🔹スーヴェニアテディブルゾン\n（画像）\n20SS\n🔹ベロアトラックジャケット\n（画像）\n20SS\n🔹シングルレザートラッカージャケット\n（画像）\n20SS\n🔹ディランフレア\n（画像）\n20SS\n🔹カフェレーサー\n（画像）\n20AW\n🔹スタッズデニムジャケット\n（画像）\n20AW\n🔹ブラッシュドモヘアカーディガン\n（画像）\n20AW\n🔹チェックレーヨン\n（画像）\n21SS\n🔹ルーズハワイアンシャツ\n（画像）\n21AW\n🔹ウールジャガードルーズカーディガン\n（画像）\n21AW\n🔹スターボーダーカーディガン\n（画像）"}, {"path": "アパレル > Dior > 各デザイナーによる名作 > エディスリマン（2001AW～2007AW)", "text": "ディオールの代表アイテム「デニムパンツ」\n世界最高峰の素材ジンバブエコットンを使用し、手間隙かけて製造される\nメインの生産地はデニムの聖地と名高い日本の岡山県。作業工程によってはいくつかの工場を振り分けたり、染色には通常のデニムの約2倍もの時間がかけられているとも言われ、織には近年では使われていないような旧式のシャトル織機を使っている\nまた、裾口のチェーンステッチには幻のミシンとも言われるアメリカの「ユニオンスペシャル」社製のミシンを使う事で独特の風合いを生み出している\nバックポケットにはディオールの特徴でもある「スカー」とベルトループにロゴ入りのメタルパーツが付けられている\n基本的に股下が約90㎝と長めに作られており、やや腰履きをし、あえて裾に弛ませて履くのがディオール流\nデニムだけでなく多くのアイテムに「スカー」が付けられているのがディオールの特徴\n（画像）\n🔹ラスターコーティングデニムパンツ\n（画像）\n03AW\n全体にシリコンコーティングを施したデニムパンツ\n04AW(ラスター期)に初めて発売され、何度も再販されている、人気モデル\n🔹デストロイコーティングデニム\n（画像）\n04SS\nディオールオムで最も有名と言っても過言ではないデニム\n全体にクラッシュ加工とコーティングが施されていて、裏地が付けられている\nベストジーニスト大賞にて木村拓哉が上下セトアップで着用、また最近（2014.12.20）G-DRAGONもこちらを着用し話題になっている\n🔹アイスブルーデニム\n（画像）\n04SS\n04SSに発売されたデストロイと並ぶ名作デニムパンツ\n色味からアイスブルーと呼ばれ、左から泥ワックスコーティング、プレーン、シリコンコーティングの3種類がある\n人気順だとシリコンコーティング→泥ワックス→プレーンの順番\n🔹赤錆ブーツカットデニム\n（画像）\n05AW\nウォッシュ部分に褐色の錆加工が施されており、ディオールオムのパンツとしては珍しくフレアシルエットになっている\n中古市場では丈詰めがされているものがほとんどで、丈詰めされていないものは希少\n🔹クラッシュリペアデニム\n（画像）\n06SS\nフロント全体にクラッシュリペアの加工が施されていて、色見もかなり薄め\n07SSコレクションでは丈をくるぶし付近まで切って着用していた\n🔹コンバインデニム\n（画像）\n06AW\n06AWの代表的なデニムパンツ\nウエストが他素材と切り替わっており、切替のタイプは、ブラックデニム×インディゴ、インディゴ×ブラックデニム、サテン×インディゴ、サテン×ブラックデニムの4種類が存在する\n🔹アンダーマイカー\n（画像）\n07SS\nアンダーマイカーの初期作\nハード目なウォッシュ加工と膝のダメージ加工が特徴\n07SSのアンダーマイカーはストレッチが入っておらず、生地はやや厚め。やや泥加工風の色見。08のものよりも希少性、人気ともに高い\n\"Under my car\"という名の通り、車の下に潜り込んで付着したペイントのデザインが人気を博し、伝説となった逸品\nエディ本人も着用\n🔹グラファイトコーティングデニム\n（画像）\n07SS\n路面店限定で発売されたグラファイトコーティングデニム\nブラック地のデニムパンツに部分的にゴールドコーティングが施されている\nストレッチは入っておらず生地はやや厚め\n🔹DOVAドバコーティングデニム\n（画像）\n07SS\n全体的にコーティングが施されており、ストレッチが入っている\nシルエットは細く、コーティングでストレッチが入っている物は、ディオールとしては珍しい\n🔹スタートパンツ\n（画像）\n07AW\n全体にパッチワークが施されているパンツ\n生地は厚手で、ストレッチは入っていない\n🔹ジェイク\n（画像）\n07AW\nディオールで最も人気の高いデニムパンツと言っても過言ではないJAKEの初期作\n非常に細みのシルエットで、膝のダメージ加工、絶妙なウォッシュ加工が特徴\n08AW、09AW、10AW、11AWで再販されている\n🔹シャープノーテーション\n（画像）\n07AW\n全体的に強い光沢のあるコーティングが施されている\nタイプ的にはDOVAと似ているが、シャープノーテーションにはストレッチが入っていない\nブラックとインディゴがある。\n🔹4ポケットレザージャケット\n（画像）\n05～07AW\nディオールオムを代表する定番的なレザージャケットで2005SS~2007AWシーズンまで定番で出されている\nシーズンによりポケットのデザインなどディテールが異なる\nフロントの4つのポケットが特徴\n特に2006SSの４ポケットレザーはエディ着用モデル\n🔹Tポケットレザージャケット\n（画像）"}, {"path": "アパレル > Dior > 各デザイナーによる名作 > クリスヴァンアッシュ（2008SS～2018AW）", "text": "🔹アンダーマイカー\n（画像）\n08SS\n07SSで発売されたアンダーマイカーの再販\n07SSのものより濃淡がはっきりしており、ストレッチが入っている。生地感は07SSのものより薄めでシルエットはスリム\n🔹ナイトフォール\n（画像）\n08AW\nボディーに上品なさらっとしたコットン混生地を使用したストレッチが効いたスキニーデニム\n全面に施されたコーティング・光沢感は非常に雰囲気ある一本\nコーティングでストレッチが入っている物は、ディオールとしては珍しい\n🔹カスタムジェイク\n（画像）\n08AW\n07AWで発売されたJAKEをクラッシュリペア加工したアイテム\nJAKEの中でも人気は非常に高い\n🔹バギーデニム\n（画像）\n08AW\nディオールとしては初めてのバギーシルエット\nコレクションのランウェイでも頻繁に登場したパンツ\nセルビッチ赤耳を使用している\n🔹バスキアジェイク\n（画像）\n09AW\n09AWに再販されたJAKEでもあまり個体数がなく手に入り難いモデル\nシルエット等はJAKEと変わらないが太もも付近のナスカの地上絵風なプリントが最大の特徴\n🔹ファジードリーム\n（画像）\n09AW\n加工等はJAKEに非常に似ている為、通称『ブラックジェイク』と呼ばれていおり、ストレッチも入っている。JAKEと同等と言えるくらい人気がある\nまた、ディオールオムではブラックウォッシュノデニムは数少ない\n🔹アンダーマイトラック\n（画像）\n10AW\n07SSに発売され、08SSに再販された『アンダーマイカー』の後継モデル\n色味や加工などは、どちらかと言えばJAKEに近く、ストレッチが入っている\n🔹ブラックリッパージェイク\n（画像）\n10AW\nJAKEとしては初登場のブラックウォッシュタイプ\nひざ部分のクラッシュリペアが特徴で通常のJAKEとは異なる\n🔹ブルーペイントデニム\n（画像）\n11SS\nウォッシュ加工の上にブルーのペンキペイントが施されている\nストレッチが入っておりスリムなシルエット\n通称『インクミー』デニムパンツ\n🔹スーパースレンダー\n（画像）\n定番\nディオールオムを代表する毎年定番で出されるストレッチパンツ\n素材はビスコース55％ コットン40％ ポリウレタン5％(シーズンでやや異なる)と非常にストレッチが効いており、とても履きやすく、どんなスタイルにも合わせられる\n🔹路面店限定デニムジャケット\n（画像）\n11SS\nクリス就任以来初となるGジャンで路面店限定となるアイテム\n2004SSのアイスブルーGジャンを彷彿とさせる\n🔹リングシャツ/ブルゾン\n（画像）\n12SS\n12SSシーズンを代表するアイテム\n首元のリング状のボタンが特徴\nロングジレとジャケットが代表的だが、ポロシャツのボタンなどにも使われている\n🔹ミリタリーモッズコート\n（画像）\n12AW\nこれまでのディオールのイメージにはなかったミリタリー色全開の12AWシーズンを象徴するアイテム\n🔹バード刺繍ブルゾン\n（画像）\n12AW\n12AWシーズンを象徴する大きなバード柄を全面に押し出したデザインのアイテム\n同様のデザインのニットセーターなども出されていた\n🔹ペイントシリーズ\n（画像）\n14SS\nランウェイにこそは使われていなかったがキャンペーン広告で多く使用されたデザイン\nニットやシャツ、シューズやストールなどが発売されていた\nこのシーズン辺りから再び人気に火が付いたように思える\n🔹鈴蘭柄ニット\n（画像）\n14AW\n14AWの代表アイテムで故クリスチャンディオールが愛していた鈴蘭をデザインに上手く落とし込んでいる\n特に大きな鈴蘭柄(左)はニットだけでなく大きな薔薇刺繍のジャケットやコートもランウェイで使用されていた\n肌触り、着心地も抜群\n二次市場でも高価で取引される"}, {"path": "アパレル > Dior > 各デザイナーによる名作 > キムジョーンズ（2019SS～2025AW）", "text": "🔹×KAWS　シルクシャツ\n（画像）\n19SS\nアーティストのKAWSとのコラボのシャツ\n非常に球数が少なく近年まで人気があった\n特に黒は非常に少なかった\n🔹×KAWS　ロゴアイテム\n（画像）\n19SS\nアーティストのKAWSとのコラボのシャツ\nロゴ人気時代の影響もありこちらも人気があった\n🔹×KAWS　デニムシリーズ\n（画像）\n19SS\nアーティストのKAWSとのコラボのシャツ\nBEE刺繍を施したデニムジャケット、カラフル刺繍、モノクロの2パターンあったが特に人気の差はなし\n🔹サドルバッグ\n（画像）\n定番\nDIORを代表するバッグ\n現在でもシーズンによりカラー、モチーフ違いで販売がある\n🔹ローラーコースターキャップ\n（画像）\n19SS\nALYXなどのデザイナーのマシューウィリアムスとの共同でのデザインのキャップ\nコレクション当初から話題になり、現在でもファッショニスタの間では人気\n🔹ブックトート\n（画像）\n定番\n2018年春夏コレクションでマリア・グラツィア・キウリが発表して以来非常に人気のアイテ\nサイズは「ミニ」「スモール」「ミディアム」「ラージ」\nどんなスタイルにも取り入れられることから大人気のアイテム\n現在が需要に対して流通が追いつて相場が落ち着いている\nキムジョーンズではないが19年からメンズでも使う人増えた印象\n🔹オブリークシャツ\n（画像）\n定番\n以前はトロッターと呼ばれていたこちらの柄をキムジョーンのリブランディングにより人気アイテムに\n毎シーズンカラー、シルエット違いで販売\n🔹オブリークショーツ\n（画像）\n定番\n以前はトロッターと呼ばれていたこちらの柄をキムジョーンのリブランディングにより人気アイテムに\n毎シーズンカラー、シルエット違いで販売\n🔹ショルダーオブリークニット\n（画像）\n定番\n以前はトロッターと呼ばれていたこちらの柄をキムジョーンのリブランディングにより人気アイテムに\n毎シーズンカラー、シルエット違いで販売\n🔹オブリーク総柄ニット\n（画像）\n定番\n以前はトロッターと呼ばれていたこちらの柄をキムジョーンのリブランディングにより人気アイテムに\n毎シーズンカラー、シルエット違いで販売\n🔹オブリークダウンジャケット\n（画像）\n定番\n以前はトロッターと呼ばれていたこちらの柄をキムジョーンのリブランディングにより人気アイテムに\n毎シーズンカラー、シルエット違いで販売\n🔹CDアイコンパーカー\n（画像）\n定番\nブランドネームのイニシャルをとって作られたパーカー\nこちらも毎シーズンカラー展開を変えて販売している\n🔹×空山　基　Tシャツ\n（画像）\n19AW\n日本人アーティストの空山基とのコラボレーション\nセクシーロボやダイナソーのデザインが人気\nコレクターが多い印象\n🔹×空山　基　シャツ\n（画像）\n19AW\n日本人アーティストの空山基とのコラボレーション\nセクシーロボやダイナソーのデザインが人気\nコレクターが多い印象\n🔹×ダニエルアーシャム ロゴアイテム\n（画像）\n20SS\n現代アーティストダニエルアーシャムとのコラボ\nこちらもDIOR×NIKE、ロゴ全盛期に発売された為ロゴアイテムの人気が非常に高い\n🔹×ショーンステューシー 総柄シルクシャツ\n（画像）\n20AW\nスケートブランドのSTUSSYの創業者のショーンステューシーとのコラボアイテム"}, {"path": "アパレル > Dior > 各デザイナーによる名作 > ジョナサンアンダーソン（2026SS～）", "text": "🔹ブーツカットジーンズ\n（画像）\n26SS\n日本では1月2日に発売されたが即完売、非常に入荷が少なかったとされる\nシルエットがよく、程よいフレアで履きやすい\nオンラインに36インチは残っている\n🔹Delft バミューダショートパンツ\n（画像）\n26SS\nムッシュ ディオールが1948年にデザインした「デルフト」ドレスに、ジョナサン・アンダーソンがオマージュ\nホワイトのコットンツイルを使用\n7mのファブリックを要する背面のプリーツと、フラップが付いたカーゴポケットが特徴\n定価90万\nオンライン完売"}, {"path": "アパレル > Dior > 定番シューズ > エディ", "text": "🔹ジャーマントレーナー\n（画像）\n定番\nディオールオムの定番スニーカーといえばジャーマントレーナー\nローカットが基本だがハイカットもある\nほぼ毎シーズン出されており、カラー、ラインの入り方など様々\n🔹スウェードレザーブーツ\n（画像）\n04AW\n2004AWコレクションルック着用のディオールオム名作ブーツ\nディオールオムでロングブーツは希少\nトゥ(爪先)が尖ったものもある。ブラックスウェードのタイプもある\n🔹ゴールドヒールブーツ\n（画像）\n05AW\nディオールオムのブーツといえばまず最初に思い浮かばれるほどブランドを代表するアイテムで、2005AWシーズンでも一際存在感を放っていた\nヒールの高さは6.5㎝でサイドジップの物とサイドゴア、ブラックの切替の物もある\nシルバーやパテントの物も人気が高い\n一見使いづらそうだが、意外と服を選ばず合わせやすい\nちなみにヒールの部分にBeeが彫られている\n後のシーズン(2007AWetc…)にもヒールブーツは出されており、そちらも人気が高い\n🔹コンバットブーツ\n（画像）\n07AW\n2007AWコレクションのほとんどのルックで使用されたこのシーズンを代表するブ\nーツ"}, {"path": "アパレル > Dior > 定番シューズ > クリス", "text": "🔹ベルトブーツ\n（画像）\n08AW\n2008AWクリスの2シーズン目、クリスの初期を代表するブーツ。本体はスムースレザー、ベルトストラップ部分はパテントレザーを使用している。ソールはラバーソール\n🔹ベルクロスニーカー\n（画像）\n09SS\n複数のベルクロストラップが組み合わさって構築された新たなディオールオムを象徴する次世代的なデザイン\nスニーカーを得意とするクリスならではのアイテム\n🔹バックジップレースアップスニーカー\n（画像）\n10SS\nクリスのディオールを代表するアイテム\nベルクロスニーカー同様、スニーカーを得意とするクリスならではのデザインで、クリスヴァンアッシュとしてもほぼ同じデザインのスニーカーを出している\nバックジップ仕様で着脱しやすい。元サッカー日本代表の中田英寿着用\n🔹赤紐ウイングチップ\n（画像）\n13SS\nネイビーとレッドのコントラストが目を引く13SSシーズンを象徴するアイテム\nランウェイの多くのルックで使用されていた\nレースだけでなくコバ部分のロックステッチもレッドで絶妙な指し色となっている\nこの辺りのシーズンからシューズに力を入れているように感じる\n🔹メタルダービーシューズ\n（画像）\n14SS\n14SSの隠れた名作で、非常に希少なアイテムソール部分、トゥ、レースの先にメタルパーツが付けられており、高級感のある一足\n実はソールのメタルパーツが取れやすく、リコールとなり回収されてしまったため、流通量が圧倒的に少ない\nそのデザイン性と希少価値から高価で取引される\n🔹マルチレースシューズ\n（画像）\n15SS\n15SSシーズンでは様々な柄のアイテムが出されていたがその中でも人気のデザインのひとつ\n14AWのドット柄同様人気アイテム"}, {"path": "アパレル > Dior > 定番シューズ > キムジョーンズ", "text": "🔹B23 スニーカー\n（画像）\n19SS\nコレクション当初から話題になり、初めこそ数量限定のHYPEスニーカーとなったが、生産の拡大に伴い人気減少\n素材の経年劣化が目立つ\n🔹×NIKE　AIR JORDAN1\n（画像）\n20SS\n言わずと知れたNIKEとのコラボレーション\nHIGHが8500足、LOWが4700足限定で世界での販売\n基本は抽選販売で各店舗VIPでもかなり上位出ないとバックドアができなかった\nただDIORでの購入履歴は抽選で重要だった可能性高い\n宮下の顧客DIORでの購入履歴が多い方は当選していた\n第2段が噂されたがデザイナーの交代もあり、白紙になった"}, {"path": "アパレル > Dior > 定番シューズ > ジョナサンアンダーソン", "text": "🔹ローディースニーカー\n（画像）\n26SS\nDIORでの26SS一押しのアイテム、こちらも非常に入荷数が少なく即完売した\n定価165,000→170,000(3/16更新）\n特にグリーン、ベージュは国内入荷がなかった説もある\nヴィンテージ ドライビングシューズを思わせるスタイルに、チューブ型ソールを採用した革新的なデザインを大胆に融合させました\n縫い目のないシームレスな構造により、優れた柔軟性と快適な履き心地を実現"}, {"path": "アパレル > Maison Margiela > 各デザイナーによる名作 > マルタンマルジェラ", "text": "🔹トロンプルイユ（Trompe L’oeil）\nスクリーンショット 2026-03-07 16.49.13.png\n1989SS\nだまし絵が転写されたアイテム\n近年でも展開がありますがスタートは1989SSで当時も物は非常に人気が高い\n🔹ドール（DOLL）\n（画像）\n1994AW\nその名の通り人形が着る服のシルエットをそのまま拡大したら、人間が着た時にどのようなシルエットが生まれるのか、もはや実験のような服作りで、人形服ならではのカットを活かしながら、そこで生まれる不均衡さを意図的に表現しているシリーズ\nニットなどが人気\n🔹フラットガーメント（Flat Garment）\n（画像）\n1989SS\n通常、三次元的に制作するはずの物をあえて二次元的に制作することで、着用していない時は完全にフラットになる点が特徴のアイテム\nなかなか見ることはないが覚えておこう\n🔹デュベットコート（Duvet Coat）\n（画像）\n1999AW\n布団でデザインされたアイテム\nアーカイブストアの代表アイテムといっても過言ではない\n非常に数がなくコレクターでも所有者は非常に少ない\n特にシーツでできたガーメントも付属してあるものはとても希少\n🔹オーバーサイズ（Oversized）\n（画像）\n2000SS～2001SS\nオーバーサイズのシルエットの走りのシーズンで90年代のモードファッション＝タイトのイメージを覆した、VETMENTSのデムナもこちらから強いインスピーレーションを受けていて時代を超えたシーズン\n【アーティザナル】（以下全て）\n1991AW～\n古着を加工して新たな命を吹き込むアーティザナルラインは、マルタンの服作りの思想がもっとも色濃く反映されたライン\nスタートしたのは1991AWシーズンで、アトリエ内で手作業で製作しているから、当然、球数も少なく価格も高い\nカレンダータグで言うと「0」もしくは「0、10」の数字が○で囲まれているライン（1999年以前は白タグのみ）\n🔹ミリタリーソックス\n（画像）\n1991AW\n🔹フェドラハット\n（画像）\n2004AW\n🔹ファーハット\n（画像）\n2005AW\n🔹レザーサンダル\n（画像）\n2006SS\n🔹ミリタリーバッグ\n（画像）\n2006SS\n🔹蝶ネクタイ\n（画像）\n2006AW\n🔹カマーバンド\n（画像）\n2006AW\n🔹ショッピングバッグ\n（画像）\n2007SS\n🔹ハイカットソニーカー\n（画像）\n2007SS\n🔹再構築Tシャツ\n（画像）\n🔹ミリタリーベスト\n（画像）\n🔹再構築デニム\n（画像）\n🔹レザーベルト\n（画像）\n🔹缶バッチベスト\n（画像）\n🔹パイロットキャップ\n（画像）\n🔹カフェレーサー\n（画像）\n02SS"}, {"path": "アパレル > Maison Margiela > 各デザイナーによる名作 > ジョンガリアーノ", "text": "🔹オーバーサイズニット\n（画像）\n19AW\n菅田将暉が紅白で着用したことにより大人気のアイテム\n着用前から人気のアイテムで菅田着で一気に人気に火が付いた\n通称菅田ニットとも呼ばれる\n🔹タグクルーネックニット\n（画像）\n20SS\nレディースアイテムの首元のタグをモチーフにしたニット\nサイズ感もよく、マルジェラブームの火付け的アイテム\n🔹千鳥格子ウールジャケット\n（画像）\n21AW\n生地の感じが非常によく人気のアイテム\nこのシーズンのマルジェラは仕立て、生地がよくアローズのスタッフやアイビー系の方もよく着用している\n🔹×ペンドルトン チェックシャツ\n（画像）\n23AW\n写真左のカラーがBTSのググの着用により非常に人気\n世界的にこちらのカラーの在庫が少なく相場も非常に高い\nシルエット、ペンドルトンのタグに種類があり、相場が全然違うので注意\n🔹×ジェントルモンスター サングラス\n（画像）\n23SS、24SS\n韓国のサングラスブランドのジェントルモンスターとのコラボレーション\n23SSの販売当時は国内の流通量が少なく定価の倍の値段で取引されていたがFAKEの数が多く二次流通の相場も下落した\n24SSに再度コラボレーションしているが前回ほどの爆発はなかった"}, {"path": "アパレル > Maison Margiela > 各デザイナーによる名作 > 定番", "text": "🔹ハの字ライダースジャケット\n（画像）\n1990年代後半から発売されているライダースジャケット\n初期からずっと人気のデザイン、海外では5ZIPレザーとも呼ばれている\n初期から2018年ごろまでは割と小さめ（シーズンで違いあり）\n最近の物はサイズが大きくなってきている\n🔹ノーカラージャケット\n（画像）\n近年のマルジェラで１番人気のアイテム\n素材違いが数多く存在していて、中でもウール100％のタイプが人気\nガリアーノ期から人気であったが実は初期の方から発売されている説もある\n🔹ノーカラーデニムジャケット\n（画像）\nデニムのカラーを切ったデザインのジャケット\nこちらも初期から人気であるが近年のデザインが特に人気が高い\nペンキ加工のアイテムもあり\n🔹エルボーパッチニット\n（画像）\n1999AWから発売されたアイテム\n初期の物の方がパッチが角ばっている\n現行でも発売されている定番\n🔹ドライバーズニット\n（画像）\nこちらも初期から現在まで人気のアイテム\nトラックドライバーの着ていたニットをベースデザインされたリブのジップアップニット\n様々な素材が発売されているがウールが人気\n🔹デストロイニット\n（画像）\n2000AWから不定期で販売されるシリーズ\n特に2020AWの対応が非常に人気が高い\n🔹カレンダーグラフィックパーカー\n（画像）\n2020年ごろ炉から定番で発売されているパーカー\n本来のマルジェラ好きからはあまり反応は良くないが、カレンダータグを見せつけたデザインで人気アイテムになっている\n🔹ロゴ刺繍プルオーバーパーカー\n（画像）\nこちらも2020年ごろから発売されている\nロゴが刺繍されていることから上期のパーカー同様にマルジェラ好きの人からは反応が良くないが、多くの新規の層を獲得したあいてむでもあり常に販売している\nこちらの売り方はたちが悪く正規店で販売しながらアウトレットでも販売していたりもする\n🔹エイズTシャツ\n（画像）\n1994年からエイズのチャリティーとしてリリースされている\n「THERE IS MORE ACTION TO BE DONE TO FIGHT AIDS THAN TO WEAR THIS T-SHIRT BUT IT’S A GOOD START（エイズと闘うためにすべき活動はもっとあるが、このTシャツを着ることは良い始まりだ）」という文字が刻まれている\n🔹ディストーテッド ロゴ Tシャツ\n（画像）\n2020年ごろから発売されている\nロゴが刺繍されていることから、マルジェラ好きの人からは反応が良くないが、多くの新規の層を獲得したあいてむでもあり常に販売している（特にTシャツは人気）\nこちらの売り方はたちが悪く正規店で販売しながらアウトレットでも販売していたりもする\n🔹カットアウトデニム\n（画像）\nレディースのアイテムであるが男女問わずに人気のカットアウトデニム\nバギーほど太くはないがゆとりのあるサイズ感で時代とマッチして人気が出たアイテム\n🔹マックイーンパンツ\n（画像）\n1999SSから発売\n現在廃盤\nベルトループがなく、M47のようなシルエット\n🔹アナトミックパンツ\n（画像）\n1999SSから発売\n現在廃盤\nベルトループあり、画像では分かりずらいがシルエットがOライン\n🔹再構築スタジャン\n（画像）\n再構築のスタジャンも非常に人気が高い\n特に14AWのこちらのスタジャンは高橋ラムダさんなど当時のファッショニスタたちの着用があり今でも人気がある"}, {"path": "アパレル > 特別枠 > 26SS・AW > ダークウェアスタイル", "text": "①Y2Kスタイルからのリバイバル\n特徴としては細身のIラインのシルエットでダークトーンのアイテム\n※エディのディオールオムのデニムやERD、ANNはこの流れから人気\n②リックやオマールなどのブランドでAラインも人気\n・《サンローランパリ》\n🔹ニージップレザーバイカースキニーデニムパンツ\n（画像）\n13AW～\n13AWより定番化されたサンローランを代表するパンツ\nシランウェイではオールレザーのタイプが出ており、こちらは使われてはいないが即日完売したアイテムでこちらも翌シーズンからパーマネントコレクションに追加され、定価も上げて販売された\n初販に比べて再販の方が膝下が細い\n🔹L01／L17　クラシックモーターサイクルジャケット\n（画像）\n13SSから定番として出されているライダースジャケット\nエディスリマンのディオールオム時代はシングルタイプのライダースが基本だったが、サンローランになってからはダブルが定番\nディオールオム退任以降活動の拠点をアメリカに移した影響もあってかディオールオム時代に比べてアームも太く本格的なライダースになっている\n新生サンローランにとって最も重要なアイテム\nL01(左)はまさにクラシックなライダース。15ＡＷではジップ部分や鋲部分もブラックのタイプが発売された。16ＡＷではカーフレザーのタイプが発売される\nL17(右)は13AWのフィナーレでエディ本人が着ていたもので、L01よりジップが多く、バックの裾部分にレザーのレースが付けられている\n初版の13AWのL17はカーフレザーを使用しており肉厚(以降はラムレザー)\n作りが今までのエディのレザーに比べるとやや大きく、サイズが小さいものの方が売れやすく、最小の42サイズは希少\n毎シーズンややサイズ感やレザーの質が異なる\nちなみに、初版の13ＳＳシーズンのものが質がいいと言われており、相場も上がる印象\n🔹テディブルゾン\n（画像）\n13AW～\n2025年に廃盤が決定してから人気が再熱している、以前は44が人気であったが近年\nのはやりもあり大き目のサイズも人気が高い\n今後さらに相場の向上が予想される\n🔹ブラッドラスター\n（画像）\n14SS\n2014SSに販売され、即完売したサンローランを代表する人気アイテム\nコレクションのスカジャンのバックし刺繍されたものと同じデザインでアーティストのルーク・トーマスとのコラボのよるものでサンローランを象徴するデザインともなった\nホワイト×ブラックのタイプもある\nあまりの人気で再販された\nTシャツということで他のアイテムよりも取り入れやすく値段も安いため、サンローラン初心者でも手が出しやすいアイテム\n🔹ワイアット　ハーネスストラップリングブーツ\n（画像）\n13AW～\n13AWより定番化されたサンローランを代表するブーツ\nメンズ初コレクションの13AWのほぼすべてのルックで使われ、立ち上げ即日完売したアイテム\nその影響もあってか翌シーズンから値段も上げて販売、定番化することになった\n初販はジップが斜めで、筒が細め。それ以降の再販モデルはでジップが縦寄りでムシ隠し付け、筒は太めで、リング部分はやや細く大きめに仕様が変更されている\nチェーンやスタッズが装飾されているものもある\n15AWはカフェ(ダークブラウン)カラーのものが販売されている\n16SSでは筒が細くなり、13AWとほぼ同じの筒幅に仕様が変更されている\n・《アンファンリッシュデプリメ》\n🔹クラシックロゴTシャツ\n（画像）\n定番\n定番商品で以前まではセレクトショップにも並んでいたが、こちらのアイテムだけあまりにも売れすぎるためERDの自社オンライン（もしかしたらブランドショップも？）\n🔹クラシックロゴパーカー\n（画像）\n定番\n定番商品で以前まではセレクトショップにも並んでいたが、こちらのアイテムだけあまりにも売れすぎるためERDの自社オンライン（もしかしたらブランドショップも？）\n🔹アンチマティスサーマルカットソー\n（画像）\n26SS\nBTSのRM着で女性の著名人も着用したため、男女ともに人気の高いアイテム\n定価も20万前後とERDの中では比較的に安く人気がある\n🔹オンリーサンデニム\n（画像）\n26SS\nこちらも てくれたアイテム\nフィットが数種類あるがレギュラーフィットが一番人気"}, {"path": "アパレル > 特別枠 > 26SS・AW > CHANEL", "text": "🔹ジーンズ\n（画像）\n26SS\nブラックピンクのJENNI着用で話題のデニムパンツ\nメンズサイズが非常に球数が少なく44以上は特に希少\nレディースサイズでも36、37あたりが非常に人気で定価42.5万に対して57万、メンズサイズはRINKANで80万前後で売れている\n🔹ジーンズ\n（画像）\n26AW\nこちらもブラックピンクのジェニーの着用により話題のアイテム\nブラックウォッシュも発売しているがこちらのインディゴの方が人気\nデニムパンツがシャネルでも売れているみたいで顧客優先案内になっている\n🔹マキシフラップ\n（画像）\n26SS\nマチューブレイジーのデザインになりショルダーのチェーンからレザーに変更したデザイン\nメンズも持ちやすくなったので非常に人気が高くVIPでも購入できなかったとのこと\n非常に球数が少なく、探している顧客も多い\n🔹プルオーバーカシミヤニット\n（画像）\n26AW\nASAP ROCKYやジェニーなどのアンバサダーの着用が多く人気\n定価は653,400円"}, {"path": "アパレル > 特別枠 > GUCCI > 歴史", "text": "● ■創業（1921年）\nグッチは、グッチオ・グッチがイタリア・フィレンツェで創業したラゲージブランド。\nロンドンの高級ホテルで働いた経験から、上流階級向けの製品づくりを志しました。\n● ■ブランド拡大とアイコン誕生\nGGモノグラム誕生\nブランド刻印文化の先駆け\n早い段階でブランドとして確立\n● ■戦争による転機\n第二次世界大戦でレザー不足に直面し、キャンバス素材へ転換\nこの時期にバンブーバッグ誕生\n● ■世界進出と名作\n海外展開を進め、ハリウッドスターにも愛されるブランドへ成長\nホースビットローファー（1953年）誕生\n● ■経営危機\n親族間の争いによりブランド価値が低下し、経営悪化\n● ■再建\nマウリツィオ・グッチ主導で経営改革を行い、トム・フォードの登場によりブランドは再生\n● ■デザイナー別時代\n・トム・フォード（1994年〜）\nセクシー・官能的・モダン\nセクシュアル・ミニマリズム\n低迷していたGUCCIを完全復活\n・フリーダ・ジャンニーニ（2006年〜）\nエレガント・洗練\nクラシックの再解釈\nGGやホースビットの現代化\nセレブ路線を強化\n・アレッサンドロ・ミケーレ（2015年〜）\nマキシマリズム（装飾過多）\nジェンダーレス\nレトロ×現代\n SNS時代に大ヒット\nただし後半は個性の強さが飽きられ人気低下\n・サバト・デ・サルノ（2023年〜）\nシンプル・洗練・フォーマル\nミケーレの反動\n評価はあったが売上は低迷\n早期退任\n・デムナ（2025年〜）\nバレンシアガ での実績\nストリート×ラグジュアリー\n 今後の再構築フェーズ"}, {"path": "アパレル > 特別枠 > GUCCI > 各デザイナーによる名作 > トムフォード", "text": "🔹花鳥風月春画スカジャン\n（画像）\n（画像）\n03SS\nトムフォード期の名作の代表格の1点\n全6種類あるといわれている\n日本の春画と西洋のスーベニアジャケットといった文化の融合を図った1着\n春画が卑猥であるデザインの方が人気が高い\n🔹花鳥風月プリントシリーズ\n（画像）\n（画像）\n03SS\n1点1点職人のハンドペイントでデザインされている\nそのため生産数が少なく非常にめずらしいアイテム\n🔹M-65　サファリジャケット\n（画像）\nトムフォードのグッチといえばサファリジャケット\nミリタリーアイテムをファッションに落とし込んだアイテムでトムフォードグッチの代表アイテム\n素材も多く存在している\n🔹バイカーレザージャケット\n（画像）\nこちらもトムフォードがグッチでファッションに引き上げたアイテムの一つ\nこちらも数シーズンで展開があり人気のアイテム\n🔹レザートラッカージャケット\n（画像）\nこちらもトムフォードがファッション委引き上げたといっても過言でもないアイテム\nトムフォード流のアメカジ要素の強いアイテムをモードブランドに落とし込んだアイテム"}, {"path": "アパレル > 特別枠 > GUCCI > 各デザイナーによる名作 > ミケーレ", "text": "🔹GGキャンバスキャップ\n（画像）\n定番\nGG柄のキャップはまさにミケーレ期の象徴ともいえるべきアイテム\nVETEMENTSのロゴブームもあいまってこちらのアイテムも非常に人気が出た\n🔹ニューヨークヤンキースワッペンキャップ\n（画像）\n18AW\nニューヨークヤンキースとのコラボ\nワッペンが付き定番のヤンキースキャップにグッチらしさも加わり非常に人気のあったデザイン\n🔹オールドロゴプリントTシャツ\n（画像）\n17SS\nブートのようなロゴを公式から発売するという荒業にでたミケーレ\nラッパー達がこぞって着用して話題になった\n17SSのファーストシーズンの際には在庫が非常に少なく完売状態であった\n🔹ココキャピタンロゴTシャツ\n（画像）\n17AW\nアーティストのココキャピタンとのコラボレーション\n上のロゴにメッセージが加えられたアイテム\n非常に偽物が多い\n🔹ワッペン装飾デニムパンツ\n（画像）\n（画像）\n定番\nミケーレといえばワッペンといわれるほどミケーレ期の特徴的アイテム\nワッペンのカスタムオーダー会も頻繁に行っていた\nスネークのワッペンパンツも発売当初は完売していた\n🔹ブリーチ加工デニムパンツ\n（画像）\n17SS\n発売当初爆発的な人気を誇ったこちらのアイテム\n色によって人気はさほど変わらない\nアジアでは大人気であったがヨーロッパではアウトレット行きのアイテム\n🔹フラワープリントネクタイシャツ\n（画像）\n17SS\nG-DRAGONの着用でいまだに人気のこのアイテム\nネクタイが欠損しているものもあるので要注意\n🔹テクニカルトラックセットアップ\n（画像）\n17SS～\nストリートファッションの流れからグッチもトラックジャケット、パンツを発売\nいまだに入荷すれば即売れする\nただファッション的に着こなすのは難しく基本的にはやんちゃ系の着用アイテムになっている\n🔹GGジャガードトラックジャケット、パンツ\n（画像）\n17SS～\nストリートファッションの流れからグッチもトラックジャケット、パンツを発売\nいまだに入荷すれば即売れする\nただファッション的に着こなすのは難しく基本的にはやんちゃ系の着用アイテムになっている\n🔹グッチゴーストスカジャン\n（画像）\n16AW\nアーティストのトラブル・アンドリューとのコラボレーション\nGG柄を液体の垂れたようなものでデザインしている\n現在も人気はあるが高くはうれない\n🔹ニューヨークヤンキースニット\n（画像）\n18AW\nニューヨークヤンキースとのコラボ\nアパレル類が非常に人気で中でもニットは人気\n🔹ミッキーコラボシリーズ\n（画像）\n20SS\nディズニーとのコラボ\nドナルドなども以前にコラボしたが1番人気はやはりミッキー\n特にTシャツは非常に人気であった\n小物やバッグも人気\n🔹ドラえもんコラボシリーズ\n（画像）\n21SS\nドラえもんとのコラボレーション以外にも金のドラえもんが非常に人気\nディズニー同様にバッグ類も人気であった\n🔹プリンスタウン\n（画像）\n17SS～\nグッチ定番のホースビットローファーをサンダル、ファーをつけたデザイン\n著名人の着用が多く人気\nワッペンがついているものが人気であったが徐々にシンプルなタイプが人気になった\n🔹×ノースフェイス GGキャンバスダウンジャケット\n（画像）\n21SS\nアウトドアブランドのノースフェイスとのコラボレーション\n様々なアイテムが発売されたがGG柄のダウンジャケットが１番人気\n緑は第２弾で発売されたがあまり人気はなく、ベージュの方が人気が高い"}, {"path": "アパレル > 特別枠 > GUCCI > 各デザイナーによる名作 > デムナ", "text": "🔹ホースビットノーカラーレザージャケット\n（画像）\n26SS\nグッチデムナの初めのコレクションルックブックでの人気アイテム\n定価は100万以上ですがメディアでの着用も多く、人気の１着\nホールビットを装飾しており、ホースビット人気を加速させたアイテム\n🔹ホースビットデニムパンツ\n（画像）\n26SS\n定価20万前後のポケットにホースビット装飾のデニムパンツ\nブラックも展開しておりRINKANでも定価近辺で販売される\nバレンシアガ後期のコレクションで見られる、バギーではないストレートタイプ\n🔹ウェブストライプバイカージャケット\n（画像）\n26SS\n定価：1,336,500円\nトムフォード期にも人気だったバイカーレザーにグッチカラーのストライプを施したレザージャケット\nこちらのコレクションは非常にトムフォードを意識してデザインされている\nわずかに使い込んだような効果を出すために加工したカーフレザーで仕立て、意図的に折り目を付けて着古したような風合いを演出している\n🔹クパチーノローファー\n（画像）\n（画像）\n26SS\n定価：147,400円\n贅沢に柔らかいレザーで仕立てられ、伸縮性のあるインサートを特徴とし、かかと部分を折りたたんで着用することも可能なローファー\nソールの張替必須アイテム\nデムナ自身もお気に入りのアイテム\n画像のように非常に長く少しワイドなパンツでも裾を拾えるようなデザインになっている\n実際に見るとサイズ以上に大きく見える\n🔹ジョバンニローファー\n（画像）\n26SS\n定価：152,900円\n贅沢に柔らかいレザーで仕立てられ、長めのポインテッドトゥが特徴\nサイドにあしらわれたインターロッキングG ディテールが、さりげないアクセントのローファー\nこちらもデムナお気に入りのアイテム"}, {"path": "売価マニュアル", "text": "売価インプットのポイントをまとめています。\n①12時頃に上がる新入荷のページを必ず毎日チェック\n（画像）\n②100イキに対しての売価の盛率を覚える\nメインブランド→5％\n基本、ネット在庫→12％\nネットで売価を見るときに100イキを考えてみると覚えやすいです！\n③ありあり共有ラインでの売価チェック\n新入荷ありあり自動作成ツールに税込みの売価が乗っているのでインスタ投稿しかり、各店舗のインスタのストーリーを見て売価をチェックする。\n④楽天で自分の仕入れを毎日追う\n(1)楽天の検索バーで『bb〇〇〇＃』で検索\n└〇〇〇は自身のバイヤー番号\n(2)設定を完全一致、売り切れを含むに設定\n(3)新入荷順にして自分の在庫を確認する\nポイントや注意点\n自分の仕入れを見ると100イキを覚えているので売価も覚えやすい\n楽天は自社ECと売価違うので注意\n初回99振り売価盛りなし、初回店舗振り10％盛り※50万以上は店頭でも盛りなし\n自身の仕入れが少ないスタッフに関しては自店舗の仕入れの多いスタッフを参照\n毎日しっかり見ることが重要です！必ず毎日見てください！\n・📈売価テスト高得点者が日々やっていること\n1. 毎日の「相場チェック」をルーティン化している\n自社EC、楽天の新入荷、ありあり共有LINEを毎日欠かさず確認する。\n自社だけでなく、他社の相場も見る。\n2. 「なぜ売れたのか？」の理由を言語化する\n「なぜこの売価で売れたのか」「なぜ定価以上でも需要があるのか」などを常に考える。意味や背景（トレンド・希少性・定価改定など）を理解して扱うことで、丸暗記ではない本質的な売価感覚が身につく。\n3. 分からないことを放置しない\n不明な定価などは放置せず、直営店舗で聞くなど（または電話）する。\n先輩に自分から積極的に質問し、疑問をその日のうちに解消している。\n4. 自分の欲しいものや担当業務から感覚を養っている\n「自分が買いたい物」を見つけると、自然と定価や相場を調べるようになる。\n店舗でのVMDやプライスキューブの配置などを担当することで、価格帯の把握が自然と身につく。"}, {"path": "ブランド・商品基礎情報 > ブランド名", "text": "【シルバー】\n🔹Chrome Hearts\nクロムハーツ\nシルバーアクセサリーがメインのブランド。芸能人多数着用。\n🔹goro's\nゴローズ\n日本のインディアンジュエリー+ブランド。定価での購入が困難。\n🔹LONE ONES\nロンワンズ\nメンズシルバーアクセサリーブランド、ベルのモチーフが特徴。\n🔹TADY&KING\nタディアンドキング\n日本のインディアンジュエリーブランド、デザインがゴローズと似ている\n🔹JustinDavis\nジャスティンデイビス\nロックかつエレガントで斬新なデザインのシルバーアクセサリーブランド。\n🔹Gabor\nガボール\n厚感のあるゴシックテイストのデザインのシルバーブランド。\n🔹Cody Sanderson\nコディサンダーソン\nスターモチーフが有名なインディアンジュエリーブランド。\n🔹Bill Wall Leather\nビルウォールレザー\n歴史の長いシルバーアクセサリーブランド、価格帯は高め。\n🔹HOORSENBUHS\nホーセンブース\nトライ・リンクというモチーフが特徴のジュエリーブランド。\n🔹LEONARD KAMHOUT\nレナードカムホート\nchromeHeartsの創立メンバーの一人のシルバーブランド。\n【ジュエリー】\n🔹Van Cleef & Arpels\nヴァンクリーフアンドアーペル\n高級ジュエリー、ブライダルジュエリーが人気のブランド、代表アイテムはヴィンテージアルハンブラ。 と発表し、現在は使われていない\n🔹リザード\n（画像）\nトカゲの革\nワニ革に比べて細かく繊細なウロコ模様が特徴\nウロコが細かいためキズが目立ちにくく、軽量でありながら耐久性もある。シャネルが2018年にエキゾチックレザーの使用を廃止すると発表し、現在は使われていない\n🔹ガルーシャ\n（画像）\nエイの革\n宝石のように美しく滑らかな仕上がりにしているのが特徴\n革の表面はビーズ状の細かな粒が並んでいてガラスのような光沢がある。この無数の粒は歯や骨と同じリン酸カルシウムの成分でできており非常に硬く強度があり、劣化しにくい\nシャネルが2018年にエキゾチックレザーの使用を廃止すると発表し、現在は使われていない\n🔹ファー（毛皮）\n（画像）\n元々生えていた動物の体毛\n希少性の高いウサギの毛皮“オリラグファー”が多い\nシャネルが2018年にエキゾチックレザーの使用を廃止すると発表し、現在は使われていない\n🔹ツイード\n（画像）\n短い羊毛などを紡いで作られており、厚く防寒性の高い毛織物\nジャケットやスーツ、ときにはバッグに用いられるファンシーツイードは、1912年にイギリスで創業された「リントン・ツイード社」のものでシャネルの代名詞となっている\nツイードは水に濡れると風合いを損なうため注意が必要\n🔹キャンバス\n（画像）\n綿や亜麻の糸を平織にした生地\nカラーバリエーションが豊富で軽くて丈夫\nもともとは船の帆として使われていたほど丈夫な生地で、織り目があらく耐水性の強い素材\n🔹デニム\n（画像）\n綾織りの綿素材で作られている生地\n厚手で頑丈であり、何度も使うことで表面の凹凸が大きくなる風合いの変化と色落ちを楽しめるのが特徴\n🔹ナイロン\n（画像）\n合成繊維で作られている生地\n耐久性と耐水性に優れた軽量素材になっていて、強度があり摩擦や引っ張りにも強いので激しい使用にも耐えることができるのが特徴\n🔹ベロア\n（画像）\nパイル織物の一種で、パイル糸をカットして毛羽立たせた生地\n独特の光沢感があり、柔らかい肌触りが特徴\n🔹ストロー\n（画像）\n麦わら、ラフィアなどで編まれた生地\nシャネルではラフィアが使われていることが多い\n軽くて通気性が良く丈夫であるのが特徴"}, {"path": "バッグ > CHANEL > シリアルナンバー", "text": "・■製造年\n《1985～2005年》※7桁\n《1985～2005年》※8桁\n・■シリアルシールに関する変化\n（画像）\n（画像）\n（画像）\n（画像）"}, {"path": "バッグ > CHANEL > デザイン・ライン一覧", "text": "・■デザイン一覧\n🔹シングルフラップ\n（画像）\nバッグの蓋が内蓋がなく、外蓋のみになっている\n🔹ダブルフラップ\n（画像）\nバッグの蓋（フラップ）が外蓋と内蓋で二重になっている\n🔹マドモアゼルロック\n（画像）\n長方形のターンロック金具で、「2.55」バッグに使われている\n🔹ココマーク（CC）ロック\n（画像）\nシャネルを象徴するココマークのロック金具で、多くのバッグに使われている\n🔹シークレットポケット\n（画像）\n内フラップ裏のジップ付きポケットで、ラブレターポケットとも言われている\n🔹スマイルポケット\n（画像）\nバッグの背面にあるポケットで、モナリザの微笑みになぞらえて呼ばれている\n・■ライン一覧\n🔹マトラッセ\n（画像）\nダイヤ型のキルティング加工がされたデザイン\nシャネルを代表するデザインでブランドアイコンになっている\n🔹バイアスステッチ\n（画像）\n名前の意味の通り斜めストライプのステッチが施されたデザイン\n🔹シェブロン（前：Vステッチ）\n（画像）\nV字型のステッチが特徴のデザイン。古くからあるデザインだったが、新ラインのシェブロンという名で再注目されている\n🔹マドモアゼル\n（画像）\n縦のステッチラインが特徴のデザイン\nマトラッセ同様に様々なアイテムに使用されている\n🔹ウルトラステッチ\n（画像）\n目立つ極太糸を使用したステッチが特徴でダイヤ柄にデザインされている\nワイルドステッチよりも太い糸を使用している\n🔹ワイルドステッチ\n（画像）\n太い糸を使用したステッチが特徴でダイヤ柄にデザインされている\nレザーと糸がコントラストカラーになっていることが多い\n🔹アイコン\n（画像）\nココマーク,カメリア,スター,クローバー,香水No.5等を取り入れたデザイン\n2003年に発表され2007年にデザインが一新された\n🔹ボーイシャネル\n（画像）\nオーバーステッチの縁取りとアンティークな留め具が特徴のデザイン\n弾薬保管バッグからインスパイアされたと言われている\n🔹ドーヴィル\n（画像）\n1913年にブティックをオープンしたフランスにあるリゾート地の名前が由来\nキャンバスを使用した人気のカジュアルライン\n🔹ガブリエル ドゥ シャネル\n（画像）\nボディ部分はしなやかなレザーでダイヤ柄のキルティング加工、ボトム部分は硬質なレザーと異なる素材を使用したデザイン\n🔹カメリア\n（画像）\nココシャネルが愛したカメリア（椿の花）を配置したデザイン\nシャネル設立当初から様々なアイテムに使用されている\n🔹バタフライカメリア\n（画像）\nカメリアが一輪のみ配置されていて、その内側に小さなココマークが入っているデザイン\n🔹コココクーン\n（画像）\n柔らかくモコモコしたキルティングが特徴のデザイン\n基本ナイロン素材が多いが、レザー素材のアイテムもある\n🔹ココボタン\n（画像）\nココマークを丸いボタンにあしらった非常にシンプルなデザイン\n小物に使用されていることが多い\n🔹カンボン\n（画像）\nマトラッセに存在感のあるココマークが配置されているデザイン\n🔹スポーツ\n（画像）\n耐久性・耐水性に優れたナイロンやキャンバスを使用したデザイン"}, {"path": "バッグ > CHANEL > クラシックハンドバッグ（マトラッセ）", "text": "■マトラッセとは\nダイヤ型のキルティング加工がされたデザインのこと\nキルティング加工は見た目の美しさだけではなく、革の形が型崩れしにくくなるという効果がある\n現在『11.12』のバッグが主にマトラッセ呼ばれ、シャネルを代表する人気のバッグとなっている\n■歴史\n1955年2月、ガブリエル シャネルはゴールドのチェーンをあしらったキルティング バッグをデザイン\nこのバッグは誕生した年にちなんで「2.55」と名付けられ、現在のマトラッセの原点となっている\n当時ショルダーバッグは男性のものという印象が強く、女性のバッグはハンドバッグが主流で非常に持ちにくかったため、ガブリエル シャネルは女性が両手を自由に使える実用的なバッグを提供したいという思いから「2.55」を生み出した\n1983年、巨匠　カール ラガーフェルドがデザイナーに就任し、このアイコンバッグ「2.55」を再解釈し、誕生したバッグが当時の商品コード01112にちなんで「11.12」と名付けられ、現在主に「マトラッセ」と言われている人気バッグとなっている\nまた正式名称は「クラシック ハンドバッグ」である\n■使用されていることが多い素材\nキャビアスキン、ラムスキンなど人気の素材をはじめ、多くの素材のマトラッセ（クラシックハンドバッグ）が作られている\t\t\t\t\t\t\n■2.55と11.12の違い\n《ロック金具部分が違う》\n（画像）\n「2.55」では長方形のターンロック金具（マドモアゼルロック金具）\n「11.12」では定番のココマークロック金具\n《チェーン部分が違う》\n（画像）\n「2.55」はチェーンのみ\n「11.12」はチェーンにレザーが編み込まれている\n🔹ミニクラシックハンドバッグ\n（画像）\n通称ミニマトラッセ、マトラッセ20\nサイズ：12cm×20cm×6cm\n定価：\n税込925,100円（ラムスキン）※2026年\n税込838,200円（ラムスキン）※2025年\n🔹クラシックスモールハンドバッグ\n（画像）\n通称マトラッセ23\nサイズ：14.5cm×23cm×6cm\n定価：\n税込1,850,200円（キャビアスキン）※2026年\n税込1,676,400円（キャビアスキン）※2025年\n🔹11.12 クラシックハンドバッグ\n（画像）\n通称マトラッセ25\nサイズ：15.5cm×25.5cm×6.5cm\n定価\n税込1,925,000円（ラムスキン）※2026年\n税込1,744,600円（ラムスキン）※2025年\n🔹クラシックラージハンドバッグ\n（画像）\n通称デカマトラッセ、マトラッセ30\nサイズ：19.5cm×30cm×10cm\n定価：\n税込2,074,600円（キャビアスキン）※2026年\n税込1,879,900円（キャビアスキン）※2025年\n🔹クラシックマキシハンドバッグ\n（画像）\n通称デカマトラッセ、マトラッセ34\nサイズ：23cm×34cm×10cm\n定価：\n税込2,186,800円（キャビアスキン）※2026年\n税込1,981,100円（キャビアスキン）※2025年"}, {"path": "バッグ > CHANEL > ボーイシャネル", "text": "■ボーイシャネルとは\nフロン 体部分を留めておくための金具として使われており、パチッと音がしてしっかり留めることができる\nカバンや財布の中身が外に飛び出してしまうのを防ぐことができ、防犯性の高いアイテムとなっている\n■歴史\n1969年に誕生し、制作を手がけたデザイナーに娘が誕生した記念として娘と同じ名前「コンスタンス」をつけたと言われている\n第35代アメリカ大統領のジョン・F・ケネディの夫人、ジャクリーン・ケネディが愛用したことで一気に人気に火が付いた\n「コンスタンス」という言葉は、いつも変わらず普遍的で、自分らしくあること、そして忍耐、自信を意味している\n■使用されていることが多い素材\nボックスカーフ、エプソン、タデラクト、アリゲーターなどが主な素材として使用されている。\n■刻印の場所\n（画像）\nマチの裏に打刻されている\n・💡コンスタンスとコンスタンスⅢの違い\n■バッグの構造の違い\n【コンスタンス】\n（画像）\n仕切りはないため、収納スペースが1つ\n内装にはオープンポケット、ファスナーポケットが1つずつ\n外装の背面にオープンポケット1つ\n【コンスタンスⅢ】\n（画像）\n・仕切りがあるため、収納スペースが2つ\n内装にはオープンポケットが2つ\n背面にオープンポケットはなし\n🔹コンスタンス14(ミクロ、ミニミニ）\n（画像）\nサイズ：14cm×11cm×3cm\n定価：-\n🔹コンスタンス18（ミニ）\n（画像）\nサイズ：18cm×15cm×5cm\n定価：\n1,166,000円(エプソン）※2023年\n1,364,000円（エプソン）※2024年\n1,463,000円（エプソン）※2025年\n🔹コンスタンス24\n（画像）\nサイズ：24cm×16.5cm×8cm\n定価：\n1,595,000円（エプソン）※2024年\n1,716,000円（エプソン）※2025年\n🔹コンスタンスエラン\n（画像）\nサイズ：24cm×14.5cm×5cm\n定価：-\n🔹コンスタンス「ON A SUMMER DAY」ブラック\n（画像）\n2017年春夏に発売された\nシーズンのテーマ「ON A SUMMER DAY」の特徴である幾何学模様が本体のレザーに描かれている\n🔹コンスタンス「ON A SUMMER DAY」マルチ\n（画像）\n2017年春夏に発売された\nシーズンのテーマ「ON A SUMMER DAY」の特徴である幾何学模様が本体のレザーに描かれている"}, {"path": "バッグ > Hermès > インザループ", "text": "■インザループとは\nハンドル部分や底にシェールダンクルのデザインが取り入れられたハンドバッグ\n内側の金具は反対側のフープにひっかけることで、簡易ロックできるデザインとなっている\n形はピコタンに似ており、一部では第二のピコタンとも呼ばれている\n■歴史\n2022年秋冬に販売が開始され、しなやかさと気品を湛え、一つ上のエレガンスを叶える軽やかなバッグというコンセプトで作られた\n2019年から『インザループシリーズ』が登場していたが、当初はカードケース、コインケースなど、スモールレザーグッズのみの展開となっていた\n■使用されていることが多い素材\n本体にはトリヨンクレマンスが使用され、ハンドルと底面のシェーヌダンクルの部分にはスイフトが使用されている\n🔹インザループ18\n（画像）\nサイズ：18cm×20cm×13cm\n定価：\n718,300円（トリヨンクレマンス＋ヴォースイフト）※2024年\n754,600円（トリヨンクレマンス＋ヴォースイフト）※2025年\n🔹インザループ23\n（画像）\nサイズ：23cm×25cm×15cm\n定価：\n767,800円（トリヨンクレマンス＋ヴォースイフト）※2024年\n806,300円（トリヨンクレマンス＋ヴォースイフト）※2025年"}, {"path": "バッグ > Hermès > 24/24 （ヴァンキャトル/ヴァンキャトル）", "text": "■24/24とは\n着脱可能なストラップにより2WAYとして使用できるショルダーバッグ\n金具はケリーをイメージさせ、二重になったフラップが特徴的なデザインとなっている\n■歴史\n2018年の秋冬に仕事やプライベートを頑張る人々が、24時間持ち歩けるバッグというコンセプトで作られた\n｢24/24」という名前はエルメス本店がパリのフォーブルサントレーノ24番地にあることも由来している\n2020年にはMINI（21㎝）が発売され、3サイズでの展開となった\n■使用されていることが多い素材\nトゴ、スイフトなどが主な素材として使用されている。ト ット\n（画像）\nコマサイズ：0.9cm×0.5cm\n定価：税込229,900円※2026年\n🔹シェーヌダンクルPMブレスレット\n（画像）\nコマサイズ：1.4cm×0.8cm\n定価：税込256,300円※2026年\n🔹シェーヌダンクルMMブレスレット\n（画像）\nコマサイズ：1.7cm×1.0cm\n定価：税込280,500円※2026年\n🔹シェーヌダンクルGMブレスレット\n（画像）\nコマサイズ：2.1cm×1.2cm\n定価：税込310,200円※2026年\n🔹シェーヌダンクルTGMブレスレット\n（画像）\nコマサイズ： 2.4cm×1.4cm\n定価：税込330,000円※2026年\n🔹シェーヌダンクル・パンクブレスレット\n（画像）\n🔹シェーヌダンクル・トレセブレスレット\n（画像）\n🔹エヴァーシェーヌダンクルブレスレット\n（画像）"}, {"path": "ジュエリー > エルメス > ブレスレット", "text": "■サイズ一覧\nコマ（またはモチーフ）の大きさ※シェーヌダンクル等\nTGM（トレ・グラン・モデル）＞GM（グラン・モデル）＞MM（ミディアム・モデル）＞PM（プティット・モデル）＞TPM（トレ・プティット・モデル）\nブレスレットのサイズ※シェーヌダンクル等\n○○LINK　※コマ数で記載する\nブレスットのサイズ※コリエドシアン等\nT5＞T4＞T3＞T2＞T1　※TはTaille（日本語でサイズ）の略\n旧型は『S』や『L』などの表記\n🔹アレア\n（画像）\nシェーヌダンクル、サランボ、ブックルセリエ、ダリウスなど人気のモデルをミックスしたデザイン\n🔹アクロバット\n（画像）\n一つ一つコマが外れるため、いつでもサイズ調整が可能\n🔹トルサード\n（画像）\nトルサードはフランス語で「螺旋（らせん）」や「ねじれ」を意味している\n🔹グレンデシャン\n（画像）\nグレンデシャンはフランス語で「穀物の鎖」を意味し、その名の通り穀物の粒が連なったようなデザイン\n🔹ブックルセリエ\n（画像）\nブックルが留め具で、セリエが馬具関連を意味しており、馬の口に含ませる『ハミ』がモチーフになっている\n🔹ブックルセリエ・アンフレクシブル\n（画像）\n廃盤になったブックルセリエが形を変えて復刻したデザイン\n🔹クレッシェンド\n（画像）\n徐々にコマが大きくなるグラデーションデザイン\n「前期型」はフランス製でコマが詰まっており、ドイツ製の「後期型」は隙間が空いてコマ数が少ないという違いがある\n🔹パラード\n（画像）\nパラードは、フランス語で「行進」や「パレード」を意味しており、シェーヌダンクルのモチーフに溝やツイストを加えたデザイン\n🔹ヘラクレス\n（画像）\nギリシア神話に登場する英雄ヘラクレスがモデル名の由来で、このヘラクレスとエルメスの頭文字の「H」を重ねたデザイン\n🔹ダリウス\n（画像）\n古代ペルシャの王「ダリウス大王」に由来して付けられたと言われており、直線的なデザインが特徴\n🔹コリエドシアン\n（画像）\nコリエドシアンはフランス語で「犬の首輪」を意味しており、1927年当時、愛犬家の常連客から「犬の首輪のようなブレスレットが欲しい」というリクエストがあり誕生した\n🔹モールドゥコース\n（画像）\n馬のくつわ（Mors）をモチーフにしたデザイン\n🔹アスコット\n（画像）\nイギリスの格式ある競馬場「ロイヤルアスコット」から着想を得たとされるモデル\n🔹ノヴァ\n（画像）\nノヴァはラテン語で「新星」を意味し、その名の通り、星がモチーフになっている\n🔹ヴァンドーム\n（画像）\nパリの名門ジュエラーが軒を連ねる『ヴァンドーム広場』にちなんで名付けられたデザイン\n🔹エトセトラ\n（画像）\nエトセトラは「その他」「続き」を意味し、シェーヌダンクル含む4種のチェーンからなるデザイン\n🔹アラベスク\n（画像）\nアラベスクとはヨーロッパでの『唐草模様』を意味し、長寿や延命など、縁起の良いものとされている\n🔹サランボ\n（画像）\nサランボは、19世紀フランス文学の巨匠フローベールによる同名の小説にインスパイアされたモデル\n🔹タクェ\n（画像）\nその名前の由来や背景には諸説あるが、タクティクス（戦術）に通じる意図があるとも言われている\n🔹エロイーズ\n（画像）\n1987年に創業150周年を記念して発売されたモデル。その名前は中世フランスの伝説的恋人たち「アベラールとエロイーズ」に由来すると言われる\n🔹ネプチューン\n（画像）\n海の神ネプチューンの名を冠したモデル\nシェーヌダンクルとは違いトグルがエッジの効いたデザインとなっている\n🔹カドリーユ\n（画像）\nカドリーユは、フランスの古典舞踏「カドリール」から名を取ったモデル\n🔹アトランテ\n（画像）\n神話の地『アトランティス』から由来した名前となっており、独自に連なるチェーンが特徴的なデザイン"}, {"path": "ジュエリー > エルメス > リング", "text": "■リングサイズ一覧\n🔹シェーヌダンクルアンシェネPM\n（画像）\n「アンシェネ」とはフランス語で「繋ぐ」「連鎖する」といった意味。シェーヌダンクル（錨の鎖）が連なったデザイン\n🔹シェーヌダンクルアンシェネGM\n（画像）\nシェーヌダンクルアンシェネPMよりも立体的に繋がれたデザイン\n🔹コリエドシアンPM\n（画像）\nコリエドシアンはフランス語で「犬の首輪」を意味しており、1927年当時、愛犬家の常連客から「犬の首輪のようなブレスレットが欲しい」というリクエストがあり誕生した\n🔹コリエドシアンGM\n（画像）\nコリエドシアンPMよりもスタッズの数が多く、幅があるデザイン\n🔹クロワゼット\n（画像）\n南仏カンヌの華やかな大通り「クロワゼット」が名前の由来となっている\nエシャペと似ているがクロワゼットには「捻じれ」がある\n🔹エシャペ\n（画像）\nフランス語で「逃避」を意味し、バレエの跳躍するような自由な動き「エシャッペ」が名前の由来となっている\nクロワゼットと似ているがエシャペには「捻じれ」がない\n🔹フィネス\n（画像）\nフィネスは、フランス語で「繊細さ」「優美さ」「上品さ」を意味し、トグルクラスプ（留め具）が特徴的なデザイン\nエシャペと似ているがフィネスはリングがマルカンに直接ロウ付けされている\n🔹オスモズ\n（画像）\nオスモズはフランス語で「浸透」を意味し、ブランドイニシャル「H」を彷彿とさせるデザインが特徴\n🔹エクリプス・リュバン\n（画像）\nEclipse（エクリプス）」は光と影、「Ruban（リュバン）」はリボンを意味する\nパンチングで描かれた“H”マークが特徴的なデザイン\n🔹アテナ\n（画像）\nエルメスを象徴するシグネチャー 「メドール」に敬意を表して作られたモデル\nギリシャ神話の知恵と戦いの女神である「アテナ」が名前の由来となっている\n🔹アリアンヌ\n（画像）\nギリシャ神話の女神アリアドネが、愛する人を迷宮から救った「導きの糸」の伝説に由来して名前が付けられた\n名前の由来の通りウェディングリングとなっている\n🔹ヴェルティージュ\n（画像）\n1998年にマルタン・マルジェラがエルメスで生み出した、革新的な「ドゥブル・トゥール」の概念が礎となってできたモデル\n🔹エヴァーシェーヌダンクル\n（画像）\nシェーヌダンクルをエッジの効いた現代的なデザインに落とし込んでおり、2つの「H」が連結したようなデザイン\n🔹エトリヴィエール\n（画像）\n鞍と鐙（あぶみ）をつなぐベルト「エトリヴィエール」が名前の由来\n🔹ヘラクレス\n（画像）\nギリシャ神話に登場する最も有名な英雄、ヘラクレスの名を冠したリング\n大きなHのモチーフが特徴\n🔹オランプ\n（画像）\n1970年代にエルメスの5代目ジャン＝ルイ・デュマが手掛けたメタルとレザーを組み合わせたシリーズからインスピレーションを得て誕生したデザイン\n🔹ケリー\n（画像）\n1956年、モナコ公妃グレース・ケリーがその名を授けたエルメスを象徴するバッグ「ケリー」の「トゥレ・クラスプ」と呼ばれる留め金がリングのデザインになっている\n🔹ケリー・クロシェット\n（画像）\nケリーバッグに付属する、鍵を収納するためのレザーケース「クロシェット」と鍵がリングに付いたデザイン\n🔹コル\n（画像）\n馬に乗った使者が到着を知らせた「角笛」からインスピレーションを得たデザイン\n🔹シェーヌダンクルカオス\n（画像）\nシェーヌダンクルのコマに繊細なチェーンとダイヤモンドが絡み合うデザイン\n🔹シェーヌダンクルカリプソ\n（画像）\n海の女神でありアトラスの娘であるギリシャ神話に登場する海の女神「カリプソ」、また20世紀に始まったカリブ海の音楽のスタイル「カリプソ」が名前の由来とされている\n🔹シェーヌダンクルコントゥール\n（画像）\nコントゥールは「輪郭」を意味し、シェーヌダンクルのモチーフがメインのシンプルなデザイン\n🔹シェーヌダンクルパンク\n（画像）"}, {"path": "ジュエリー > エルメス > ネックレス", "text": "🔹ファランドール\n（画像）\nシェーヌダンクルからインスピレーション受けて生まれたモデル\nロヴァンス地方の伝統舞踊ファランドールが名前の由来\n🔹ファランドールPM\n（画像）\nPMはシェーヌダンクル1コマのみでペンダントの仕様になっている\n🔹ポップＨ（ポップアッシュ）\n（画像）\nエルメスの頭文字「H」が特徴のデザイン\nラッカー仕上げによる豊富なカラーバリエーションがある\n🔹シェーヌダンクル\n（画像）\n1938年4代目社長ロベール・デュマ・エルメスが港で見た船の錨の鎖に心を奪われ誕生したモデル\nフランス語で「錨の鎖」を意味している\n🔹シェーヌダンクル アミュレット\n（画像）\nシェーヌダンクルのモチーフを1コマのみ使用したペンダント仕様のデザイン\nファランドールPMと似ているがアミュレットにはトグルとマルカンのモチーフがある\n🔹シェーヌダンクル アンシェネ\n（画像）\n「アンシェネ」とはフランス語で「繋ぐ」「連鎖する」といった意味\nシェーヌダンクル（錨の鎖）が連なったデザイン\n🔹オーケリー\n（画像）\nブランドを象徴するバッグ「ケリー」のカデナ（南京錠）にオマージュを捧げたネックレス\nカデナの形にカットされたレザーとメタルプレートという異素材の組み合わせが特徴となっている\n🔹ミニマイヨンPM\n（画像）\nシェーヌ・ダンクルのクラスプを採用が採用され、船の世界観からのインスピレーションが反映されている\nファランドールPMと似ているが、ミニマイヨンは裏面が平面になっている\n🔹アミュレット\n（画像）\nエルメスを代表するバッグ「ケリー」「バーキン」「コンスタンス」など様々なモチーフが作られている\n🔹クレッシェンド\n（画像）\n徐々にコマが大きくなるグラデーションデザイン\n🔹レポンス\n（画像）\nレポンスはフランス語で「答え」という意味で、シェーヌダンクルを新しく解釈したモデルとして生み出された\n🔹アトラージュ\n（画像）\nアトラージュはフランス語で馬具を繋ぎとめることを意味し、その馬具のバックルをモチーフにしたデザイン\n🔹モールドゥブリッド\n（画像）\nモールドゥブリッドは馬の頭に装着する馬具「頭絡（ブリッド）」や「ハミ（モール）」をモチーフにしたデザイン\n🔹トゥアレグ\n（画像）\nサハラ砂漠の遊牧民・トゥアレグ族が手彫りで彫る模様であり、名前の由来になっている。魔よけなどの意味が込められている"}, {"path": "ジュエリー > カルティエ > ラブ", "text": "■ラブとは\n1969年にニューヨークでつくられたアイコニックなブレスレット\nカルティエのデザイナーであったアルド・チプロは、古代の戦士が妻の貞操を守るために使用したという「貞操帯」からインスピレーションを得て、現代的に解釈し愛する二人のための特別なジュエリーとして再構築し生み出した\nネジで留める独自の仕組みは、「ふたりで身に着ける」ことを前提に設計されており、恋人やパートナーとの絆を、物理的に“固定”することから「現代の愛の手錠」と呼ばれている\n■刻印の違い\nオールド\n（画像）\n現行\n（画像）\n■旧型と新型の違い\n《旧型》\nビス（ねじ）が外れる\n（画像）\n《新型》\nビス（ねじ）が外れない\n裏側に２か所半円状の穴が開いている\n（画像）\n《最新型 2022年～現在》\nビス（ねじ）が外れない\n裏側に穴が開いていない\n（画像）\n■着脱方法\n通常の着脱方法\n両側にビスが付いており、専用のドライバーを使うことで取り外し可能\n反時計回りに回すとビスが緩まる\n（画像）\n（画像）\nパヴェダイヤ＋ダイヤモンド12石の着脱方法\n※パヴェダイヤ＋ダイヤモンド10石は通常通り\n両端にヒンジとプッシュボタン（ダイヤ付き）が付いており、留め具を上げプッシュボタンを押すことで取り外し可能\nドライバー必要なし\n（画像）\n（画像）\n🔹ラブブレスレット（スモールモデル）\n（画像）\nビス1つのみ\nブレス幅：3.6mm\n定価：\n税込896,500円（ピンクゴールド）※2026年\n税込1,320,000円（ピンクゴールド×6Pダイヤ）※2026年\n税込1,795,200円（ピンクゴールド×10Pダイヤ）※2026年\n税込5,134,800円（ピンクゴールド×パヴェダイヤ）※2026年\n🔹ラブブレスレット（ミディアムモデル）\n（画像）\nビス1つのみ\nブレス幅：4.8mm\n定価：\n税込1,135,200円（ピンクゴールド）※2026年\n税込1,848,000円（ピンクゴールド×4Pダイヤ）※2026年\n税込6,151,200円（ピンクゴールド×パヴェダイヤ）※2026年\n🔹ラブブレスレット（クラシックモデル）\n（画像）\nビス2つ\nブレス幅：6.1mm\n定価：\n税込1,359,600円（ピンクゴールド）※ はその名の通り、洗練されたシンプルさと無駄のないフォルムを追求する中で生まれた\n「テニスブレスレット」とも呼ばれる\n🔹カクテュス ドゥ カルティエ\n（画像）\nフランス語でサボテンを意味する「カクテュス」が名前の由来となっている\n🔹トリニティ\n（画像）\nルイ・カルティエが1924年に考案した、メゾンを象徴するアイテム。ピンク、イエロー、ホワイト3色のゴールドが使用されている\n🔹パンテール ドゥ カルティエ\n（画像）\n1914年に初めて登場し、豹（パンテール）の斑点模様をオニキスとダイヤモンドで表現した時計が始まりとされている\n🔹ファウナ＆フローラ ドゥ カルティエ\n（画像）\nカルティエが長年インスピレーション源としてきた自然界、特に動植物の世界を探求する中で生まれたアイテム\n様々な動物がモチーフになっている\n🔹マイヨン パンテール\n（画像）\n豹（パンテール）の優美な動きを彷彿とさせる、しなやかでフラットなリンク（マイヨン）が連なるデザインが名前の由来となっている\n🔹グラン ドゥ カフェ\n（画像）\n1938年、当時のクリエイティブディレクターであったジャンヌ・トゥーサンが、コーヒー豆から着想を得て製作し、2023年に現代的なデザインに再解釈され誕生した\n🔹リフレクション ドゥ カルティエ\n（画像）\nカルティエのフォルムへの探求と、ウォッチメイキングおよびジュエリーメイキングのサヴォアフェール（匠の技）の融合から2024年に誕生したアイテム\n🔹ラニエール\n（画像）\nフランス語で「細い革紐」を意味し、正方形のキューブが一本の線を描いているかのようなデザインになっている"}, {"path": "ジュエリー > カルティエ > リング", "text": "■サイズ一覧\nリングのサイズ\nサイズ表記（49）＝内周（49mm）\n内周がサイズで表記されている\n■リングサイズ一覧※国際サイズ\n🔹1895\n（画像）\nソリテールにオマージュを捧げた、タイムレスなデザインのウェディングリング\n🔹C ドゥ カルティエ\n（画像）\nロゴが刻印されたシンプルなウェディングリング\n🔹エタンセル ドゥ カルティエ\n（画像）\nフランス語で「火花」を意味する「エタンセル」が名前の由来になったウェディングリング\n🔹ダムール\n（画像）\nダムールはフランス語で「愛」を意味し、1938年から2022年までディアマンレジェと呼ばれ、その後現代的に再解釈されダムールという名称になった\n🔹デスティネ\n（画像）\nフランス語で「運命」や「宿命」を意味し、名前の由来となっている\n🔹グラン ドゥ カフェ\n（画像）\n1938年、当時のクリエイティブディレクターであったジャンヌ・トゥーサンが、コーヒー豆から着想を得て製作し、2023年に現代的なデザインに再解釈され誕生した\n🔹ヴァンドーム ルイ カルティエ \n（画像）\n1924年にルイ・カルティエによって生み出されたアイテム\nピンク、イエロー、ホワイト3色のゴールドが使用されている\n🔹タンク フランセーズ\n（画像）\n1917年に誕生したタンクフランセーズからインスピレーションを受けてデザインされた\n『タンク』とは戦車を意味しており、第一次世界大戦の戦車を示している\n🔹トリニティ\n（画像）\nルイ・カルティエが1924年に考案した、メゾンを象徴するアイテム\nピンク、イエロー、ホワイト3色のゴールドが使用されている\n🔹トリニティ クッション\n（画像）\n1924年に誕生した定番のトリニティシリーズ\n100周年ということで四角いトリニティリングが誕生した\n🔹パンテール ドゥ カルティエ\n（画像）\n1914年に初めて登場し、豹（パンテール）の斑点模様をオニキスとダイヤモンドで表現した時計が始まりとされている\n🔹ファウナ＆フローラ ドゥ カルティエ\n（画像）\nカルティエが長年インスピレーション源としてきた自然界、特に動植物の世界を探求する中で生まれたアイテム。様々な動物がモチーフになっている。\n🔹マイヨン パンテール\n（画像）\n豹（パンテール）の優美な動きを彷彿とさせる、しなやかでフラットなリンク（マイヨン）が連なるデザインが名前の由来となっている\n🔹レ ベルランゴ ドゥ カルティエ\n（画像）\n直方体と四角錐を組み合わせた構築的なデザインになっている\n🔹パリ ヌーベルバーグ \n（画像）\n「カルティエとパリ」「ひとつのジュエラーとひとつの街」をコンセプトとしたコレクションで、パリの街とパリジェンヌをジュエリーで表現したアイテム\n🔹1895 ソリテール\n（画像）\n1895年にカルティエが初めてプラチ 機能的なロック機構となっている\n🔹ティファニー 1837 インターロッキング\n（画像）\nインターロッキングは「固い絆」「永遠の結びつき」を意味し、ティファニー創業の年「1837」が刻印されたている\n🔹ティファニー インフィニティ\n（画像）\n無限∞がモチーフのコレクション\n∞のモチーフは永遠の愛や二度と離れることのない絆を表している\n🔹ティファニー タイタン\n（画像）\nアーティスト、ファレル・ウィリアムスとのコラボレーションによるコレクション\nギリシャ神話の海神ポセイドンが持つ三叉槍（トライデント）に着想を得ている\n🔹ティファニー フォージ\n（画像）\nフォージは金属を加熱する炉や鍛造工場を意味し、ティファニーの名高いホローウェア工房の職人とクラフトマンシップに敬意を表し作成された\n🔹ティファニー メトロ\n（画像）\n都会の夜景のきらめきからインスピレーションを得て作成された\n🔹トグル\n（画像）\n円形のリングにバーを通して留める「トグルクラスプ」が名前の由来\n🔹ビクトリア\n（画像）\n19世紀のイギリス女王、ヴィクトリア女王に敬意を表して名付けられたアイテム\n🔹ベネチアン\n（画像）\n古代ローマのアーチからインスピレーションを得て生み出されたアイテム\n🔹ラビング ハート\n（画像）\n20世紀を代表する画家パブロ・ピカソの娘パロマ・ピカソが愛の本質を表現することを目的に生み出したアイテム\n🔹リターン トゥ ティファニー\n（画像）\n1969年にティファニーが提供していたキーリングに着想を得て生み出され、紛失した際にティファニーに戻るようにという願いが込められたアイテム\n🔹バンブー\n（画像）\nティファニーから1996年に発売されたネイチャーコレクションで、竹をモチーフにしたデザイン\n🔹ティファニー 1837 メイカーズ\n（画像）\nホローウェア工房から着想を得たメイカーズのシンボルを施し、伝統と卓越したクラフトマンシップを讃えたコレクション\n🔹パフスター\n（画像）\n「パフ」は英語で「膨らんだ、ふっくらした」という意味があり、星（スター）のモチーフが平坦ではなく、ぷっくりとした立体的なデザインとなっている"}, {"path": "ジュエリー > ティファニー > リング", "text": "■サイズ一覧\nサイズ表記＝USサイズ（アメリカ規格）\n内周を基準としたUSサイズで表記されている\n🔹ティファニー ノット\n（画像）\n1889年に製作されたアーカイブのリボンに着想得て、ニューヨークの象徴である建築用チェーンリンク（金網）からインスピレーションを受け誕生したコレクション\n🔹ボーンリング\n（画像）\nデザイナー、エルサ・ペレッティによる、人体の骨格から着想を得た彫刻的なフォルムが特徴のデザイン\n🔹スネーク\n（画像）\nエルサ・ペレッティのデザイン。蛇の持つ流動的で官能的なフォルムを捉えた、彫刻的でモダンなバングル\n🔹トゥギャザー ミルグレイン\n（画像）\nトゥギャザーは名の通り「共に」を意味し、二人の絆や結びつきを表現する目的で生まれたコレクション\nミルは「千」、グレインは「粒」を意味し、日本ではミル打ちと呼ばれている\n🔹16ストーン\n（画像）\n1959年にジャン・シュランバージェがデザインし発表された\n16石のダイヤモンドの間に8つのクロスステッチで繋ぎ合わせたデザイン\n🔹ロープ\n（画像）\nジャン・シュランバージェによる象徴的なモチーフに着想得て生み出されたコレクション\nその名の通りロープをモチーフにしている\n🔹ティファニータイタン\n（画像）\nアーティスト、ファレル・ウィリアムスとのコラボレーションによるコレクション\nギリシャ神話の海神ポセイドンが持つ三叉槍（トライデント）に着想を得ている\n🔹リターン トゥ ティファニー\n（画像）\n1969年にティファニーが提供していたキーリングに着想を得て生み出され、紛失した際にティファニーに戻るようにという願いが込められたアイテム\n🔹オープンハート\n（画像）\nエルサ・ペレッティ作で「心を開いて」という意味が込められ、大切な人へ贈る定番のジュエリー\n🔹オリーブリーフ\n（画像）\nモロッコにあるパロマピカソの自宅を囲むオリーブの木々から着想を得たデザイン\n🔹バイザヤード\n（画像）\n「女性が予算に応じて、ダイヤの大きさやチェーン上のダイヤの数を選べるように」という願いから誕生した\n名称の元となっている「ヤード」とは、長さを表す単位のこと\n🔹ビクトリア\n（画像）\n19世紀のイギリス女王、ヴィクトリア女王に敬意を表して名付けられたアイテム\n🔹1837\n（画 ひっかいたときに傷が付くか」であり、傷ついた方がモース硬度は低いとされる\n🔹（ホワイト）マザーオブパール\n（画像）\n真珠母貝（真珠を作り出す貝）の内側にある真珠層を加工したもの\nヴァンクリーフではホワイトマザーオブパールにはオーストラリア産を主に使用している\n表面から水分が蒸発する時に縮む傾向があり、水との接触で素材が収縮する危険があるため注意が必要\nモース硬度：3.5～4\n🔹カーネリアン\n（画像）\nカルセドニーの一種で、赤色や橙色を帯びたものを指す\nクレタ島や中央アジア、さらには極東で数千年にもわたって珍重され、古代エジプトではカーネリアンは生命のシンボルとされており、次の世界への魂の旅を容易にする力を授けられていたとされている\n比較的硬度が高く、メンテナンスが簡単\nモース硬度：6.5～7\n🔹オニキス\n（画像）\nカルセドニーの一種で、黒色を帯びたもの指す\n元は縞模様が入っているものを爪痕に似ていたことから、ギリシャ語で「爪」という意味をもつオニキスと呼んでいたが、ヴァンクリーフでは黒一色のものを「オニキス」、縞模様が入っているものを「ヴェインドオニキス」としている\n比較的硬度が高く、メンテナンスが簡単\nモース硬度：6.5～7\n🔹カルセドニー（ブルー）\n（画像）\nヴァンクリーフでカルセドニーと呼ばれるブルーカルセドニーは石英の細かな結晶が網目状に集まっており、まろやかで半透明の色合いが特徴\nカルセドニーの語源は、現在のトルコに位置する古代都市カルセドンを意味するギリシャ語の“カルケドン”とされている\nヴァンクリーフでは色味の強さと繊細なカラーグラデーションで独特の存在感を誇るナミビア産のカルセドニーを主に使用している\n比較的硬度が高く、メンテナンスが簡単\nモース硬度：6.5～7\n🔹マラカイト\n（画像）\n深みのある緑色に独特の縞模様が入っており、二次銅鉱物（銅の鉱石鉱床の付近で銅を含有した溶液から形成される鉱物）を指す\n幸運をもたらす石とされ、厄除けのお守りとして贈られることが多い\n経年により自然に表面がマットになっていく特性があり、デリケートで柔らかい石のため、表面に小さな傷がつきやすい\n多湿を避け、衝撃を与えないようにする必要がある\nモース硬度：3.5～4\n🔹ターコイズ\n（画像）\n鮮烈なブルーカラーが特徴で、まだら模様が入っていることが多く、暗い斑点が見られることもある\nルネッサンス期にヨーロッパへもたらされ、当時はトルコから輸入されていたため「トルコの石」の名で知られている\nヴァンクリーフでは均一なスカイブルーの色を持つことから中央および南アメリカ産のターコイズを厳選し使用している\nターコイズの色合いは経年により自然に微妙に変化し、特に直射日光に弱く、乾燥により緑色がかることがある\nモース硬度：5～6\n🔹タイガーズアイ\n（画像）\n石英を主成分としており、虎の目の虹彩を思わせる光沢のあるイエローと茶色の縞模様が特徴\n古代から勇者を保護する石として知られたタイガーズアイは、「すべてを見通す目」とも呼ばれている\nヴァン クリーフは、濃い縞と薄い縞がまっすぐに均一な線となり、かつバランスよく配されているタイガーズアイを採用している\n比較的硬度が高く、メンテナンスが簡単\nモース硬度：6.5～7\n🔹ブルズアイ\n（画像）\nレッドタイガーズアイとも言われ、タイガーズアイが酸化し赤味が強くなったものを指す\nエネルギーと情熱を高める石とされており、またタイガーズアイより邪悪なものを祓う魔除けの効果が高いと言われている\nヴァンクリーフでは明暗の帯が均等で調和のとれた最高品質のブルズアイだけを採用している\n比較的硬度が高く、メンテナンスが簡単\nモース硬度：6.5～7\n🔹レターウッド\n（画像）\n主に南米にあるガイアナ共和国、スリナム共和国の奥深いジャングルで育てられている木で、不規則な黒色の斑模様が文字に似ている為、レターウッドと名付けられている\n欧米では幸運を呼ぶ木として知られており、硬度の高さと木目の美しさから「木のダイヤモンド」「木の宝石」とも呼ばれている\nモース硬度：-\n🔹セーヴル磁器\n（画像）\nフランス国立セーヴル磁器製作所とメゾンがコラボレーションし、セレスティアルブルーのセーヴル焼（磁器）を制作\n石英、長石、カオリンを混ぜ合わせて原料を作り、手作業により数週間もの時間をかけて、カット、着色、乾燥、焼成、そして最終的な研磨を経てサテンのような光沢感が生まれ完成する\n他カラーでセランドングリーン、ピンクもある\nモース硬度：-\n🔹ラピスラズリ\n（画像）\n主成分であるラズライトの存在により、深い青色をしたものが大多数を占める、さまざまな成分を含む不透明のオーナメンタルストーン\nその名はラテン語のlapis（石）とアラビア語のazul（ブルー）に由来する。ヴァン クリーフでは純度が高く色の鮮やかさが強く、黄鉄鉱による斑点が美しいものを採用している\nモース硬度：5～5.5\n🔹ブルーアゲート\n（画像）\n美しい青色が特徴で、石英（クォーツ）の微細な結晶が集まってできた鉱物\n“成功”や“芸術性”の石言葉を持ち、秘めた才能を開花させると言われるパワーストーンとされている\n経年変化で石の不透明度がわずかに変化していく特徴がある\nモース硬度：6.5～7\n🔹ピーターサイト\n（画像）\n青みがかった黒や褐色が特徴で、地表の地殻変動によって細かく砕けたものが石英（クォーツ）によって再び固まってできた鉱物を指す\nピーターサイトという名前は、発見者であるシド・ピーターズ氏の名前から付けられた。また表面のマーブル模様が嵐のように見えるため「テンペストストーン」と呼ばれることもある\n比較的硬度が高く、メンテナンスが簡単\nモース硬度：6.5～7"}, {"path": "ジュエリー > ヴァンクリーフ > アルハンブラ", "text": "■アルハンブラとは\n四つ葉のクローバーを着想源に、幸運の象徴として1968年に誕生した\nまた、アルハンブラにはクローバーの葉それぞれに「愛」「希望」「幸運」「信頼」の4つの意味が込められており、持つ人に幸運をもたらすジュエリーとも言われている\n今ではアルハンブラがブランドを象徴するデザインとなっている\n■アルハンブラの種類\n①ヴィンテージアルハンブラ\n（画像）\nモチーフの大きさは約15mm\nモチーフのフチがミル打ちされている\n②スウィートアルハンブラ\n（画像）\nモチーフの大きさは約9.5mm\nモチーフのフチがミル打ちされている\n③マジックアルハンブラ\n（画像）\nモチーフの大きさは約26mm\nアイテムによって様々なサイズのモチーフがある\nモチーフのフチがミル打ちされている\n④ピュアアルハンブラ\n（画像）\nモチーフの大きさは約16mm\nモチーフのフチがミル打ちされず、段差がない滑らかな仕上がり\n⑤ビザンチンアルハンブラ\n（画像）\nモチーフの大きさは約21mm\nモチーフのフチがミル打ちされず、段差がない滑らかな仕上がり\n宝石を使用せず、金属のみ\n⑥ラッキーアルハンブラ\n（画像）\nモチーフはハートや蝶（パピヨン）、葉、星などのモチーフ、または四つ葉のクローバー含む様々なモチーフの組み合わせ\nモチーフの大きさは約15mm（モチーフによるがヴィンテージアルハンブラと同等）\nモチーフのフチがミル打ちされている\n■旧型/新型の違い\n《旧型》\nカニカン（フック）が丸みを帯びており、ロゴ刻印がない\n（画像）\n《新型》\nカニカン（フック）が平坦で、ロゴ刻印がある\n（画像）\n🔹ヴィンテージアルハンブラ ブレスレット\n（画像）\n定価：\n税込852,500円(イエローゴールド×5Pマザーオブパール)※2026年\n税込814,000円(イエローゴールド×5Pオニキス)※2026年\n税込896,500円(イエローゴールド×5Pカーネリアン)※2026年\n税込5,398,800円(イエローゴールド×5Pダイヤ)※2026年\n🔹ヴィンテージアルハンブラ ギヨシェ ブレスレット\n（画像）\n定価：\n税込1,227,600円(ホワイトゴールド)※2026年\n税込1,161,600円(イエローゴールド)※2026年\n🔹スウィートアルハンブラ ブレスレット\n（画像）\n定価：\n税込259,600円(イエローゴールド×1Pマザーオブパール)※2026年\n税込279,400円(ローズゴールド×1Pカーネリアン)※2026年\n税込643,500円(6Pローズゴールド)※2026年\n税込1,980,000円(ホワイトゴールド×6Pダイヤ)※2026年\n🔹マジックアルハンブラ ブレスレット\n（画像）\n定価：\n税込1,267,200円(イエローゴールド×マザーオブパール×オニキス)※2026年\n税込10,692,000円(ホワイトゴールド×ダイヤ)※2026年\n🔹ピュアアルハンブラ ブレスレット\n（画像）\n定価：\n税込1,240,800円(イエローゴールド×マザーオブパール)※2026年\n🔹ビザンチンアルハンブラ ブレスレット\n（画像）\n定価：税込528,000円(イエローゴールド)※2026年\n🔹ヴィンテージアルハンブラ ピアス\n（画像）\n定価：\n🔹スウィートアルハンブラ ピアス\n（画像）\n定価：\n🔹マジック
