<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>RINKAN ストーリー作成</title>
<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<style>
:root{
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Display","Hiragino Sans","Yu Gothic",sans-serif;
  --bg:#ececf0;--card:#ffffff;--card2:#f2f2f7;--line:#e0e0e6;
  --t1:#000000;--t2:#3c3c43;--t3:#8e8e93;
  --blue:#007aff;--green:#34c759;--orange:#ff9500;--red:#ff3b30;
  --spring:cubic-bezier(.34,1.56,.5,1);
  --smooth:cubic-bezier(.32,.72,0,1);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
body{
  font-family:var(--font);background:var(--bg);color:var(--t1);padding-bottom:60px;
  background-image:radial-gradient(140% 80% at 50% -20%,rgba(0,122,255,.10),transparent 55%),radial-gradient(120% 60% at 100% 0%,rgba(175,82,222,.06),transparent 50%);
  background-attachment:fixed;
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
}

/* iOS large-title style header */
header{
  background:rgba(236,236,240,.7);
  backdrop-filter:blur(24px) saturate(180%);-webkit-backdrop-filter:blur(24px) saturate(180%);
  color:var(--t1);padding:14px 20px;
  padding-top:max(14px,env(safe-area-inset-top,0));
  position:sticky;top:0;z-index:20;border-bottom:.5px solid rgba(0,0,0,.08);
}
header .eyebrow{font-size:12px;font-weight:700;color:var(--blue);letter-spacing:.04em;text-transform:uppercase;}
header h1{font-size:30px;font-weight:800;letter-spacing:-.03em;line-height:1.1;margin-top:2px;}
header p{font-size:13px;color:var(--t3);margin-top:5px;font-weight:500;letter-spacing:-.01em;}

.wrap{max-width:600px;margin:0 auto;padding:20px 16px;}

.c{
  background:var(--card);border-radius:24px;padding:22px;margin-bottom:18px;
  box-shadow:0 1px 1px rgba(0,0,0,.03),0 10px 34px rgba(0,0,0,.07);
  animation:cardIn .6s var(--smooth) both;
}
@keyframes cardIn{from{opacity:0;transform:translateY(18px) scale(.98);}to{opacity:1;transform:none;}}
.c:nth-child(2){animation-delay:.06s;}
.c:nth-child(3){animation-delay:.12s;}
.c-title{font-size:12px;font-weight:700;margin-bottom:18px;color:var(--t3);letter-spacing:.06em;text-transform:uppercase;}

.fg{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
.f{margin-bottom:0;}
.f.full{grid-column:1/-1;}
.f label{display:block;font-size:13px;font-weight:600;color:var(--t2);margin-bottom:8px;letter-spacing:-.01em;}
.f input,.f select{
  width:100%;padding:15px 16px;border-radius:15px;border:1.5px solid transparent;
  background:var(--card2);font-size:17px;font-weight:500;font-family:var(--font);color:var(--t1);
  transition:border-color .22s var(--smooth),box-shadow .22s var(--smooth),background .22s var(--smooth),transform .13s var(--smooth);
}
.f input:focus,.f select:focus{
  outline:none;border-color:var(--blue);background:#fff;
  box-shadow:0 0 0 5px rgba(0,122,255,.14);
}

/* Segmented control for rank (iOS style) */
.seg{display:flex;gap:4px;background:var(--card2);border-radius:14px;padding:4px;}
.seg button{
  flex:1;border:none;background:transparent;padding:11px 0;border-radius:11px;
  font-size:16px;font-weight:700;font-family:var(--font);color:var(--t2);cursor:pointer;
  transition:transform .16s var(--spring),color .2s,box-shadow .25s var(--smooth),background .25s var(--smooth);
}
.seg button.on{background:#fff;color:var(--t1);box-shadow:0 1px 4px rgba(0,0,0,.12),0 3px 8px rgba(0,0,0,.06);}
.seg button:active{transform:scale(.92);}

.save-btn{
  width:100%;padding:18px;border-radius:17px;border:none;
  background:linear-gradient(180deg,#0a84ff,#007aff);color:#fff;
  font-size:18px;font-weight:700;cursor:pointer;font-family:var(--font);margin-top:16px;letter-spacing:-.01em;
  box-shadow:0 4px 16px rgba(0,122,255,.3);
  transition:transform .14s var(--smooth),box-shadow .2s,filter .15s;
}
.pill{
  padding:14px 24px;border-radius:16px;border:none;background:var(--card);color:var(--t1);
  font-size:16px;font-weight:700;cursor:pointer;font-family:var(--font);
  box-shadow:0 1px 3px rgba(0,0,0,.06),0 6px 16px rgba(0,0,0,.06);
  transition:transform .14s var(--smooth),box-shadow .2s var(--smooth);
}
.save-btn:active,.pill:active,.chip:active,.drop:active{transform:scale(.95);}
.save-btn:active{filter:brightness(.94);}

.empty{text-align:center;color:var(--t3);font-size:14px;padding:32px 16px;line-height:1.6;font-weight:500;}

.chip{
  display:inline-flex;align-items:center;padding:11px 17px;margin:4px;border-radius:22px;
  border:none;background:var(--card2);font-size:14px;cursor:pointer;
  font-family:var(--font);color:var(--t1);font-weight:600;letter-spacing:-.01em;
  transition:transform .18s var(--spring),background .24s var(--smooth),color .24s,box-shadow .24s;
}
.chip.on{background:var(--t1);color:#fff;transform:scale(1.06);box-shadow:0 4px 14px rgba(0,0,0,.22);}

.drop{
  border:2px dashed #c7c7cc;border-radius:18px;padding:34px 12px;text-align:center;
  cursor:pointer;color:var(--t3);font-size:14px;font-weight:600;background:var(--card2);
  transition:transform .18s var(--spring),border-color .22s var(--smooth),background .22s,color .22s;
}
.drop:hover{border-color:var(--blue);color:var(--blue);}

#storyCanvas{
  max-width:100%;max-height:62vh;border-radius:18px;
  box-shadow:0 6px 20px rgba(0,0,0,.12),0 26px 60px rgba(0,0,0,.18);
  transition:transform .4s var(--spring);
}

.arch-item{text-align:center;cursor:pointer;transition:transform .18s var(--spring);}
.arch-item:active{transform:scale(.92);}
.arch-item img{width:100%;border-radius:14px;box-shadow:0 3px 12px rgba(0,0,0,.1);}

#viewerModal{
  -webkit-backdrop-filter:blur(0);backdrop-filter:blur(0);
  transition:backdrop-filter .4s var(--smooth),-webkit-backdrop-filter .4s var(--smooth),background .4s var(--smooth);
}
#viewerModal.show{backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);}
#viewerImg{transition:transform .45s var(--spring),opacity .3s var(--smooth);}

.tick{font-size:15px;color:var(--green);font-weight:700;opacity:0;transition:opacity .4s var(--smooth);margin-top:12px;}

@media (prefers-reduced-motion: reduce){
  *{animation-duration:.01ms !important;transition-duration:.1ms !important;}
  .c{animation:none;}
}
@media (prefers-reduced-transparency: reduce){
  header{background:#ececeF;backdrop-filter:none;-webkit-backdrop-filter:none;}
  #viewerModal.show{backdrop-filter:none;-webkit-backdrop-filter:none;background:rgba(0,0,0,.92);}
}
</style>
</head>
<body>
<header>
  <div class="eyebrow">RINKAN SHIBUYA</div>
  <h1>ストーリー作成</h1>
  <p>値札スキャンで自動入力、ワンタップで保存</p>
</header>
<div class="wrap">

  <div class="c">
    <div class="c-title">📸 ストーリー画像を作成</div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px;">
      <div>
        <div class="f"><label>商品写真</label></div>
        <div id="photoDrop" class="drop">📷 タップして選択</div>
        <input type="file" id="photoIn" accept="image/*" style="display:none;">
      </div>
      <div>
        <div class="f"><label>🏷️ 値札スキャン</label></div>
        <div id="tagDrop" class="drop">🏷️ 値札を撮影/選択<br><span style="font-size:10.5px;color:var(--t3);font-weight:500;">小物は表裏2枚まとめて選択</span></div>
        <input type="file" id="tagIn" accept="image/*" multiple style="display:none;">
        <div id="ocrStatus" style="display:none;text-align:center;font-size:12px;color:var(--blue);margin-top:6px;font-weight:600;"></div>
      </div>
    </div>
    <div id="tagRefArea" style="display:none;margin-bottom:14px;background:var(--card2);border-radius:12px;padding:10px;">
      <div style="font-size:10.5px;color:var(--t3);margin-bottom:6px;text-align:center;">▼ 値札（自動入力の確認用）</div>
      <img id="tagRefImg" style="width:100%;border-radius:8px;border:1px solid var(--line);">
    </div>
    <div class="fg">
      <div class="f"><label>ブランド</label><input type="text" id="sBrand" placeholder="CHROME HEARTS" list="sBrandDl"></div>
      <div class="f"><label>サイズ</label><input type="text" id="sSize" placeholder="54"></div>
      <div class="f"><label>ランク</label>
        <div class="seg" id="rankSeg">
          <button type="button" data-r="S">S</button>
          <button type="button" data-r="A">A</button>
          <button type="button" data-r="B">B</button>
          <button type="button" data-r="C">C</button>
          <button type="button" data-r="D">D</button>
        </div>
        <input type="hidden" id="sRank" value="">
      </div>
      <div class="f"><label>価格（税込・数字のみ）</label><input type="number" id="sPrice" placeholder="172480"></div>
      <div class="f full"><label>下部テキスト</label><input type="text" id="sTag" value="📩DMにて割引可能"></div>
    </div>
    <div style="margin-top:10px;">
      <div style="font-size:11.5px;font-weight:700;color:var(--t3);margin-bottom:6px;">よく使う文言（タップで選択）</div>
      <div id="phraseChips"></div>
      <div style="font-size:11.5px;font-weight:700;color:var(--t3);margin:12px 0 6px;">下部テキストの色</div>
      <div id="colorChips"></div>
    </div>
    <datalist id="sBrandDl"></datalist>
  </div>

  <div class="c" style="text-align:center;">
    <canvas id="storyCanvas" width="1080" height="1920" style="max-width:100%;max-height:65vh;border-radius:10px;box-shadow:0 4px 20px rgba(0,0,0,.12);"></canvas>
    <div style="display:flex;gap:8px;margin-top:14px;justify-content:center;">
      <button class="pill" id="shareBtn" style="background:var(--blue);color:#fff;border-color:var(--blue);padding:12px 24px;font-size:15px;">📤 保存・共有</button>
      <button class="pill" id="dlBtn" style="padding:12px 18px;">💾 DL</button>
    </div>
    <div id="shareTick" style="font-size:13px;color:var(--green);font-weight:600;opacity:0;transition:opacity .4s;margin-top:8px;"></div>
  </div>

  <div class="c">
    <div class="c-title">📁 作成アーカイブ</div>
    <div id="archiveList"><div class="empty">まだ作成した画像はありません</div></div>
  </div>

</div>

<!-- Full-size archive viewer modal -->
<div id="viewerModal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:100;align-items:center;justify-content:center;flex-direction:column;padding:20px;" onclick="closeViewer(event)">
  <img id="viewerImg" style="max-width:100%;max-height:78vh;border-radius:10px;">
  <div style="display:flex;gap:10px;margin-top:16px;">
    <button class="pill" id="viewerShare" style="background:var(--blue);color:#fff;border-color:var(--blue);">📤 保存・共有</button>
    <button class="pill" id="viewerClose" style="background:#fff;">閉じる</button>
  </div>
</div>

<script>
const PHRASES=["📩DMにて割引可能","📩コメント・DMお気軽に","🔥SALE MAX 8%OFF","💰買取で最大10%OFF","✨新入荷","🆕新品未使用","💎美品","📦全国発送可能","⭐️店頭にて販売中","💰お値下げ交渉可","DM for price 📩","SALE UP TO 8% OFF","10% OFF with trade-in","IN STORE NOW","Worldwide shipping 📦","New arrival ✨"];
const esc=s=>String(s||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const today=()=>{const d=new Date();return `${d.getFullYear()}/${d.getMonth()+1}/${d.getDate()}`;};

let photoImg=null, storyArchive=[];
try{storyArchive=JSON.parse(localStorage.getItem("story-archive-v2")||"[]");}catch(e){}
const cv=document.getElementById("storyCanvas"),cx=cv.getContext("2d");

// phrase chips
const pc=document.getElementById("phraseChips");
pc.innerHTML=PHRASES.map(p=>`<span class="chip" onclick="pickPhrase(this)">${esc(p)}</span>`).join("");
window.pickPhrase=function(el){
  document.querySelectorAll("#phraseChips .chip").forEach(c=>c.classList.remove("on"));
  el.classList.add("on");
  document.getElementById("sTag").value=el.textContent;
  drawStory();
};

// bottom text color
const COLORS=[["白","#ffffff"],["黒","#111111"],["赤","#ff2d2d"],["ゴールド","#d4af37"],["ピンク","#ff5fa2"],["水色","#4fc3ff"],["イエロー","#ffd60a"],["グリーン","#34c759"]];
let tagColor="#ffffff";
const cc=document.getElementById("colorChips");
cc.innerHTML=COLORS.map(([name,hex],i)=>`<span class="chip${i===0?" on":""}" onclick="pickColor(this,'${hex}')" style="display:inline-flex;align-items:center;gap:6px;"><span style="width:16px;height:16px;border-radius:50%;background:${hex};border:1px solid #ccc;display:inline-block;"></span>${name}</span>`).join("");
window.pickColor=function(el,hex){
  document.querySelectorAll("#colorChips .chip").forEach(c=>c.classList.remove("on"));
  el.classList.add("on");
  tagColor=hex;
  drawStory();
};

// photo drop
const pd=document.getElementById("photoDrop"),pi=document.getElementById("photoIn");
pd.addEventListener("click",()=>pi.click());
pi.addEventListener("change",e=>{if(e.target.files[0])loadPhoto(e.target.files[0]);pi.value="";});
["dragover","dragenter"].forEach(ev=>pd.addEventListener(ev,e=>{e.preventDefault();pd.style.borderColor="var(--blue)";}));
["dragleave","drop"].forEach(ev=>pd.addEventListener(ev,e=>{e.preventDefault();pd.style.borderColor="var(--line)";}));
pd.addEventListener("drop",e=>{const f=e.dataTransfer.files[0];if(f)loadPhoto(f);});
function loadPhoto(file){
  const fr=new FileReader();
  fr.onload=e=>{const img=new Image();img.onload=()=>{photoImg=img;pd.innerHTML="📷 選択済み ✓";drawStory();};img.src=e.target.result;};
  fr.readAsDataURL(file);
}

// tag scan
const td2=document.getElementById("tagDrop"),ti=document.getElementById("tagIn");
td2.addEventListener("click",()=>ti.click());
ti.addEventListener("change",e=>{if(e.target.files.length)scanTags([...e.target.files]);ti.value="";});
["dragover","dragenter"].forEach(ev=>td2.addEventListener(ev,e=>{e.preventDefault();td2.style.borderColor="var(--blue)";}));
["dragleave","drop"].forEach(ev=>td2.addEventListener(ev,e=>{e.preventDefault();td2.style.borderColor="var(--line)";}));
td2.addEventListener("drop",e=>{const f=[...e.dataTransfer.files];if(f.length)scanTags(f);});

// Scan one or more tag photos (front + back), accumulating results
async function scanTags(files){
  for(let i=0;i<files.length;i++){
    await scanTagQR(files[i], files.length>1?`(${i+1}/${files.length}) `:"");
  }
}

async function scanTagQR(file, prefix){
  prefix=prefix||"";
  const status=document.getElementById("ocrStatus");
  status.style.display="block";
  status.textContent="🔍 "+prefix+"読み取り中...";
  status.style.color="var(--blue)";
  td2.innerHTML="🏷️ 読み取り中...";

  // Show tag photo as reference
  const dataUrl=await new Promise(r=>{const fr=new FileReader();fr.onload=e=>r(e.target.result);fr.readAsDataURL(file);});
  document.getElementById("tagRefImg").src=dataUrl;
  document.getElementById("tagRefArea").style.display="block";

  // Scan QR code from image
  const img=await new Promise(r=>{const i=new Image();i.onload=()=>r(i);i.src=dataUrl;});
  const canvas=document.createElement("canvas");
  canvas.width=img.width;canvas.height=img.height;
  const ctx2=canvas.getContext("2d");
  ctx2.drawImage(img,0,0);
  const imageData=ctx2.getImageData(0,0,canvas.width,canvas.height);
  // Try multiple resolutions for better detection
  let qr=null;
  const sizes=[canvas.width, 1500, 1000, 600];
  for(const sz of sizes){
    if(qr)break;
    const scale=sz/Math.max(img.width,img.height);
    const sw=Math.round(img.width*scale), sh=Math.round(img.height*scale);
    const tc=document.createElement("canvas");tc.width=sw;tc.height=sh;
    const tctx=tc.getContext("2d");
    tctx.drawImage(img,0,0,sw,sh);
    // Also try with inverted colors
    const td3=tctx.getImageData(0,0,sw,sh);
    qr=jsQR(td3.data,sw,sh);
    if(!qr){
      // Try with increased contrast
      const d=td3.data;
      for(let i=0;i<d.length;i+=4){
        let g=0.299*d[i]+0.587*d[i+1]+0.114*d[i+2];
        g=g>128?255:0;
        d[i]=g;d[i+1]=g;d[i+2]=g;
      }
      tctx.putImageData(td3,0,0);
      qr=jsQR(tctx.getImageData(0,0,sw,sh).data,sw,sh);
    }
  }

  let url="";
  if(qr&&qr.data){
    console.log("QR data:",qr.data);
    url=qr.data;
  }else{
    // No QR (accessory/small-item tags) — OCR the product number instead
    status.textContent="🔍 QRなし。商品番号を読み取り中...";
    const pn=await ocrProductNumber(dataUrl);
    if(pn){
      url="https://item.rakuten.co.jp/gsc-rinkan/"+pn;
      console.log("product number → url:",url);
    }
  }

  const filled=[];

  // Always try to read a tax-included price from THIS photo (front of accessory tags,
  // or the price row on clothing tags). Only fill if we find one — never wipe existing.
  status.textContent="🔍 値札から税込価格を読み取り中...";
  const tagPrice=await ocrTagPrice(dataUrl);
  if(tagPrice){document.getElementById("sPrice").value=String(tagPrice);filled.push("価格(値札)");}

  // If we got a Rakuten URL (from QR or product number), pull brand/size/rank/price
  if(url&&url.includes("item.rakuten.co.jp")){
    status.textContent="🔍 楽天ページから商品情報を取得中...";
    status.style.color="var(--blue)";
    const got=await fetchRakuten(url);
    if(got.ok){
      if(got.brand){document.getElementById("sBrand").value=got.brand;filled.push("ブランド");}
      if(got.size){document.getElementById("sSize").value=got.size;filled.push("サイズ");}
      if(got.rank){setRank(got.rank);filled.push("ランク");}
      // Only use Rakuten price if the tag OCR didn't already give one
      if(!tagPrice&&got.price){document.getElementById("sPrice").value=String(got.price);filled.push("価格");}
    }
  }

  drawStory();

  // Report result. Guide the user to scan the other side for accessory tags.
  const missing=[];
  if(!document.getElementById("sBrand").value)missing.push("ブランド");
  if(!document.getElementById("sPrice").value)missing.push("価格");
  if(filled.length){
    td2.innerHTML="🏷️ もう一度タップで別の面をスキャン";
    let msg='✓ '+filled.join("・")+'を入力しました';
    if(missing.length)msg+='<br><span style="color:var(--orange);font-size:12px;">まだ'+missing.join("・")+'が未入力。小物は<b>裏面（商品番号）と表面（税込金額）の両方</b>をスキャンしてください。</span>';
    if(url)msg+='<br><a href="'+url+'" target="_blank" style="color:var(--blue);font-weight:700;font-size:12px;text-decoration:underline;">楽天ページを確認</a>';
    status.innerHTML=msg;
    status.style.color="var(--green)";
  }else{
    td2.innerHTML="🏷️ 読み取れず（もう一度/手入力）";
    status.innerHTML='⚠ この面からは読み取れませんでした。<br><span style="font-size:12px;color:var(--t2);">小物タグは<b>表面（税込金額）</b>と<b>裏面（商品番号）</b>の2面をそれぞれスキャンしてください。ピントを合わせて明るく撮るのがコツです。</span>';
    status.style.color="var(--orange)";
  }
  status.style.display="block";
}

// OCR the RINKAN product number (format: 5digits-6digits-4digits) from tag photo.
// Used for tags that have no QR code (accessories / small items).
async function ocrProductNumber(dataUrl){
  try{
    const img=await new Promise(r=>{const i=new Image();i.onload=()=>r(i);i.src=dataUrl;});
    // OCR the whole tag at high resolution; the number is small printed text
    const sc=Math.min(2600/Math.max(img.width,img.height),2);
    const cv=document.createElement("canvas");
    cv.width=Math.round(img.width*sc);cv.height=Math.round(img.height*sc);
    const c2=cv.getContext("2d");
    c2.imageSmoothingQuality="high";
    c2.drawImage(img,0,0,cv.width,cv.height);
    // contrast boost
    const idd=c2.getImageData(0,0,cv.width,cv.height);const d=idd.data;
    for(let i=0;i<d.length;i+=4){let g=0.299*d[i]+0.587*d[i+1]+0.114*d[i+2];g=g>135?255:0;d[i]=d[i+1]=d[i+2]=g;}
    c2.putImageData(idd,0,0);
    const res=await Tesseract.recognize(cv,"eng",{tessedit_pageseg_mode:"6"});
    const text=res.data.text;
    console.log("Product-number OCR:",JSON.stringify(text));
    // RINKAN product number: 5-6-4 digits
    const m=text.match(/(\d{5}[-–]\d{6}[-–]\d{4})/);
    if(m)return m[1].replace(/–/g,"-");
    return "";
  }catch(e){console.log("product number OCR error:",e);return "";}
}

// OCR the tax-included price from the RINKAN tag photo
// Tax-included = the comma-formatted price on a line WITHOUT "exc.tax"
async function ocrTagPrice(dataUrl){
  try{
    const img=await new Promise(r=>{const i=new Image();i.onload=()=>r(i);i.src=dataUrl;});
    // Crop the lower-right area where both prices are printed
    const cx=Math.round(img.width*0.36), cy=Math.round(img.height*0.38);
    const cw=Math.round(img.width*0.62), ch=Math.round(img.height*0.36);
    // Try multiple thresholds; collect the first that yields a valid tax-included price
    const thresholds=[135,120,150,105];
    let best=0, bestAll=0;
    for(const thr of thresholds){
      const cv=document.createElement("canvas");
      const sc=3; // higher upscale = better digit recognition
      cv.width=cw*sc;cv.height=ch*sc;
      const c2=cv.getContext("2d");
      c2.imageSmoothingEnabled=true;c2.imageSmoothingQuality="high";
      c2.drawImage(img,cx,cy,cw,ch,0,0,cw*sc,ch*sc);
      const idd=c2.getImageData(0,0,cv.width,cv.height);const d=idd.data;
      for(let i=0;i<d.length;i+=4){let g=0.299*d[i]+0.587*d[i+1]+0.114*d[i+2];g=g>thr?255:0;d[i]=d[i+1]=d[i+2]=g;}
      c2.putImageData(idd,0,0);
      // No whitelist — restrictive whitelists corrupt digit recognition. Use psm 6.
      const res=await Tesseract.recognize(cv,"eng",{tessedit_pageseg_mode:"6"});
      const text=res.data.text;
      console.log("Tag OCR thr="+thr+":",JSON.stringify(text));
      const taxIncluded=[],allPrices=[];
      for(const ln of text.split("\n")){
        const isExTax=/exc|tax|税抜|外/i.test(ln);
        // Comma-formatted price like 181,500 or 1,699,500
        const nums=[...ln.matchAll(/(\d{1,3}(?:,\d{3})+)/g)].map(m=>Number(m[1].replace(/,/g,""))).filter(n=>n>=1000&&n<100000000);
        for(const n of nums){allPrices.push(n);if(!isExTax)taxIncluded.push(n);}
      }
      if(taxIncluded.length){best=Math.max(...taxIncluded);break;}
      if(allPrices.length&&!bestAll)bestAll=Math.max(...allPrices);
    }
    const result=best||bestAll||0;
    console.log("price result:",result);
    return result;
  }catch(e){console.log("tag OCR error:",e);return 0;}
}

// Fetch Rakuten product page and extract info (brand-English, size, rank, price)
async function fetchRakuten(url){
  const proxies=[
    u=>"https://api.allorigins.win/raw?url="+encodeURIComponent(u),
    u=>"https://corsproxy.io/?url="+encodeURIComponent(u),
    u=>"https://api.codetabs.com/v1/proxy/?quest="+encodeURIComponent(u)
  ];
  let html2="";
  for(const mk of proxies){
    try{
      const resp=await fetch(mk(url),{signal:AbortSignal.timeout(9000)});
      if(resp&&resp.ok){const t=await resp.text();if(t&&t.length>500){html2=t;break;}}
    }catch(e){console.log("proxy fail:",e.message);}
  }
  if(!html2)return{ok:false};

  const out={ok:true,brand:"",size:"",rank:"",price:0};

  // Gather title from multiple sources (og:title is usually cleanest)
  let title="";
  const ogT=html2.match(/<meta[^>]*property=["']og:title["'][^>]*content=["']([^"']+)["']/i);
  if(ogT)title=ogT[1];
  if(!title){const tM=html2.match(/<title[^>]*>([^<]+)<\/title>/i);if(tM)title=tM[1];}
  title=title.replace(/【楽天市場】/g,"").replace(/｜.*$/,"").trim();
  console.log("Rakuten title:",title);

  // Also grab full product name area for pattern matching (title + description)
  let searchText=title;
  const descM=html2.match(/<meta[^>]*name=["']description["'][^>]*content=["']([^"']+)["']/i);
  if(descM)searchText+=" "+descM[1];

  // RANK: RINKAN uses "#rinkan*X" format
  const rkM=html2.match(/#rinkan\*([SABCD])/i)||searchText.match(/#rinkan\*([SABCD])/i)||searchText.match(/rinkan[*＊]?\s*([SABCD])\b/i);
  if(rkM)out.rank=rkM[1].toUpperCase();

  // SIZE: "サイズ:XX" format
  const szM=searchText.match(/サイズ[:：]\s*([A-Za-z0-9.\/]+)/);
  if(szM&&szM[1].length<=6)out.size=szM[1];

  // BRAND (English): RINKAN title starts with "カタカナ英語ブランド Englishブランド ..."
  // Use known-brand dictionary for clean names
  const brandMap={
    "クロムハーツ":"CHROME HEARTS","ゴローズ":"goro's","エルメス":"HERMES",
    "ルイヴィトン":"LOUIS VUITTON","ルイ・ヴィトン":"LOUIS VUITTON","シュプリーム":"SUPREME",
    "バレンシアガ":"BALENCIAGA","ディオール":"DIOR","グッチ":"GUCCI","プラダ":"PRADA",
    "セリーヌ":"CELINE","ロエベ":"LOEWE","サンローラン":"SAINT LAURENT","フェンディ":"FENDI",
    "ボッテガヴェネタ":"BOTTEGA VENETA","ボッテガ":"BOTTEGA VENETA","モンクレール":"MONCLER",
    "バーバリー":"BURBERRY","リックオウエンス":"RICK OWENS","アミリ":"AMIRI","エイミリ":"AMIRI",
    "メゾンマルジェラ":"MAISON MARGIELA","マルジェラ":"MAISON MARGIELA","ヴェトモン":"VETEMENTS",
    "ロレックス":"ROLEX","カルティエ":"CARTIER","ティファニー":"TIFFANY & CO.","オフホワイト":"OFF-WHITE",
    "ネイバーフッド":"NEIGHBORHOOD","ステューシー":"STUSSY","パレス":"PALACE","アンブッシュ":"AMBUSH",
    "ヴァンクリーフ":"VAN CLEEF & ARPELS","ブルガリ":"BVLGARI","シャネル":"CHANEL","オメガ":"OMEGA",
    "パテックフィリップ":"PATEK PHILIPPE","オーデマピゲ":"AUDEMARS PIGUET","ヴァシュロンコンスタンタン":"VACHERON CONSTANTIN",
    "ジバンシー":"GIVENCHY","バンズ":"VANS","ナイキ":"NIKE","ニューバランス":"NEW BALANCE",
    "アークテリクス":"ARC'TERYX","ストーンアイランド":"STONE ISLAND","アップルウォッチ":"APPLE WATCH",
    "ウブロ":"HUBLOT","タグホイヤー":"TAG HEUER","IWC":"IWC","パネライ":"PANERAI","ブライトリング":"BREITLING",
    "アクネストゥディオズ":"ACNE STUDIOS","アクネ":"ACNE STUDIOS","マルタンマルジェラ":"MAISON MARGIELA",
    "コムデギャルソン":"COMME des GARCONS","イヴサンローラン":"SAINT LAURENT","イブサンローラン":"SAINT LAURENT",
    "アレキサンダーマックイーン":"ALEXANDER McQUEEN","トムブラウン":"THOM BROWNE","ヨウジヤマモト":"YOHJI YAMAMOTO",
    "アンダーカバー":"UNDERCOVER","ワコマリア":"WACKO MARIA","ヒステリックグラマー":"HYSTERIC GLAMOUR",
    "エンノイ":"ENNOY","エフシーアールビー":"F.C.Real Bristol","フラグメント":"fragment design",
    "キャピタル":"KAPITAL","サカイ":"sacai","ジュンヤワタナベ":"JUNYA WATANABE","カラー":"kolor",
    "ニードルス":"Needles","エムエムシックス":"MM6","ジルサンダー":"JIL SANDER","マルニ":"MARNI",
    "ドリスヴァンノッテン":"DRIES VAN NOTEN","ラフシモンズ":"RAF SIMONS","ヴィヴィアンウエストウッド":"Vivienne Westwood",
    "ディースクエアード":"DSQUARED2","ヴァレンティノ":"VALENTINO","フェラガモ":"Salvatore Ferragamo",
    "トッズ":"TOD'S","コーチ":"COACH","マイケルコース":"MICHAEL KORS","トリーバーチ":"TORY BURCH",
    "ケンゾー":"KENZO","イッセイミヤケ":"ISSEY MIYAKE","ポールスミス":"Paul Smith","エトロ":"ETRO",
    "モンブラン":"MONTBLANC","グッチ":"GUCCI","ゼニア":"Ermenegildo Zegna","ブリオーニ":"BRIONI",
    "オーラリー":"AURALEE","コモリ":"COMOLI","グラフペーパー":"Graphpaper","ヒューマンメイド":"HUMAN MADE",
    "ガールズドントクライ":"Girls Don't Cry","ヴァーディ":"Verdy","ノースフェイス":"THE NORTH FACE",
    "パタゴニア":"patagonia","カナダグース":"CANADA GOOSE","モンクレールジーニアス":"MONCLER GENIUS",
    "ディオールオム":"Dior Homme","バルマン":"BALMAIN","ケイタマルヤマ":"KEITA MARUYAMA",
    "エンポリオアルマーニ":"EMPORIO ARMANI","ジョルジオアルマーニ":"GIORGIO ARMANI","アルマーニ":"ARMANI"
  };
  // Match leading katakana brand — longest match first (so ボッテガヴェネタ beats ボッテガ)
  const sortedJp=Object.keys(brandMap).sort((a,b)=>b.length-a.length);
  for(const jp of sortedJp){
    if(title.startsWith(jp)){out.brand=brandMap[jp];break;}
  }
  // If dictionary hit, still verify against the title's own English (RINKAN always
  // prints "カタカナ English" — the English there is authoritative for spelling/multi-word)
  {
    const afterJp=title.match(/^[\u3040-\u30FF\u4E00-\u9FFF・ー]+[\s　]+(.+)/);
    if(afterJp){
      const words=afterJp[1].split(/[\s　]+/);
      const brandWords=[];
      let allCapsRun=0;
      for(const w of words){
        if(/[\u3040-\u30FF\u4E00-\u9FFF]/.test(w))break;   // hit Japanese → brand ended
        if(/サイズ|size/i.test(w))break;
        if(/\d/.test(w))break;                             // model codes contain digits
        if(!/^[A-Za-z][A-Za-z'&.\-]*$/.test(w)&&w!=="&"&&w!=="des"&&w!=="by")break;
        // Detect model-code run: short ALL-CAPS tokens (PT, TNY, CRSF...) appearing after
        // we already have a brand word. Two such in a row = model codes, stop.
        const isShortCaps=/^[A-Z]{2,4}$/.test(w);
        if(brandWords.length>=1&&isShortCaps){allCapsRun++;if(allCapsRun>=1)break;}
        else allCapsRun=0;
        brandWords.push(w);
        if(brandWords.length>=4)break;                     // brands rarely exceed 4 words
      }
      if(brandWords.length){
        const titleBrand=brandWords.join(" ");
        if(!out.brand || titleBrand.split(" ").length>out.brand.split(" ").length){
          out.brand=titleBrand;
        }
      }
    }
  }
  // Structured-data brand as another fallback
  if(!out.brand){
    const sdBrand=html2.match(/itemprop=["']brand["'][^>]*>[\s\S]{0,120}?itemprop=["']name["'][^>]*content=["']([^"']+)["']/i)
      ||html2.match(/"brand"\s*:\s*{[^}]*"name"\s*:\s*"([^"]+)"/i)
      ||html2.match(/"brand"\s*:\s*"([^"]+)"/i);
    if(sdBrand)out.brand=sdBrand[1].trim();
  }
  // Absolute last resort: first English phrase
  if(!out.brand){
    const eng=title.match(/[A-Z][A-Za-z'&.\-]+(?:\s+[A-Z][A-Za-z'&.\-]+)?/);
    if(eng)out.brand=eng[0];
  }

  // PRICE: try JSON-LD first, then patterns
  try{
    const lds=[...html2.matchAll(/<script[^>]*type=["']application\/ld\+json["'][^>]*>([\s\S]*?)<\/script>/gi)];
    for(const m of lds){
      let data;try{data=JSON.parse(m[1].trim());}catch(e){continue;}
      const arr=Array.isArray(data)?data:[data];
      for(const d of arr){
        const off=d.offers?(Array.isArray(d.offers)?d.offers[0]:d.offers):null;
        if(off&&off.price){const p=Number(String(off.price).replace(/[^\d]/g,""));if(p>=100)out.price=p;}
      }
    }
  }catch(e){}
  if(!out.price){
    const pats=[/itemprice["'\s:]*(\d[\d,]{3,})/i,/税込[^\d]{0,6}(\d[\d,]{3,})/,/"price"\s*:\s*"?(\d[\d,]{3,})/i,/(\d{2,3},\d{3})\s*円/];
    for(const pt of pats){const m=html2.match(pt);if(m){const p=Number(m[1].replace(/,/g,""));if(p>=1000&&p<100000000){out.price=p;break;}}}
  }

  return out;
}


function drawStory(){
  const W=1080,H=1920;
  cx.clearRect(0,0,W,H);
  if(photoImg){
    const s=Math.max(W/photoImg.width,H/photoImg.height);
    const w=photoImg.width*s,h=photoImg.height*s;
    cx.drawImage(photoImg,(W-w)/2,(H-h)/2,w,h);
  }else{
    cx.fillStyle="#1d1d1f";cx.fillRect(0,0,W,H);
    cx.fillStyle="#aeaeb2";cx.font="500 36px sans-serif";cx.textAlign="center";
    cx.fillText("写真を選択してください",W/2,H/2);cx.textAlign="left";
  }
  const g1=cx.createLinearGradient(0,0,0,500);
  g1.addColorStop(0,"rgba(0,0,0,.45)");g1.addColorStop(1,"rgba(0,0,0,0)");
  cx.fillStyle=g1;cx.fillRect(0,0,W,500);
  const g2=cx.createLinearGradient(0,H-560,0,H);
  g2.addColorStop(0,"rgba(0,0,0,0)");g2.addColorStop(1,"rgba(0,0,0,.5)");
  cx.fillStyle=g2;cx.fillRect(0,H-560,W,560);
  cx.fillStyle="#fff";cx.shadowColor="rgba(0,0,0,.5)";cx.shadowBlur=16;
  const serif="'Hiragino Mincho ProN','Yu Mincho',serif";
  const brand=document.getElementById("sBrand").value.trim();
  const size=document.getElementById("sSize").value.trim();
  const rank=document.getElementById("sRank").value.trim();
  const price=document.getElementById("sPrice").value.replace(/[^\d]/g,"");
  const tag=document.getElementById("sTag").value.trim();
  let y=220;
  if(brand){cx.font=`500 72px ${serif}`;cx.fillText(brand,70,y);y+=86;}
  if(size){cx.font=`500 58px ${serif}`;cx.fillText("size:"+size,70,y);y+=74;}
  if(rank){cx.font=`500 58px ${serif}`;cx.fillText("RANK:"+rank,70,y);}
  if(price){cx.font=`500 74px ${serif}`;cx.fillText("¥"+Number(price).toLocaleString("ja-JP")+"-(tax in)",70,H-280);}
  if(tag){cx.fillStyle=tagColor;cx.font=`600 70px ${serif}`;const tw=cx.measureText(tag).width;cx.fillText(tag,W-tw-60,H-190);}
  cx.shadowBlur=0;
}
["sBrand","sSize","sPrice","sTag"].forEach(id=>document.getElementById(id).addEventListener("input",drawStory));
function setRank(r){
  document.getElementById("sRank").value=r||"";
  document.querySelectorAll("#rankSeg button").forEach(b=>b.classList.toggle("on",b.dataset.r===r));
  drawStory();
}
document.querySelectorAll("#rankSeg button").forEach(b=>{
  b.addEventListener("click",()=>{
    const cur=document.getElementById("sRank").value;
    setRank(cur===b.dataset.r?"":b.dataset.r); // tap again to deselect
  });
});

function updateBrandDl(){
  const brands=[...new Set(storyArchive.map(a=>a.brand).filter(Boolean))].sort();
  document.getElementById("sBrandDl").innerHTML=brands.map(b=>`<option value="${esc(b)}">`).join("");
}

// share (1-tap save on iOS) - now saves FULL image in archive
document.getElementById("shareBtn").addEventListener("click",async()=>{
  drawStory();
  const brand=document.getElementById("sBrand").value.trim()||"story";
  const fname=`story_${brand}_${Date.now()}.png`;
  try{
    const blob=await new Promise(r=>cv.toBlob(r,"image/png"));
    const file=new File([blob],fname,{type:"image/png"});
    if(navigator.share&&navigator.canShare&&navigator.canShare({files:[file]})){
      await navigator.share({files:[file],title:fname});
      archiveStory(brand);
      tick("✓ 共有しました");
    }else{
      const a=document.createElement("a");a.download=fname;a.href=cv.toDataURL("image/png");a.click();
      archiveStory(brand);tick("✓ ダウンロードしました");
    }
  }catch(e){if(e.name!=="AbortError")console.error(e);}
});
document.getElementById("dlBtn").addEventListener("click",()=>{
  drawStory();
  const brand=document.getElementById("sBrand").value.trim()||"story";
  const a=document.createElement("a");a.download=`story_${brand}_${Date.now()}.png`;a.href=cv.toDataURL("image/png");a.click();
  archiveStory(brand);
});
function tick(msg){const t=document.getElementById("shareTick");t.textContent=msg;t.style.opacity="1";setTimeout(()=>t.style.opacity="0",2500);}

function archiveStory(brand){
  const thumb=document.createElement("canvas");
  thumb.width=180;thumb.height=320;
  thumb.getContext("2d").drawImage(cv,0,0,180,320);
  // Save full image (compressed JPEG) so it can be viewed/re-shared later
  const full=cv.toDataURL("image/jpeg",0.75);
  storyArchive.unshift({brand,date:today(),thumb:thumb.toDataURL("image/jpeg",0.6),full});
  if(storyArchive.length>40)storyArchive=storyArchive.slice(0,40);
  try{localStorage.setItem("story-archive-v2",JSON.stringify(storyArchive));}catch(e){
    // storage full - trim and retry
    storyArchive=storyArchive.slice(0,20);
    try{localStorage.setItem("story-archive-v2",JSON.stringify(storyArchive));}catch(e2){}
  }
  renderArchive();updateBrandDl();
}
function renderArchive(){
  const el=document.getElementById("archiveList");
  if(!storyArchive.length){el.innerHTML='<div class="empty">まだ作成した画像はありません</div>';return;}
  el.innerHTML='<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(90px,1fr));gap:12px;">'+
    storyArchive.map((a,i)=>`<div class="arch-item" onclick="openViewer(${i})">
      <img src="${a.thumb}">
      <div style="font-size:10px;color:var(--t3);margin-top:5px;font-weight:500;">${esc(a.brand)}<br>${a.date}</div>
    </div>`).join("")+'</div>';
}

// Full-size viewer — materializes with blur+scale, dismisses along the same path
let viewerIdx=-1;
window.openViewer=function(i){
  viewerIdx=i;
  const a=storyArchive[i];
  const m=document.getElementById("viewerModal"),im=document.getElementById("viewerImg");
  im.src=a.full||a.thumb;
  m.style.display="flex";
  im.style.transform="scale(.88)";im.style.opacity="0";
  requestAnimationFrame(()=>{m.classList.add("show");im.style.transform="scale(1)";im.style.opacity="1";});
};
window.closeViewer=function(e){
  if(e&&e.target.id!=="viewerModal"&&e.target.id!=="viewerClose")return;
  dismissViewer();
};
function dismissViewer(){
  const m=document.getElementById("viewerModal"),im=document.getElementById("viewerImg");
  m.classList.remove("show");
  im.style.transform="scale(.88)";im.style.opacity="0";
  setTimeout(()=>{m.style.display="none";},320);
}
document.getElementById("viewerClose").addEventListener("click",dismissViewer);
document.getElementById("viewerShare").addEventListener("click",async()=>{
  const a=storyArchive[viewerIdx];if(!a)return;
  try{
    const blob=await(await fetch(a.full||a.thumb)).blob();
    const file=new File([blob],`story_${a.brand}_${a.date}.jpg`,{type:"image/jpeg"});
    if(navigator.share&&navigator.canShare&&navigator.canShare({files:[file]})){
      await navigator.share({files:[file]});
    }else{
      const dl=document.createElement("a");dl.download=file.name;dl.href=a.full||a.thumb;dl.click();
    }
  }catch(e){if(e.name!=="AbortError")console.error(e);}
});

updateBrandDl();renderArchive();drawStory();
</script>
