<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#f5f5f7">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>タスク集計｜RINKAN渋谷</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
<style>
:root{
  --bg:#f5f5f7;--card:#fff;--card2:#f9f9fb;--line:#e8e8ed;--line2:#d2d2d7;
  --t1:#1d1d1f;--t2:#6e6e73;--t3:#aeaeb2;
  --blue:#007aff;--green:#34c759;--orange:#ff9500;--red:#ff3b30;--pink:#ff2d55;--purple:#af52de;--teal:#5ac8fa;
  --font:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
body{background:var(--bg);color:var(--t1);font-family:var(--font);font-size:15px;
  padding-bottom:calc(66px + env(safe-area-inset-bottom));}
.w{max-width:720px;margin:0 auto;padding:16px 16px 30px;}

/* header */
.hd{display:flex;justify-content:space-between;align-items:center;padding:10px 0 18px;}
.hd h1{font-size:28px;font-weight:800;letter-spacing:-.02em;}
.hd .sub{font-size:13px;color:var(--t2);margin-top:2px;}
.pill{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:7px 14px;font-size:13px;font-weight:600;color:var(--t1);cursor:pointer;font-family:var(--font);}

/* cards */
.c{background:var(--card);border-radius:16px;padding:16px;margin-bottom:12px;
  box-shadow:0 0.5px 1px rgba(0,0,0,.04),0 1px 3px rgba(0,0,0,.06);}
.c-title{font-size:13px;font-weight:700;color:var(--t2);margin-bottom:14px;letter-spacing:.01em;}
.sep{height:1px;background:var(--line);margin:16px 0;}
.sep-label{font-size:11px;font-weight:700;color:var(--t3);letter-spacing:.1em;margin-bottom:10px;}

/* stepper grid */
.sg{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;}
@media(max-width:520px){.sg{grid-template-columns:repeat(2,1fr);}}
.si{background:var(--card2);border-radius:14px;padding:12px;text-align:center;position:relative;}
.si .label{font-size:10.5px;font-weight:600;color:var(--t2);margin-bottom:8px;letter-spacing:.02em;}
.si .val{font-size:28px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--t1);min-height:36px;line-height:36px;}
.si .btns{display:flex;justify-content:center;gap:8px;margin-top:8px;}
.si .btns button{
  width:44px;height:44px;border-radius:50%;border:none;font-size:22px;font-weight:600;
  cursor:pointer;font-family:var(--font);display:flex;align-items:center;justify-content:center;
  transition:transform .1s;touch-action:manipulation;-webkit-user-select:none;user-select:none;
}
.si .btns button:active{transform:scale(.9);}
.si .btns .minus{background:#f0f0f5;color:var(--t2);}
.si .btns .plus{background:var(--blue);color:#fff;}
.si.pink .btns .plus{background:var(--pink);}
.si.orange .btns .plus{background:var(--orange);}
.si.green .btns .plus{background:var(--green);}
.si.purple .btns .plus{background:var(--purple);}
.si.teal .btns .plus{background:var(--teal);}
/* amount input inline */
.si .amt-input{
  width:90%;margin:6px auto 0;padding:6px;border-radius:8px;border:1px solid var(--line);
  background:#fff;font-size:16px;text-align:center;font-variant-numeric:tabular-nums;
  font-family:var(--font);color:var(--t1);
}
.insight-period{background:var(--card2);border-radius:12px;padding:12px 14px;}
.insight-period input[type=date]{
  padding:9px;border-radius:9px;border:1px solid var(--line);background:#fff;
  font-family:var(--font);font-size:14px;color:var(--t1);
}

/* save button */
.save-btn{
  width:100%;padding:16px;border-radius:14px;border:none;
  background:var(--blue);color:#fff;font-size:17px;font-weight:700;
  cursor:pointer;font-family:var(--font);margin-top:16px;
  transition:opacity .15s;
}
.save-btn:disabled{opacity:.4;}
.save-btn:active:not(:disabled){opacity:.7;}
.save-tick{text-align:center;font-size:14px;color:var(--green);font-weight:600;opacity:0;transition:opacity .4s;margin-top:8px;}

/* today table */
.today-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;}
table{width:100%;border-collapse:collapse;font-size:12px;white-space:nowrap;}
th{padding:8px 10px;text-align:left;font-size:10.5px;font-weight:600;color:var(--t3);border-bottom:1px solid var(--line);background:var(--card);}
td{padding:9px 10px;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums;}
td.name{font-weight:700;}
tr:last-child td{border-bottom:none;}
.chip-row{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px;}
.subtabs{display:flex;gap:6px;margin-bottom:14px;background:var(--card2);padding:4px;border-radius:12px;}
.subtabs .subtab{flex:1;border:none;background:none;font-family:var(--font);font-size:13px;font-weight:700;color:var(--t2);padding:10px 6px;border-radius:9px;cursor:pointer;touch-action:manipulation;white-space:nowrap;}
.subtabs .subtab.on{background:var(--card);color:var(--t1);box-shadow:0 1px 3px rgba(0,0,0,.08);}
.kchip{display:inline-flex;align-items:center;gap:4px;padding:6px 12px;border-radius:10px;background:var(--card2);font-size:12px;font-weight:600;}
.kchip b{font-size:15px;color:var(--t1);}
.kchip.pk{background:#fff0f3;color:var(--pink);}
.kchip.bl{background:#e8f4ff;color:var(--blue);}

/* chart tabs */
.ctabs{display:flex;background:var(--card2);border-radius:10px;padding:3px;gap:2px;margin-bottom:14px;}
.ctab{flex:1;text-align:center;padding:8px 6px;font-size:12px;font-weight:600;color:var(--t2);border-radius:8px;cursor:pointer;font-family:var(--font);border:none;background:none;}
.ctab.on{background:var(--card);color:var(--t1);box-shadow:0 1px 3px rgba(0,0,0,.08);}
.cpanel{display:none;}
.cpanel.on{display:block;}
.toolbar{display:flex;gap:6px;margin-bottom:10px;}
.toolbar select{padding:7px 10px;border-radius:8px;border:1px solid var(--line);background:var(--card);font-size:12px;color:var(--t1);font-family:var(--font);}

/* bottom nav */
#nav{
  position:fixed;left:0;right:0;bottom:0;z-index:40;
  height:calc(66px + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);
  background:rgba(255,255,255,.88);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  border-top:0.5px solid var(--line2);display:flex;
}
#nav button{
  flex:1;border:none;background:none;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  font-size:10px;font-weight:600;color:var(--t3);font-family:var(--font);
}
#nav button.on{color:var(--blue);}
#nav button .ico{font-size:22px;}
.vw{display:none;}
.vw.on{display:block;}

/* modal */
.ov{display:none;position:fixed;inset:0;background:rgba(0,0,0,.3);z-index:60;align-items:center;justify-content:center;}
.mb{background:#fff;border-radius:18px;padding:24px;max-width:320px;width:88%;}
.mb h3{font-size:17px;font-weight:800;margin-bottom:14px;}
.mb select{width:100%;padding:12px;border-radius:12px;border:1px solid var(--line);font-size:16px;margin-bottom:16px;font-family:var(--font);background:var(--card2);}
.mb .acts{display:flex;gap:8px;justify-content:flex-end;}
.mb .acts button{padding:10px 20px;border-radius:10px;font-size:14px;font-weight:700;cursor:pointer;font-family:var(--font);border:none;}
.mb .acts .cancel{background:var(--card2);color:var(--t2);}
.mb .acts .ok{background:var(--blue);color:#fff;}
#errBanner{display:none;background:#fff0f0;border:1px solid #fecaca;color:var(--red);border-radius:12px;padding:12px;margin-bottom:12px;font-size:13px;}
.empty{text-align:center;padding:28px;color:var(--t3);font-size:13px;}
</style>
</head>
<body>

<div class="ov" id="nameOv">
  <div class="mb">
    <h3>名前を選択</h3>
    <select id="nameSel"></select>
    <div class="acts">
      <button class="cancel" id="nameCancel">キャンセル</button>
      <button class="ok" id="nameOk">決定</button>
    </div>
  </div>
</div>

<div class="w">

<div class="hd">
  <div>
    <h1>タスク集計</h1>
    <div class="sub" id="dayLabel"></div>
  </div>
  <button class="pill" id="badge">👤 —</button>
</div>
<div id="errBanner"></div>

<!-- ===== INPUT ===== -->
<div class="vw on" id="vw-input">
  <div class="c">
    <div class="c-title">📅 日付</div>
    <input type="date" id="inDate" style="width:100%;padding:12px;border-radius:12px;border:1px solid var(--line);font-size:16px;background:var(--card2);font-family:var(--font);">
  </div>

  <div class="c">
    <div class="c-title">店頭タスク</div>
    <div class="sg" id="sgStore"></div>
  </div>

  <div class="c">
    <div class="c-title">📸 個人インスタ</div>
    <div class="sg" id="sgInsta"></div>
  </div>

  <div class="c">
    <div class="c-title">📈 インサイト</div>
    <p style="font-size:12px;color:var(--t2);margin:0 0 12px;line-height:1.5;">当日のインサイトは確定していないため、<b>実際に見られる最新2日間</b>の数字を入力し、その対象期間を選んでください。</p>
    <div class="insight-period">
      <label style="font-size:12px;font-weight:600;color:var(--t2);">対象期間</label>
      <div style="display:flex;align-items:center;gap:8px;margin-top:6px;">
        <input type="date" id="insightFrom" style="flex:1;">
        <span style="color:var(--t3);">〜</span>
        <input type="date" id="insightTo" style="flex:1;">
        <button type="button" id="insightAuto" style="border:none;background:var(--card2);color:var(--blue);font-family:var(--font);font-size:12px;font-weight:700;padding:9px 12px;border-radius:9px;cursor:pointer;touch-action:manipulation;white-space:nowrap;">最新2日間</button>
      </div>
    </div>
    <div class="sg" id="sgInsight" style="margin-top:14px;"></div>
  </div>

  <button class="save-btn" id="saveBtn">保存する</button>
  <div class="save-tick" id="saveTick">✓ 保存しました</div>
</div>

<!-- ===== TODAY ===== -->
<div class="vw" id="vw-today">
  <div class="c">
    <div class="c-title" id="todayTitle" style="display:flex;align-items:center;justify-content:space-between;gap:10px;"><span id="todayTitleText">本日の入力状況</span>
      <div style="display:flex;gap:8px;flex-shrink:0;">
        <button id="csvToday" style="border:none;background:var(--card2);color:var(--green);font-family:var(--font);font-size:13px;font-weight:700;padding:8px 12px;border-radius:10px;cursor:pointer;touch-action:manipulation;">⬇ CSV</button>
        <button id="reloadToday" style="border:none;background:var(--card2);color:var(--blue);font-family:var(--font);font-size:13px;font-weight:700;padding:8px 12px;border-radius:10px;cursor:pointer;touch-action:manipulation;">🔄 更新</button>
      </div>
    </div>
    <div class="chip-row" id="chips"></div>
    <div id="todayCards"></div>
  </div>
</div>

<!-- ===== MONTHLY ===== -->
<div class="vw" id="vw-month">
  <div class="c">
    <div class="c-title">📅 月別集計</div>
    <div style="display:flex;gap:8px;margin-bottom:14px;align-items:center;">
      <button class="pill" id="monthPrev" style="padding:8px 14px;">◀</button>
      <span id="monthLabel" style="font-size:18px;font-weight:800;flex:1;text-align:center;"></span>
      <button class="pill" id="monthNext" style="padding:8px 14px;">▶</button>
    </div>
    <!-- sub-tabs: store tasks / instagram / insight -->
    <div class="subtabs" id="monthSubtabs">
      <button class="subtab on" data-sub="store">🏬 店頭タスク</button>
      <button class="subtab" data-sub="insta">📱 インスタ</button>
      <button class="subtab" data-sub="insight">📈 インサイト</button>
    </div>
    <div class="chip-row" id="monthChips"></div>
    <div id="monthStorePane">
      <div class="today-scroll"><table>
        <thead><tr id="monthHead"></tr></thead>
        <tbody id="monthBody"></tbody>
        <tfoot id="monthFoot"></tfoot>
      </table></div>
      <div style="margin-top:14px;">
        <div class="c-title">日別推移（選択月）</div>
        <canvas id="chMonth" height="140"></canvas>
      </div>
    </div>
    <div id="monthInstaPane" style="display:none;"></div>
    <div id="monthInsightPane" style="display:none;"></div>
  </div>
</div>

<!-- ===== CHARTS ===== -->
<div class="vw" id="vw-chart">
  <div class="c">
    <div class="ctabs">
      <button class="ctab on" data-ct="store">店頭</button>
      <button class="ctab" data-ct="insta">📸 個人</button>
      
    </div>
    <div class="cpanel on" id="cp-store">
      <div class="toolbar">
        <select id="mStore"><option value="approach">アプローチ</option><option value="service">接客人数</option><option value="hold">ありあり取置</option><option value="kaitoriHold">なしなし取置</option><option value="contact">連絡先</option><option value="kobutsu">クーポン(古物)</option><option value="kaitori">買取概算</option></select>
        <select id="rStore"><option value="14">14日</option><option value="30" selected>30日</option><option value="90">90日</option></select>
        <select id="dStore"><option value="total">全体</option><option value="staff">担当者別</option></select>
      </div>
      <canvas id="chStore" height="140"></canvas>
    </div>
    <div class="cpanel" id="cp-insta">
      <div class="toolbar">
        <select id="mInsta"><option value="instaDM">DM</option><option value="instaInquirySales">販売問合</option><option value="instaInquiryBuy">買取問合</option><option value="instaSaleClients">販売客数</option><option value="instaSaleItems">販売点数</option><option value="instaSaleAmount">販売金額</option><option value="instaBuyClients">買取客数</option><option value="instaBuyItems">買取点数</option></select>
        <select id="rInsta"><option value="14">14日</option><option value="30" selected>30日</option><option value="90">90日</option></select>
        <select id="dInsta"><option value="total">全体</option><option value="staff">担当者別</option></select>
      </div>
      <canvas id="chInsta" height="140"></canvas>
    </div>
    
  <div class="c">
    <div class="c-title">🏆 ランキング</div>
    <div class="toolbar">
      <select id="rkM"><optgroup label="店頭"><option value="approach">アプローチ</option><option value="service">接客</option></optgroup><optgroup label="個人インスタ"><option value="instaSaleAmount">個人販売金額</option></optgroup></select>
      <select id="rkR"><option value="14">14日</option><option value="30" selected>30日</option><option value="90">90日</option></select>
    </div>
    <canvas id="chRank" height="140"></canvas>
  </div>
</div>

</div>

<div id="nav">
  <button class="on" data-v="input"><span class="ico">✏️</span>入力</button>
  <button data-v="today"><span class="ico">📋</span>本日</button>
  <button data-v="month"><span class="ico">📅</span>月別</button>
  <button data-v="chart"><span class="ico">📈</span>推移</button>
</div>

<script>
const GH_OWNER="2002ogariku-design",GH_REPO="yoyaku",GH_PATH="shibuya-tk/kpi-data.json";
const GH_API=`https://api.github.com/repos/${GH_OWNER}/${GH_REPO}/contents/${GH_PATH}`;
const TK="tk-gh-token",SK="tk-staffname";
const STAFF=["福原涼太","安齋亮","齋藤蒼一郎","井上凱","芹澤澄人","山本李江","小笠原陸斗","永井悠真","石沢拓哉","髙久和也","田口鈴之介","佐竹海誓","宮下和大","石井朝陽","大塚栞南","村山勇輝"];
const AMT=new Set(["instaSaleAmount"]);
const COLORS=["#007aff","#ff2d55","#af52de","#34c759","#ff9500","#ff3b30","#5ac8fa","#ffcc00"];

Chart.defaults.color="#aeaeb2";Chart.defaults.borderColor="#e8e8ed";

const STORE_FIELDS=[
  {key:"approach",label:"アプローチ",color:""},
  {key:"service",label:"接客人数",color:""},
  {key:"hold",label:"ありあり取置",color:""},
  {key:"kaitoriHold",label:"なしなし取置",color:""},
  {key:"contact",label:"連絡先",color:""},
  {key:"kobutsu",label:"クーポン(古物)",color:""},
  {key:"kaitori",label:"買取概算",color:""},
];
const INSTA_FIELDS=[
  {key:"instaDM",label:"DM件数",color:"pink"},
  {key:"instaInquirySales",label:"販売問合",color:"pink"},
  {key:"instaInquiryBuy",label:"買取問合",color:"pink"},
  {key:"instaSaleClients",label:"販売 客数",color:"orange"},
  {key:"instaSaleItems",label:"販売 点数",color:"orange"},
  {key:"instaSaleAmount",label:"販売 金額",color:"orange",isAmt:true},
  {key:"instaBuyClients",label:"買取 客数",color:"green"},
  {key:"instaBuyItems",label:"買取 点数",color:"green"},
];
// Instagram insights — reported for a 2-day period a few days behind, so they
// carry their own 対象期間 (from/to) rather than being tied to the record date.
const INSIGHT_FIELDS=[
  {key:"instaViews",label:"閲覧数(全体)",color:"teal",isNum:true},
  {key:"instaProfileAccess",label:"プロフアクセス",color:"teal",isNum:true},
  {key:"instaFollowDay",label:"フォロー数",color:"teal",isNum:true},
  {key:"instaFollowers",label:"現在のフォロワー",color:"teal",isNum:true},
];
const ALL_FIELDS=[...STORE_FIELDS,...INSTA_FIELDS,...INSIGHT_FIELDS];

function getToken(){let t;try{t=localStorage.getItem(TK)}catch(e){}if(!t){t=prompt("共有アクセスキーを入力してください");if(t){try{localStorage.setItem(TK,t.trim())}catch(e){}t=t.trim()}}return t}
function getName(){try{return localStorage.getItem(SK)||""}catch(e){return""}}
function setName(n){try{localStorage.setItem(SK,n)}catch(e){}}
function updBadge(){document.getElementById("badge").textContent=getName()?`👤 ${getName()}`:"👤 名前を設定";}
function err(m){const el=document.getElementById("errBanner");el.style.display="block";el.textContent=m;}
function clrErr(){document.getElementById("errBanner").style.display="none";}
function today(){const d=new Date();return`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;}
function fmtDate(d){return`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;}
// Instagram insights lag ~2 days; the latest viewable complete 2-day window
// ends about 2 days ago. So default: from = day-3, to = day-2.
function setInsightPeriodDefault(){
  const base=document.getElementById("inDate").value?new Date(document.getElementById("inDate").value):new Date();
  const to=new Date(base);to.setDate(to.getDate()-1);
  const from=new Date(base);from.setDate(from.getDate()-2);
  document.getElementById("insightFrom").value=fmtDate(from);
  document.getElementById("insightTo").value=fmtDate(to);
}
function nf(n){return Number(n||0).toLocaleString("ja-JP");}
function u2b(s){return btoa(unescape(encodeURIComponent(s)))}
function b2u(b){return decodeURIComponent(escape(atob(b.replace(/\n/g,""))))}
function dl(days){const t=new Date(),r=[];for(let i=days-1;i>=0;i--){const d=new Date(t);d.setDate(d.getDate()-i);r.push(`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`);}return r;}

// name modal
function openName(force){
  document.getElementById("nameSel").innerHTML=STAFF.map(n=>`<option>${n}</option>`).join("");
  const c=getName();if(c&&STAFF.includes(c))document.getElementById("nameSel").value=c;
  document.getElementById("nameCancel").style.display=force?"none":"";
  document.getElementById("nameOv").style.display="flex";
}
function closeName(){document.getElementById("nameOv").style.display="none";}
function ensureName(force){
  return new Promise(r=>{
    if(getName()&&!force){r(getName());return;}
    openName(force);
    const b=document.getElementById("nameOk");
    const h=()=>{setName(document.getElementById("nameSel").value);updBadge();closeName();b.removeEventListener("click",h);r(getName());};
    b.addEventListener("click",h);
  });
}

// GH
let ghSha=null, records=[];
async function ghGet(){
  const t=getToken();if(!t)return[];
  const r=await fetch(`${GH_API}?ts=${Date.now()}`,{headers:{"Authorization":`Bearer ${t}`,"Accept":"application/vnd.github+json"}});
  if(r.status===401){try{localStorage.removeItem(TK)}catch(e){}const nt=prompt("キーが無効です。新しいキーを入力：");if(nt){try{localStorage.setItem(TK,nt.trim())}catch(e){}}return ghGet();}
  if(r.status===404){ghSha=null;return[];}
  if(!r.ok)throw new Error("HTTP "+r.status);
  const d=await r.json();ghSha=d.sha;return JSON.parse(b2u(d.content)||"[]");
}
async function ghSet(arr){
  const t=getToken();if(!t)throw new Error("キー未設定");
  for(let a=0;a<4;a++){
    try{const h=await fetch(`${GH_API}?ts=${Date.now()}`,{headers:{"Authorization":`Bearer ${t}`,"Accept":"application/vnd.github+json"}});if(h.ok)ghSha=(await h.json()).sha;else if(h.status===404)ghSha=null;}catch(e){}
    const body={message:"kpi "+new Date().toISOString(),content:u2b(JSON.stringify(arr))};
    if(ghSha)body.sha=ghSha;
    const r=await fetch(GH_API,{method:"PUT",headers:{"Authorization":`Bearer ${t}`,"Accept":"application/vnd.github+json","Content-Type":"application/json"},body:JSON.stringify(body)});
    if(r.ok){ghSha=(await r.json()).content.sha;return;}
    if(r.status===409&&a<3){await new Promise(r=>setTimeout(r,500+a*500));continue;}
    throw new Error("保存失敗 "+r.status);
  }
}

// stepper values
const vals={};

function buildSteppers(containerId, fields){
  const el=document.getElementById(containerId);
  el.innerHTML=fields.map(f=>{
    if(f.isAmt) return `<div class="si ${f.color}">
      <div class="label">${f.label}</div>
      <div class="val" id="v_${f.key}">¥0</div>
      <input type="number" class="amt-input" id="amt_${f.key}" placeholder="金額を入力" min="0" value="">
    </div>`;
    if(f.isNum) return `<div class="si ${f.color}">
      <div class="label">${f.label}</div>
      <div class="val" id="v_${f.key}">0</div>
      <input type="number" class="amt-input num-input" id="amt_${f.key}" placeholder="数値を入力" min="0" value="">
    </div>`;
    return `<div class="si ${f.color}">
      <div class="label">${f.label}</div>
      <div class="val" id="v_${f.key}">0</div>
      <div class="btns">
        <button class="minus" data-k="${f.key}" data-d="-1">−</button>
        <button class="plus" data-k="${f.key}" data-d="1">＋</button>
      </div>
    </div>`;
  }).join("");
  // bind steppers — pointer-based, no double firing, immediate response
  el.querySelectorAll("button[data-k]").forEach(b=>{
    const step=()=>{
      const k=b.dataset.k, d=Number(b.dataset.d);
      vals[k]=Math.max(0,vals[k]+d);
      document.getElementById("v_"+k).textContent=vals[k];
    };
    let holdTimer=null, repeatIv=null;
    const start=(e)=>{
      e.preventDefault(); // stops the synthetic double-tap/zoom & ghost click
      step(); // immediate single increment
      holdTimer=setTimeout(()=>{repeatIv=setInterval(step,120);},450); // rapid only after a real hold
    };
    const stop=()=>{clearTimeout(holdTimer);clearInterval(repeatIv);holdTimer=repeatIv=null;};
    b.addEventListener("pointerdown",start);
    b.addEventListener("pointerup",stop);
    b.addEventListener("pointerleave",stop);
    b.addEventListener("pointercancel",stop);
  });
  // bind amount inputs
  el.querySelectorAll(".amt-input").forEach(inp=>{
    const k=inp.id.replace("amt_","");
    const isNum=inp.classList.contains("num-input");
    inp.addEventListener("input",()=>{
      vals[k]=Number(inp.value)||0;
      document.getElementById("v_"+k).textContent=isNum?nf(vals[k]):"¥"+nf(vals[k]);
    });
  });
}

// save
async function doSave(){
  const name=await ensureName(false);if(!name)return;
  const date=document.getElementById("inDate").value||today();
  const entry={date, staff:name, savedAt:new Date().toISOString()};
  ALL_FIELDS.forEach(f=>{entry[f.key]=vals[f.key];});
  // insight period (対象期間) — records which 2-day window the insight numbers cover
  entry.insightFrom=document.getElementById("insightFrom").value||"";
  entry.insightTo=document.getElementById("insightTo").value||"";
  clrErr();
  const btn=document.getElementById("saveBtn");
  btn.textContent="保存中...";btn.disabled=true;
  try{
    const latest=await ghGet()||[];
    const idx=latest.findIndex(r=>r.date===entry.date&&r.staff===entry.staff);
    if(idx>=0)latest[idx]=entry;else latest.push(entry);
    records=latest;
    await ghSet(records);
    records=await ghGet()||[];
    const saved=records.find(r=>r.date===entry.date&&r.staff===entry.staff);
    if(!saved)throw new Error("保存確認失敗");
    const t=document.getElementById("saveTick");t.style.opacity="1";setTimeout(()=>t.style.opacity="0",2500);
    ALL_FIELDS.forEach(f=>{vals[f.key]=0;document.getElementById("v_"+f.key).textContent=f.isAmt?"¥0":"0";});
    document.querySelectorAll(".amt-input").forEach(i=>i.value="");
  }catch(e){console.error(e);err("保存失敗："+e.message);}
  finally{btn.textContent="保存する";btn.disabled=false;}
}

let CH={};
function kill(id){if(CH[id]){CH[id].destroy();delete CH[id];}}
function trend(canvasId,metric,days,mode){
  kill(canvasId);
  const list=dl(days);
  const isAmt=AMT.has(metric);
  let datasets;
  if(mode==="total"){
    datasets=[{label:"全体",data:list.map(d=>records.filter(r=>r.date===d).reduce((s,r)=>s+(r[metric]||0),0)),
      borderColor:COLORS[0],backgroundColor:"rgba(0,122,255,.06)",fill:true,tension:.35,pointRadius:2}];
  }else{
    const staffs=[...new Set(records.map(r=>r.staff))];
    datasets=staffs.map((s,i)=>({label:s,
      data:list.map(d=>{const r=records.find(x=>x.date===d&&x.staff===s);return r?(r[metric]||0):0;}),
      borderColor:COLORS[i%COLORS.length],backgroundColor:"transparent",tension:.35,pointRadius:1
    }));
  }
  CH[canvasId]=new Chart(document.getElementById(canvasId),{type:"line",data:{labels:list.map(d=>d.slice(5)),datasets},
    options:{responsive:true,plugins:{legend:{display:mode==="staff",labels:{font:{size:10},boxWidth:10}}},
      scales:{y:{beginAtZero:true,ticks:{precision:0,callback:isAmt?v=>"¥"+nf(v):v=>v}},x:{ticks:{maxRotation:0,autoSkip:true,maxTicksLimit:8}}}}
  });
}

  });
  const blob=new Blob(["\ufeff"+lines.join("\n")],{type:"text/csv;charset=utf-8"});
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);
  a.download=`タスク集計_${date}.csv`;a.click();
});

// Reload button — refetch latest records and re-render today's status
document.getElementById("reloadToday").addEventListener("click",async function(){
  const btn=this;const orig=btn.innerHTML;
  btn.innerHTML="⏳ 更新中";btn.style.opacity=".6";btn.disabled=true;
  try{
    records=await ghGet()||[];
    renderToday();renderCharts();
    btn.innerHTML="✓ 完了";
    setTimeout(()=>{btn.innerHTML=orig;btn.style.opacity="1";btn.disabled=false;},1000);
  }catch(e){
    btn.innerHTML="⚠ 失敗";
    setTimeout(()=>{btn.innerHTML=orig;btn.style.opacity="1";btn.disabled=false;},1500);
  }
});

(async function init(){
  document.getElementById("dayLabel").textContent=new Date().toLocaleDateString("ja-JP",{year:"numeric",month:"long",day:"numeric"});
  document.getElementById("inDate").value=today();
  document.getElementById("inDate").addEventListener("change",()=>{setInsightPeriodDefault();renderToday();});
  updBadge();
  buildSteppers("sgStore",STORE_FIELDS);
  buildSteppers("sgInsta",INSTA_FIELDS);
  buildSteppers("sgInsight",INSIGHT_FIELDS);
  // default insight period = the latest available 2-day window (day-3 to day-2)
  setInsightPeriodDefault();
  document.getElementById("insightAuto").addEventListener("click",setInsightPeriodDefault);
  await ensureName(true);
  try{records=await ghGet()||[];}catch(e){err("読み込み失敗："+e.message);}
  renderToday();
  renderCharts();
})();
</script>
