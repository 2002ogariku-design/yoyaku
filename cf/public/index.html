<!doctype html><html lang="ja"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>店舗ツール｜RINKAN</title>
<link rel="icon" href="data:,">
<style>
:root{--bg:#f5f5f7;--card:#fff;--t1:#1d1d1f;--t2:#6e6e73;--line:#e8e8ed;--accent:#007aff;
--font:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif;}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#000;--card:#1c1c1e;--t1:#f5f5f7;--t2:#8e8e93;--line:#2c2c2e;}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--t1);font-family:var(--font);
 padding:32px 16px 64px;-webkit-font-smoothing:antialiased}
.wrap{max-width:720px;margin:0 auto}
h1{font-size:26px;font-weight:800;letter-spacing:-.02em;margin:0 0 4px}
.sub{color:var(--t2);font-size:13px;margin:0 0 28px}
.grid{display:grid;gap:10px}
a.tool{display:flex;align-items:center;gap:14px;background:var(--card);border:1px solid var(--line);
 border-radius:14px;padding:16px 18px;text-decoration:none;color:inherit;transition:transform .12s}
a.tool:active{transform:scale(.985)}
.ico{font-size:24px;line-height:1;width:30px;text-align:center;flex:none}
.nm{font-weight:700;font-size:15px}
.ds{color:var(--t2);font-size:12px;margin-top:2px;line-height:1.5}
.sec{color:var(--t2);font-size:11px;font-weight:700;letter-spacing:.06em;margin:26px 0 8px;text-transform:uppercase}
.me{margin-top:32px;color:var(--t2);font-size:11px}
</style></head><body>
<div class="wrap">
  <h1>店舗ツール</h1>
  <p class="sub">RINKAN</p>

  <div class="sec">日次</div>
  <div class="grid">
    <a class="tool" href="/kpi/"><span class="ico">📝</span><span><div class="nm">タスク集計（渋谷）</div><div class="ds">店頭タスクと個人インスタの記録</div></span></a>
    <a class="tool" href="/kpi-mh/"><span class="ico">📝</span><span><div class="nm">タスク集計（南堀江）</div><div class="ds">店頭タスクと個人インスタの記録</div></span></a>
    <a class="tool" href="/pick/"><span class="ico">📦</span><span><div class="nm">ピッキング</div><div class="ds">撤収・在庫移動のリスト共有</div></span></a>
  </div>

  <div class="sec">分析</div>
  <div class="grid">
    <a class="tool" href="/story/"><span class="ico">📊</span><span><div class="nm">公式インスタ分析</div><div class="ds">投稿とインサイトの推移</div></span></a>
  </div>

  <div class="sec">学習・確認</div>
  <div class="grid">
    <a class="tool" href="/btest/"><span class="ico">🎓</span><span><div class="nm">ブランドテスト対策</div><div class="ds">演習と暗記</div></span></a>
    <a class="tool" href="/memo/"><span class="ico">⌚</span><span><div class="nm">暗記シート</div><div class="ds">時計・バッグ</div></span></a>
    <a class="tool" href="/hissyaku/"><span class="ico">🚚</span><span><div class="nm">必着未販売管理</div><div class="ds">必着商品の確認</div></span></a>
  </div>

  <div class="me" id="me"></div>
</div>
<script>
fetch("/api/me").then(r=>r.json()).then(d=>{
  if(d&&d.email)document.getElementById("me").textContent="🔒 "+d.email+" でログイン中";
}).catch(()=>{});
</script>
</body></html>
