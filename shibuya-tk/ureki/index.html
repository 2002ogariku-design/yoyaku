<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>RINKAN 売れ履歴 分析</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/pako@2.1.0/dist/pako.min.js"></script>
<style>
:root{
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Display","Hiragino Sans","Yu Gothic",sans-serif;
  --bg:#f5f5f7;--card:#fff;--card2:#f2f2f7;--line:#e5e5ea;
  --t1:#1d1d1f;--t2:#48484a;--t3:#8e8e93;
  --blue:#0071e3;--green:#34c759;--orange:#ff9500;--red:#ff3b30;--purple:#af52de;
  --smooth:cubic-bezier(.32,.72,0,1);--spring:cubic-bezier(.34,1.4,.5,1);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
body{font-family:var(--font);background:var(--bg);color:var(--t1);-webkit-font-smoothing:antialiased;padding-bottom:80px;}
header{background:rgba(245,245,247,.8);backdrop-filter:blur(20px) saturate(180%);-webkit-backdrop-filter:blur(20px) saturate(180%);
  position:sticky;top:0;z-index:30;padding:14px 20px;padding-top:max(14px,env(safe-area-inset-top,0));border-bottom:.5px solid rgba(0,0,0,.1);}
header .eyebrow{font-size:11px;font-weight:700;color:var(--blue);letter-spacing:.05em;text-transform:uppercase;}
header h1{font-size:24px;font-weight:800;letter-spacing:-.03em;margin-top:1px;}
.wrap{max-width:1100px;margin:0 auto;padding:18px 16px;}
.tabbar{position:fixed;bottom:0;left:0;right:0;z-index:30;background:rgba(255,255,255,.82);backdrop-filter:blur(20px) saturate(180%);-webkit-backdrop-filter:blur(20px) saturate(180%);
  border-top:.5px solid rgba(0,0,0,.1);display:flex;padding:8px 6px calc(8px + env(safe-area-inset-bottom,0));}
.tabbar button{flex:1;background:none;border:none;font-family:var(--font);color:var(--t3);font-size:10.5px;font-weight:600;cursor:pointer;padding:4px;display:flex;flex-direction:column;align-items:center;gap:3px;transition:color .2s;}
.tabbar button .ic{font-size:20px;}
.tabbar button.on{color:var(--blue);}
.view{display:none;}
.view.on{display:block;animation:fade .4s var(--smooth);}
@keyframes fade{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:none;}}
.card{background:var(--card);border-radius:20px;padding:20px;margin-bottom:16px;box-shadow:0 1px 2px rgba(0,0,0,.03),0 8px 24px rgba(0,0,0,.05);}
.card-t{font-size:12px;font-weight:700;color:var(--t3);letter-spacing:.05em;text-transform:uppercase;margin-bottom:16px;}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px;}
.kpi{background:var(--card);border-radius:18px;padding:18px;box-shadow:0 1px 2px rgba(0,0,0,.03),0 8px 20px rgba(0,0,0,.04);}
.kpi .lbl{font-size:11.5px;color:var(--t3);font-weight:600;margin-bottom:6px;}
.kpi .val{font-size:26px;font-weight:800;letter-spacing:-.02em;}
.kpi .sub{font-size:11px;color:var(--t3);margin-top:3px;}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
@media(max-width:760px){.grid2{grid-template-columns:1fr;}}
select,input{font-family:var(--font);font-size:15px;padding:11px 13px;border-radius:12px;border:1px solid var(--line);background:var(--card2);color:var(--t1);width:100%;}
select:focus,input:focus{outline:none;border-color:var(--blue);background:#fff;}
table{width:100%;border-collapse:collapse;font-size:13px;}
thead th{text-align:left;padding:10px 8px;font-size:11px;font-weight:700;color:var(--t3);text-transform:uppercase;letter-spacing:.03em;border-bottom:1.5px solid var(--line);position:sticky;top:0;background:var(--card);cursor:pointer;user-select:none;}
tbody td{padding:11px 8px;border-bottom:1px solid var(--line);}
tbody tr{transition:background .15s;cursor:pointer;}
tbody tr:hover{background:var(--card2);}
tbody tr:active{background:#eaeaef;}
.rank-badge{display:inline-block;width:26px;height:26px;line-height:26px;text-align:center;border-radius:8px;font-weight:800;font-size:12px;color:#fff;}
.chip{display:inline-block;padding:6px 12px;margin:3px;border-radius:16px;border:1px solid var(--line);background:var(--card2);font-size:12.5px;cursor:pointer;font-weight:600;transition:all .2s var(--spring);}
.chip.on{background:var(--t1);color:#fff;border-color:var(--t1);transform:scale(1.04);}
.trend-up{color:var(--green);font-weight:700;}
.trend-down{color:var(--red);font-weight:700;}
.drop{border:2px dashed #c7c7cc;border-radius:16px;padding:32px 16px;text-align:center;color:var(--t3);cursor:pointer;font-weight:600;font-size:14px;background:var(--card2);transition:all .2s var(--smooth);}
.drop:hover{border-color:var(--blue);color:var(--blue);}
.btn{background:var(--t1);color:#fff;border:none;border-radius:13px;padding:13px 22px;font-family:var(--font);font-size:15px;font-weight:700;cursor:pointer;transition:transform .13s var(--smooth);}
.btn:active{transform:scale(.96);}
.btn.blue{background:var(--blue);}
.spark{height:40px;}
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:100;align-items:center;justify-content:center;padding:16px;}
.modal.show{display:flex;}
.sheet{background:#fff;border-radius:22px;max-width:820px;width:100%;max-height:88vh;overflow-y:auto;padding:24px;}
.muted{color:var(--t3);font-size:12px;}
.bar-row{display:flex;align-items:center;gap:10px;margin-bottom:9px;}
.bar-row .nm{width:130px;font-size:12.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex-shrink:0;}
.bar-row .track{flex:1;height:22px;background:var(--card2);border-radius:6px;overflow:hidden;}
.bar-row .fill{height:100%;border-radius:6px;background:linear-gradient(90deg,#0071e3,#42a5f5);}
.bar-row .amt{width:90px;text-align:right;font-size:12px;font-weight:700;flex-shrink:0;font-variant-numeric:tabular-nums;}
.loading{text-align:center;padding:60px 20px;color:var(--t3);}
.spinner{width:32px;height:32px;border:3px solid var(--line);border-top-color:var(--blue);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 16px;}
@keyframes spin{to{transform:rotate(360deg);}}
</style>
</head>
<body>
<header>
  <div class="eyebrow">RINKAN SHIBUYA</div>
  <h1>売れ履歴 分析</h1>
</header>

<div class="wrap">
  <div id="app"><div class="loading"><div class="spinner"></div>データを読み込み中...</div></div>

  <!-- ダッシュボード -->
  <div class="view" id="v-dash">
    <div class="kpis" id="dashKpis"></div>
    <div class="card"><div class="card-t">📈 月別売上推移</div><canvas id="chMonthly" height="90"></canvas></div>
    <div class="grid2">
      <div class="card"><div class="card-t">🏆 ブランド別売上 TOP10</div><div id="brandBars"></div></div>
      <div class="card"><div class="card-t">📦 カテゴリ別売上</div><canvas id="chCat" height="200"></canvas></div>
    </div>
  </div>

  <!-- 売れ筋 -->
  <div class="view" id="v-items">
    <div class="card">
      <div class="card-t">🔥 売れ筋アイテム（販売回数順）</div>
      <div style="margin-bottom:14px;"><input type="text" id="itemSearch" placeholder="🔍 ブランド・アイテム名で検索..."></div>
      <div style="margin-bottom:12px;" id="itemBrandChips"></div>
      <div style="overflow-x:auto;">
        <table id="itemsTable">
          <thead><tr>
            <th data-sort="count">販売数</th><th data-sort="brand">ブランド</th><th data-sort="item">アイテム</th>
            <th data-sort="avg">平均単価</th><th data-sort="trend">相場推移</th><th data-sort="total">売上計</th>
          </tr></thead>
          <tbody id="itemsBody"></tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- 相場 -->
  <div class="view" id="v-price">
    <div class="card">
      <div class="card-t">💹 相場チェック（同一アイテムの価格推移）</div>
      <p class="muted" style="margin-bottom:14px;">複数回売れたアイテムを選ぶと、価格の推移グラフが見られます。</p>
      <select id="priceItemSel"></select>
      <div id="priceDetail" style="margin-top:18px;"></div>
    </div>
  </div>

  <!-- データ -->
  <div class="view" id="v-data">
    <div class="card">
      <div class="card-t">📤 売れ履歴データを追加</div>
      <p class="muted" style="margin-bottom:14px;line-height:1.7;">毎日の売上明細エクセル（売上明細表）をアップすると、履歴に追加されます。重複は自動でスキップされます。</p>
      <div class="drop" id="xlsxDrop">📄 エクセルファイルを選択<br><span class="muted">売上明細表(集計ありver.2)</span></div>
      <input type="file" id="xlsxIn" accept=".xlsx,.xls" style="display:none;">
      <div id="uploadMsg" style="margin-top:14px;font-size:14px;font-weight:600;"></div>
    </div>
    <div class="card">
      <div class="card-t">💾 データ状況</div>
      <div id="dataStats"></div>
    </div>
  </div>
</div>

<div class="tabbar" id="tabbar">
  <button data-v="dash" class="on"><span class="ic">📊</span>概要</button>
  <button data-v="items"><span class="ic">🔥</span>売れ筋</button>
  <button data-v="price"><span class="ic">💹</span>相場</button>
  <button data-v="data"><span class="ic">＋</span>データ</button>
</div>

<div class="modal" id="itemModal" onclick="if(event.target.id==='itemModal')closeItemModal()">
  <div class="sheet" id="itemSheet"></div>
</div>

<script>
const YEN=n=>"¥"+Math.round(n).toLocaleString("ja-JP");
const YENk=n=>n>=1e8?"¥"+(n/1e8).toFixed(2)+"億":n>=1e4?"¥"+Math.round(n/1e4).toLocaleString()+"万":YEN(n);
const esc=s=>String(s||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const RANKCOLOR={S:"#af52de",A:"#0071e3",B:"#34c759",C:"#ff9500",D:"#8e8e93"};

// GitHub config
const GH_OWNER="2002ogariku-design",GH_REPO="yoyaku";
const SEED_URL="https://raw.githubusercontent.com/"+GH_OWNER+"/"+GH_REPO+"/main/shibuya-tk/ureki/sales-seed.json.gz";
const UPLOAD_PATH="shibuya-tk/ureki/sales-uploads.json";
const UPLOAD_URL="https://raw.githubusercontent.com/"+GH_OWNER+"/"+GH_REPO+"/main/"+UPLOAD_PATH;
const GH_TK_KEY="tk-gh-token";
function getGhTk(){let t;try{t=localStorage.getItem(GH_TK_KEY)}catch(e){}if(!t){t=prompt("共有アクセスキーを入力（他ツールと同じ）");if(t)try{localStorage.setItem(GH_TK_KEY,t.trim())}catch(e){}}return t?t.trim():null;}

let DATA=[]; // all sale records
let charts={};
let SEED_KEYS=new Set();

async function boot(){
  try{
    // Load seed (gzipped)
    const seedResp=await fetch(SEED_URL+"?t="+Date.now());
    if(seedResp.ok){
      const buf=await seedResp.arrayBuffer();
      let txt;
      try{txt=pako.ungzip(new Uint8Array(buf),{to:"string"});}
      catch(e){txt=new TextDecoder().decode(buf);}
      const seed=JSON.parse(txt);
      DATA=seed.rows.map(r=>rowToObj(r,seed.schema));
      SEED_KEYS=new Set(DATA.map(keyOf));
    }
  }catch(e){console.error("seed load fail",e);}
  // Load uploads
  try{
    const upResp=await fetch(UPLOAD_URL+"?t="+Date.now());
    if(upResp.ok){
      const up=await upResp.json();
      if(up.rows&&up.schema){
        const seen=new Set(DATA.map(keyOf));
        up.rows.map(r=>rowToObj(r,up.schema)).forEach(o=>{if(!seen.has(keyOf(o)))DATA.push(o);});
      }
    }
  }catch(e){}
  document.getElementById("app").style.display="none";
  document.getElementById("v-dash").classList.add("on");
  renderAll();
}
function rowToObj(r,schema){const o={};schema.forEach((k,i)=>o[k]=r[i]);return o;}
function keyOf(o){return o.jan+"|"+o.date+"|"+o.price;}

// ---- item grouping ----
function itemKey(r){return r.brand+"|||"+(r.model||r.name);}
function buildItems(){
  const m={};
  for(const r of DATA){
    const k=itemKey(r);
    if(!m[k])m[k]={brand:r.brand,item:r.model||r.name,cat:r.cat,recs:[]};
    m[k].recs.push(r);
  }
  return Object.values(m).map(it=>{
    const prices=it.recs.map(r=>r.price).filter(p=>p>0);
    const sorted=it.recs.slice().sort((a,b)=>a.date.localeCompare(b.date));
    const n=prices.length;
    const avg=prices.reduce((a,b)=>a+b,0)/Math.max(1,n);
    const total=prices.reduce((a,b)=>a+b,0);
    // trend: compare first third avg vs last third avg
    let trend=0;
    if(n>=4){
      const k=Math.max(1,Math.floor(n/3));
      const firstP=sorted.slice(0,k).map(r=>r.price);
      const lastP=sorted.slice(-k).map(r=>r.price);
      const fa=firstP.reduce((a,b)=>a+b,0)/firstP.length;
      const la=lastP.reduce((a,b)=>a+b,0)/lastP.length;
      if(fa>0)trend=(la-fa)/fa*100;
    }
    return {...it,count:n,avg,total,min:Math.min(...prices),max:Math.max(...prices),trend,sorted};
  });
}

// ---- renders ----
function renderAll(){renderDash();renderItems();renderPriceSel();renderDataStats();}

function renderDash(){
  const valid=DATA.filter(r=>r.price>0);
  const total=valid.reduce((a,r)=>a+r.price,0);
  const cost=valid.reduce((a,r)=>a+(r.cost||0),0);
  const profit=total-cost;
  const dates=valid.map(r=>r.date).sort();
  const kpis=[
    ["総売上",YENk(total),valid.length+"点販売"],
    ["粗利",YENk(profit),total>0?Math.round(profit/total*100)+"% 粗利率":""],
    ["販売点数",valid.length.toLocaleString()+"点",""],
    ["期間",dates.length?fmtD(dates[0])+"〜":"" ,dates.length?fmtD(dates[dates.length-1]):""],
  ];
  document.getElementById("dashKpis").innerHTML=kpis.map(k=>`<div class="kpi"><div class="lbl">${k[0]}</div><div class="val">${k[1]}</div><div class="sub">${k[2]}</div></div>`).join("");

  // monthly
  const byMonth={};
  valid.forEach(r=>{const m=r.date.slice(0,6);byMonth[m]=(byMonth[m]||0)+r.price;});
  const months=Object.keys(byMonth).sort();
  drawChart("chMonthly","line",{
    labels:months.map(m=>m.slice(0,4)+"/"+m.slice(4,6)),
    datasets:[{data:months.map(m=>byMonth[m]),borderColor:"#0071e3",backgroundColor:"rgba(0,113,227,.1)",fill:true,tension:.35,pointRadius:2,borderWidth:2.5}]
  },{plugins:{legend:{display:false}},scales:{y:{ticks:{callback:v=>YENk(v)}}}});

  // brand bars
  const byBrand={};
  valid.forEach(r=>{byBrand[r.brand]=(byBrand[r.brand]||0)+r.price;});
  const topB=Object.entries(byBrand).sort((a,b)=>b[1]-a[1]).slice(0,10);
  const maxB=topB[0]?topB[0][1]:1;
  document.getElementById("brandBars").innerHTML=topB.map(([b,v])=>
    `<div class="bar-row"><div class="nm">${esc(b)}</div><div class="track"><div class="fill" style="width:${v/maxB*100}%"></div></div><div class="amt">${YENk(v)}</div></div>`).join("");

  // category donut
  const byCat={};
  valid.forEach(r=>{const c=r.cat2||r.cat||"その他";byCat[c]=(byCat[c]||0)+r.price;});
  const topC=Object.entries(byCat).sort((a,b)=>b[1]-a[1]).slice(0,8);
  drawChart("chCat","doughnut",{
    labels:topC.map(c=>c[0]),
    datasets:[{data:topC.map(c=>c[1]),backgroundColor:["#0071e3","#34c759","#ff9500","#af52de","#ff3b30","#5ac8fa","#ffcc00","#8e8e93"]}]
  },{plugins:{legend:{position:"right",labels:{font:{size:10},boxWidth:12}}}});
}
function fmtD(d){return d.slice(0,4)+"/"+d.slice(4,6)+"/"+d.slice(6,8);}

let itemSort={key:"count",dir:-1}, itemBrandFilter="";
function renderItems(){
  const items=buildItems();
  const brands=[...new Set(items.map(i=>i.brand))];
  const byBrandCount={};items.forEach(i=>byBrandCount[i.brand]=(byBrandCount[i.brand]||0)+i.count);
  const topBrands=Object.entries(byBrandCount).sort((a,b)=>b[1]-a[1]).slice(0,12).map(x=>x[0]);
  document.getElementById("itemBrandChips").innerHTML='<span class="chip'+(itemBrandFilter===""?" on":"")+'" onclick="setItemBrand(\'\')">すべて</span>'+
    topBrands.map(b=>`<span class="chip${itemBrandFilter===b?' on':''}" onclick="setItemBrand('${esc(b).replace(/'/g,"")}')">${esc(b)}</span>`).join("");
  drawItemsTable(items);
}
window.setItemBrand=function(b){itemBrandFilter=b;renderItems();};
function drawItemsTable(items){
  const q=document.getElementById("itemSearch").value.trim().toLowerCase();
  let rows=items.filter(i=>i.count>=1);
  if(itemBrandFilter)rows=rows.filter(i=>i.brand===itemBrandFilter);
  if(q)rows=rows.filter(i=>(i.brand+" "+i.item).toLowerCase().includes(q));
  const k=itemSort.key,dir=itemSort.dir;
  rows.sort((a,b)=>{
    let va,vb;
    if(k==="brand"){va=a.brand;vb=b.brand;return dir*va.localeCompare(vb);}
    if(k==="item"){va=a.item;vb=b.item;return dir*va.localeCompare(vb);}
    va=a[k==="avg"?"avg":k==="total"?"total":k==="trend"?"trend":"count"];vb=b[k==="avg"?"avg":k==="total"?"total":k==="trend"?"trend":"count"];
    return dir*(va-vb);
  });
  rows=rows.slice(0,200);
  document.getElementById("itemsBody").innerHTML=rows.map(i=>{
    const tr=i.count>=4?(i.trend>3?`<span class="trend-up">▲${Math.abs(i.trend).toFixed(0)}%</span>`:i.trend<-3?`<span class="trend-down">▼${Math.abs(i.trend).toFixed(0)}%</span>`:'<span class="muted">→ 横ばい</span>'):'<span class="muted">-</span>';
    return `<tr onclick='showItem(${JSON.stringify(itemKeyStr(i)).replace(/'/g,"&#39;")})'>
      <td><b>${i.count}</b>回</td>
      <td>${esc(i.brand)}</td>
      <td style="max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${esc(i.item)}</td>
      <td><b>${YEN(i.avg)}</b></td>
      <td>${tr}</td>
      <td>${YENk(i.total)}</td>
    </tr>`;
  }).join("")||'<tr><td colspan="6" style="text-align:center;padding:30px;color:var(--t3);">該当なし</td></tr>';
}
function itemKeyStr(i){return i.brand+"|||"+i.item;}
document.getElementById("itemSearch").addEventListener("input",()=>drawItemsTable(buildItems()));
document.querySelectorAll("#itemsTable thead th").forEach(th=>{
  th.addEventListener("click",()=>{
    const k=th.dataset.sort;
    if(itemSort.key===k)itemSort.dir*=-1;else{itemSort.key=k;itemSort.dir=-1;}
    drawItemsTable(buildItems());
  });
});

window.showItem=function(key){
  const items=buildItems();
  const it=items.find(i=>itemKeyStr(i)===key);
  if(!it)return;
  const sorted=it.sorted;
  const modal=document.getElementById("itemModal"),sheet=document.getElementById("itemSheet");
  sheet.innerHTML=`
    <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:6px;">
      <div><div class="muted">${esc(it.brand)}</div><div style="font-size:20px;font-weight:800;letter-spacing:-.01em;">${esc(it.item)}</div></div>
      <button onclick="closeItemModal()" style="background:var(--card2);border:none;border-radius:50%;width:34px;height:34px;font-size:18px;cursor:pointer;flex-shrink:0;">×</button>
    </div>
    <div class="kpis" style="margin:16px 0;">
      <div class="kpi"><div class="lbl">販売回数</div><div class="val">${it.count}回</div></div>
      <div class="kpi"><div class="lbl">平均単価</div><div class="val">${YEN(it.avg)}</div></div>
      <div class="kpi"><div class="lbl">価格帯</div><div class="val" style="font-size:17px;">${YEN(it.min)}〜${YEN(it.max)}</div></div>
      <div class="kpi"><div class="lbl">相場推移</div><div class="val" style="font-size:20px;">${it.count>=4?(it.trend>3?'<span class="trend-up">▲'+it.trend.toFixed(0)+'%</span>':it.trend<-3?'<span class="trend-down">▼'+Math.abs(it.trend).toFixed(0)+'%</span>':'横ばい'):'-'}</div></div>
    </div>
    <div class="card" style="box-shadow:none;border:1px solid var(--line);"><div class="card-t">価格推移</div><canvas id="chItemPrice" height="140"></canvas></div>
    <div class="card" style="box-shadow:none;border:1px solid var(--line);">
      <div class="card-t">販売履歴（新しい順）</div>
      <div style="max-height:260px;overflow-y:auto;">
        <table><thead><tr><th>日付</th><th>価格</th><th>サイズ</th><th>状態</th><th>店舗</th></tr></thead>

// ---- xlsx upload ----
const HEADER_ROW=5;
document.getElementById("xlsxDrop").addEventListener("click",()=>document.getElementById("xlsxIn").click());
document.getElementById("xlsxIn").addEventListener("change",e=>{if(e.target.files[0])importXlsx(e.target.files[0]);e.target.value="";});
async function importXlsx(file){
  const msg=document.getElementById("uploadMsg");
  msg.textContent="読み込み中...";msg.style.color="var(--blue)";
  try{
    const buf=await file.arrayBuffer();
    const wb=XLSX.read(buf,{type:"array"});
    const ws=wb.Sheets[wb.SheetNames[0]];
    const rows=XLSX.utils.sheet_to_json(ws,{header:1,defval:""});
    // find header row
    let hr=-1;
    for(let i=0;i<15;i++){if(rows[i]&&rows[i].includes("売上日付")){hr=i;break;}}
    if(hr<0){msg.textContent="⚠ ヘッダー行が見つかりません（売上明細表の形式か確認してください）";msg.style.color="var(--red)";return;}
    const head=rows[hr];
    const col=name=>head.indexOf(name);
    const ci={date:col("売上日付"),store:col("店舗名称"),brand:col("ブランド名"),brandEn:col("ブランド名称"),model:col("モデル名"),name:col("商品名称"),cat:col("大分類名称"),cat2:col("中分類名称"),size:col("サイズ名称"),rank:col("状態ランク"),qty:col("売上数量"),price:col("売上売価金額"),cost:col("売上原価金額"),listPrice:col("標準売価(税込)"),jan:col("JANコード")};
    const cl=v=>String(v==null?"":v).replace(/\u3000/g," ").trim();
    const newRecs=[];
    for(let i=hr+1;i<rows.length;i++){
      const r=rows[i];if(!r||!r[ci.date])continue;
      const brand=cl(r[ci.brand]),name=cl(r[ci.name]),price=Number(r[ci.price])||0;
      if(!brand||!name||price<=0)continue;
      if(/送料|手数料/.test(cl(r[ci.brandEn])))continue;
      newRecs.push({date:String(r[ci.date]).slice(0,8),store:cl(r[ci.store]),brand,brandEn:cl(r[ci.brandEn]),model:cl(r[ci.model]),name,cat:cl(r[ci.cat]),cat2:cl(r[ci.cat2]),size:cl(r[ci.size]),rank:cl(r[ci.rank]),qty:Number(r[ci.qty])||1,price,cost:Number(r[ci.cost])||0,listPrice:Number(r[ci.listPrice])||0,jan:cl(r[ci.jan])});
    }
    // merge into DATA (dedup)
    const seen=new Set(DATA.map(keyOf));
    let added=0;
    for(const rec of newRecs){if(!seen.has(keyOf(rec))){seen.add(keyOf(rec));DATA.push(rec);added++;}}
    msg.textContent=`✓ ${added}件を追加しました（重複${newRecs.length-added}件スキップ）。保存中...`;
    msg.style.color="var(--green)";
    await saveUploads();
    msg.textContent=`✓ ${added}件を追加・保存しました。`;
    renderAll();
  }catch(err){console.error(err);msg.textContent="⚠ 読み込みエラー: "+err.message;msg.style.color="var(--red)";}
}

// Save all NON-seed uploads to GitHub (everything the user added beyond seed)
async function saveUploads(){
  const t=getGhTk();if(!t)return;
  const schema=["date","store","brand","brandEn","model","name","cat","cat2","size","rank","qty","price","cost","listPrice","jan"];
  // We can't easily tell seed vs upload; store everything not in seed by reloading seed keys.
  // Simpler: store the full uploads set = DATA minus seed. Track seed keys at boot.
  const uploadRows=DATA.filter(r=>!SEED_KEYS.has(keyOf(r))).map(r=>schema.map(k=>r[k]));
  const payload={schema,rows:uploadRows,updated:new Date().toISOString()};
  const body=JSON.stringify(payload);
  const api="https://api.github.com/repos/"+GH_OWNER+"/"+GH_REPO+"/contents/"+UPLOAD_PATH;
  let sha=null;
  try{const h=await fetch(api+"?t="+Date.now(),{headers:{Authorization:"Bearer "+t,Accept:"application/vnd.github+json"}});if(h.ok)sha=(await h.json()).sha;}catch(e){}
  const put={message:"sales upload "+new Date().toISOString(),content:btoa(unescape(encodeURIComponent(body)))};
  if(sha)put.sha=sha;
  const r=await fetch(api,{method:"PUT",headers:{Authorization:"Bearer "+t,Accept:"application/vnd.github+json","Content-Type":"application/json"},body:JSON.stringify(put)});
  if(!r.ok)console.error("save failed",r.status);
}

// chart helper
function drawChart(id,type,data,opts){
  const el=document.getElementById(id);if(!el)return;
  if(charts[id])charts[id].destroy();
  charts[id]=new Chart(el,{type,data,options:Object.assign({responsive:true,maintainAspectRatio:true},opts||{})});
}
