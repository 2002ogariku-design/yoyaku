<script>
const APP_VERSION="v1.0";
const Q=JSON.parse(document.getElementById("QDATA").textContent);
const MANUAL=JSON.parse(document.getElementById("MDATA").textContent);
const TEST_DATE=new Date(2026,9,10); // 2026/10/10

/* ========= 記憶の定着（間隔反復） =========
   正解が続くほど次に出るまでの間隔を空け、間違えた問題はすぐ戻ってくる。
   間隔は 10分 → 1日 → 3日 → 7日 → 16日 と伸ばす。 */
const STEPS=[10*60e3, 864e5, 3*864e5, 7*864e5, 16*864e5];
const KEY="btest-v1";
let S={stats:{},hist:[],cats:null,mode:"mix",input:"choice"};
try{const r=localStorage.getItem(KEY); if(r)S=Object.assign(S,JSON.parse(r));}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
function st(id){return S.stats[id]||(S.stats[id]={n:0,ok:0,ng:0,lvl:0,due:0,last:0});}
function grade(id,correct){
  const s=st(id); s.n++; s.last=Date.now();
  if(correct){ s.ok++; s.lvl=Math.min(s.lvl+1,STEPS.length); }
  else { s.ng++; s.lvl=0; }
  s.due=Date.now()+(correct?STEPS[Math.min(s.lvl-1,STEPS.length-1)]:5*60e3);
  save();
}
const isMastered=id=>{const s=S.stats[id];return s&&s.lvl>=4;};
const isLearning=id=>{const s=S.stats[id];return s&&s.lvl>0&&s.lvl<4;};
const isWeak=id=>{const s=S.stats[id];return s&&s.ng>=2&&s.lvl<3;};

const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const CATS=[...new Set(Q.map(q=>q.cat))];
if(!S.cats)S.cats=CATS.slice();

/* ========= 出題の組み立て ========= */
let queue=[],cur=null,sess={n:0,ok:0,total:0},mock=null;

function pool(){
  return Q.filter(q=>S.cats.includes(q.cat));
}
function buildQueue(size){
  const now=Date.now(), p=pool();
  const due=[],fresh=[],weak=[],rest=[];
  p.forEach(q=>{
    const s=S.stats[q.id];
    if(!s) fresh.push(q);
    else if(isWeak(q.id)) weak.push(q);
    else if(s.due<=now) due.push(q);
    else rest.push(q);
  });
  const shuffle=a=>a.map(x=>[Math.random(),x]).sort((a,b)=>a[0]-b[0]).map(x=>x[1]);
  let list=[];
  if(S.mode==="weak") list=shuffle(weak.concat(due));
  else if(S.mode==="new") list=shuffle(fresh);
  else if(S.mode==="review") list=shuffle(due.concat(weak));
  else{
    // 標準：苦手→期限切れ→新規 の順に混ぜる
    list=shuffle(weak).concat(shuffle(due)).concat(shuffle(fresh)).concat(shuffle(rest));
  }
  if(!list.length)list=shuffle(p);
  return list.slice(0,size||40);
}

function startSession(){
  queue=buildQueue(40);
  sess={n:0,ok:0,total:queue.length};
  mock=null;
  next();
  show("study");
}
function next(){
  document.getElementById("qResult").innerHTML="";
  if(!queue.length){ finish(); return; }
  cur=queue.shift();
  render();
}
function finish(){
  const pct=sess.total?Math.round(sess.ok/sess.total*100):0;
  if(mock){
    S.hist.unshift({d:new Date().toISOString(),n:sess.total,ok:sess.ok,mock:true});
    S.hist=S.hist.slice(0,40); save();
  }
  document.getElementById("quizCard").innerHTML=
    `<h2>${mock?"模試おつかれさまでした":"ひと区切りです"}</h2>
     <div style="font-size:34px;font-weight:800;margin:10px 0;">${sess.ok} / ${sess.total}
       <span style="font-size:17px;color:var(--mute);">正解率 ${pct}%</span></div>
     <p class="muted" style="font-size:14px;">間違えた問題は時間をおいてまた出てきます。</p>
     <div class="row">
       <button class="btn" id="againBtn">続ける</button>
       <button class="btn sub" id="toProg">到達度を見る</button>
     </div>`;
  document.getElementById("againBtn").onclick=startSession;
  document.getElementById("toProg").onclick=()=>show("prog");
  document.getElementById("sessInfo").textContent="";
  document.getElementById("sessBar").style.width="100%";
}

/* 選択肢を作る（同じ分類から紛らわしい候補を選ぶ） */
function makeChoices(q){
  const same=Q.filter(x=>x.id!==q.id&&x.sub===q.sub&&x.k===q.k).map(x=>x.a);
  const near=Q.filter(x=>x.id!==q.id&&x.cat===q.cat&&x.k===q.k).map(x=>x.a);
  const uniq=a=>[...new Set(a.filter(v=>v&&v!==q.a&&v.length<80))];
  let opts=uniq(same);
  if(opts.length<3)opts=uniq(opts.concat(near));
  opts=opts.map(x=>[Math.random(),x]).sort((a,b)=>a[0]-b[0]).map(x=>x[1]).slice(0,3);
  return [q.a].concat(opts).map(x=>[Math.random(),x]).sort((a,b)=>a[0]-b[0]).map(x=>x[1]);
}

function render(){
  const q=cur;
  document.getElementById("qCat").textContent=q.sub||q.cat;
  document.getElementById("qProg").textContent=
    (mock?"模試 ":"")+(sess.n+1)+" / "+sess.total+(mock?"":"　正解 "+sess.ok);
  const qt=document.getElementById("qText");
  qt.textContent=q.q;
  qt.className="qtext"+(q.q.length>46?" small":"");
  document.getElementById("sessBar").style.width=(sess.n/sess.total*100)+"%";
  document.getElementById("sessInfo").textContent=
    (S.mode==="weak"?"苦手つぶし":S.mode==="new"?"新しい問題":S.mode==="review"?"復習":"おまかせ")
    +"／"+(S.input==="choice"?"4択":S.input==="write"?"記述":"暗記カード");

  const box=document.getElementById("qInput");
  const useChoice = (S.input==="choice") || (mock && S.input!=="write");
  if(useChoice && q.a.length<80 && !q.any){
    const opts=makeChoices(q);
    box.innerHTML='<div class="choices">'+opts.map((o,i)=>
      `<button data-o="${esc(o)}">${esc(o)}</button>`).join("")+'</div>';
    box.querySelectorAll("[data-o]").forEach(b=>b.onclick=()=>{
      const picked=b.getAttribute("data-o");
      box.querySelectorAll("button").forEach(x=>{
        x.disabled=true;
        if(x.getAttribute("data-o")===q.a)x.className="correct";
        else if(x===b)x.className="wrong";
      });
      judge(picked===q.a,picked);
    });
  }else if(S.input==="write"||q.any){
    box.innerHTML=`<input type="text" id="ansIn" placeholder="答えを入力" autocomplete="off">
      <div class="row"><button class="btn" id="chkBtn">答え合わせ</button></div>`;
    const inp=document.getElementById("ansIn");
    inp.focus();
    const go=()=>{
      const v=(inp.value||"").trim();
      const answers=[q.a].concat(q.alts||[]);
      const norm=s=>s.replace(/[\s　・,，\-ー()（）]/g,"").toLowerCase();
      const hit=answers.some(a=>norm(a)===norm(v)||(norm(v).length>2&&norm(a).includes(norm(v))));
      judge(hit,v);
    };
    document.getElementById("chkBtn").onclick=go;
    inp.onkeydown=e=>{if(e.key==="Enter")go();};
  }else{
    box.innerHTML=`<div class="row"><button class="btn wide" id="flipBtn">答えを見る</button></div>`;
    document.getElementById("flipBtn").onclick=()=>judge(null,null);
  }
}

function judge(correct,given){
  const q=cur;
  const res=document.getElementById("qResult");
  const alts=(q.alts&&q.alts.length)?`<div class="alt">ほかの答え：${q.alts.map(esc).join("／")}</div>`:"";
  const note=q.note?`<div class="note">${esc(q.note)}</div>`:"";
  const yours=(given!=null&&given!=="")?`<div class="yourans">あなたの答え：<b>${esc(given)}</b></div>`:"";

  if(mock){
    // 模試中は答えを見せずに進む
    mock.log.push({id:q.id,correct:!!correct,given});
    if(correct)sess.ok++;
    sess.n++; grade(q.id,!!correct); next(); return;
  }

  res.innerHTML=`<div class="answer">
      <div class="lab">答え</div>
      <div class="val">${esc(q.a)}</div>${alts}${note}
    </div>${yours}`;

  if(correct===null){
    res.innerHTML+=`<div class="verdict">
      <button class="no" id="vNo">わからなかった</button>
      <button class="yes" id="vYes">覚えていた</button></div>`;
    document.getElementById("vYes").onclick=()=>{sess.ok++;sess.n++;grade(q.id,true);next();};
    document.getElementById("vNo").onclick=()=>{sess.n++;grade(q.id,false);next();};
  }else{
    if(correct)sess.ok++;
    sess.n++; grade(q.id,correct);
    res.innerHTML+=`<div class="row"><button class="btn wide" id="nx">
      ${correct?"正解　次へ":"次へ"}</button></div>`;
    const nb=document.getElementById("nx");
    nb.style.background=correct?"var(--ok)":"var(--ink)";
    nb.onclick=next;
    nb.focus();
  }
}

document.getElementById("skipBtn").onclick=()=>{ if(cur){sess.n++;} next(); };

/* ========= 模試 ========= */
function startMock(){
  const list=buildQueue(50);
  queue=list.slice();
  sess={n:0,ok:0,total:queue.length};
  mock={log:[],start:Date.now(),limit:60*60e3};
  next(); show("study");
  tickMock();
}
function tickMock(){
  if(!mock)return;
  const left=mock.limit-(Date.now()-mock.start);
  if(left<=0){ finish(); mock=null; return; }
  const m=Math.floor(left/60000), s=Math.floor(left%60000/1000);
  const el=document.getElementById("qProg");
  if(el&&mock)el.textContent=`模試 ${sess.n+1}/${sess.total}　残り ${m}:${String(s).padStart(2,"0")}`;
  setTimeout(tickMock,1000);
}
document.getElementById("mockBtn").onclick=startMock;
document.getElementById("startBtn").onclick=startSession;

/* ========= 設定 ========= */
function renderSettings(){
  document.getElementById("catChips").innerHTML=CATS.map(c=>{
    const n=Q.filter(q=>q.cat===c).length;
    return `<span class="chip${S.cats.includes(c)?" on":""}" data-c="${esc(c)}">${esc(c)} ${n}</span>`;
  }).join("");
  document.querySelectorAll("[data-c]").forEach(el=>el.onclick=()=>{
    const c=el.getAttribute("data-c");
    S.cats=S.cats.includes(c)?S.cats.filter(x=>x!==c):S.cats.concat(c);
    if(!S.cats.length)S.cats=[c];
    save();renderSettings();
  });
  const modes=[["mix","おまかせ"],["weak","苦手つぶし"],["new","新しい問題"],["review","復習（期限のきたもの）"]];
  document.getElementById("modeChips").innerHTML=modes.map(([k,l])=>
    `<span class="chip${S.mode===k?" on":""}" data-m="${k}">${l}</span>`).join("");
  document.querySelectorAll("[data-m]").forEach(el=>el.onclick=()=>{S.mode=el.getAttribute("data-m");save();renderSettings();});
  const inputs=[["choice","4択"],["write","記述"],["flip","暗記カード"]];
  document.getElementById("inputChips").innerHTML=inputs.map(([k,l])=>
    `<span class="chip${S.input===k?" on":""}" data-i="${k}">${l}</span>`).join("");
  document.querySelectorAll("[data-i]").forEach(el=>el.onclick=()=>{S.input=el.getAttribute("data-i");save();renderSettings();});
}

/* ========= 到達度 ========= */
function renderProgress(){
  const all=Q.length;
  const m=Q.filter(q=>isMastered(q.id)).length;
  const l=Q.filter(q=>isLearning(q.id)).length;
  document.getElementById("stMastered").textContent=m;
  document.getElementById("stLearning").textContent=l;
  document.getElementById("stNew").textContent=all-m-l;

  const subs={};
  Q.forEach(q=>{ (subs[q.cat]=subs[q.cat]||[]).push(q); });
  document.getElementById("catProg").innerHTML=Object.entries(subs)
    .sort((a,b)=>b[1].length-a[1].length).map(([c,list])=>{
      const done=list.filter(q=>isMastered(q.id)).length;
      const pct=Math.round(done/list.length*100);
      return `<div class="catrow" data-jump="${esc(c)}">
        <span class="nm">${esc(c)} <span class="muted" style="font-weight:400;">${done}/${list.length}</span></span>
        <span class="mini"><span class="bar"><span style="display:block;height:100%;width:${pct}%;background:${pct>=70?"var(--ok)":pct>=30?"var(--warm)":"var(--ng)"};"></span></span></span>
        <span class="pct">${pct}%</span></div>`;
    }).join("");
  document.querySelectorAll("[data-jump]").forEach(el=>el.onclick=()=>{
    S.cats=[el.getAttribute("data-jump")];save();renderSettings();startSession();
  });

  const weak=Q.filter(q=>isWeak(q.id)).sort((a,b)=>(S.stats[b.id].ng-S.stats[a.id].ng)).slice(0,25);
  document.getElementById("weakList").innerHTML=weak.length
    ? weak.map(q=>`<div class="catrow"><span class="nm" style="font-weight:500;font-size:13.5px;">
        ${esc(q.q.replace(/\n+/g," ").slice(0,52))}</span>
        <span class="pct" style="color:var(--ng);">×${S.stats[q.id].ng}</span></div>`).join("")
      +`<div class="row"><button class="btn sub" id="drillWeak">苦手だけ練習する</button></div>`
    : '<div class="empty">まだありません。2回以上間違えた問題がここに出ます。</div>';
  const dw=document.getElementById("drillWeak");
  if(dw)dw.onclick=()=>{S.mode="weak";save();renderSettings();startSession();};

  document.getElementById("histList").innerHTML=S.hist.length
    ? S.hist.slice(0,10).map(h=>{
        const d=new Date(h.d);
        return `<div class="catrow"><span class="nm" style="font-weight:500;font-size:13.5px;">
          ${d.getMonth()+1}/${d.getDate()} ${h.mock?"模試":"練習"}</span>
          <span class="pct">${h.ok}/${h.n}</span></div>`;
      }).join("")
    : '<div class="empty">模試の結果がここに残ります。</div>';
}
document.getElementById("resetBtn").onclick=()=>{
  if(!confirm("学習の進捗をすべて消します。よろしいですか？"))return;
  S.stats={};S.hist=[];save();renderProgress();
};

/* ========= 教材 ========= */
function renderRead(){
  const q=(document.getElementById("readQ").value||"").trim();
  const list=q?MANUAL.filter(p=>(p.path+p.text).includes(q)):MANUAL;
  document.getElementById("readList").innerHTML=
    `<div class="muted" style="font-size:12.5px;margin-bottom:8px;">${list.length}ページ</div>`
    +list.slice(0,60).map((p,i)=>`
      <details style="border-bottom:1px solid var(--line);padding:10px 0;">
        <summary style="cursor:pointer;font-size:14px;font-weight:700;">${esc(p.path)}</summary>
        <div style="white-space:pre-wrap;font-size:14px;color:var(--sub);margin-top:9px;line-height:1.8;">${esc(p.text)}</div>
      </details>`).join("");
}
document.getElementById("readQ").addEventListener("input",renderRead);

/* ========= 画面切替 ========= */
function show(v){
  document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("on",b.dataset.v===v));
  document.querySelectorAll(".view").forEach(el=>el.classList.remove("on"));
  document.getElementById("v-"+v).classList.add("on");
  if(v==="prog")renderProgress();
  if(v==="set")renderSettings();
  if(v==="read")renderRead();
  window.scrollTo({top:0});
}
document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>show(b.dataset.v));

/* 試験日までの残り */
(function(){
  const days=Math.ceil((TEST_DATE-new Date())/864e5);
  const done=Q.filter(q=>isMastered(q.id)).length;
  document.getElementById("dday").textContent=
    (days>0?`本番まで ${days}日　`:"")+`全${Q.length}問中 ${done}問を習得`;
})();

const vb=document.createElement("div");
vb.id="ver";vb.textContent=APP_VERSION;
vb.onclick=()=>{const u=new URL(location.href);u.searchParams.set("v",Date.now());location.replace(u);};
document.body.appendChild(vb);

renderSettings();
startSession();
</script>
